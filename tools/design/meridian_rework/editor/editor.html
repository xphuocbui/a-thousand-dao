<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Map Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Kinh Mạch Đồ editor. Layout: a tool bar on top, the map on a night-silk plate, an inspector on the right, a status
   line at the bottom. The plate stays dark in both themes (it is the art); the chrome follows the theme. */
:root{
  --bg:#eceee9; --panel:#fbfbf8; --panel2:#f2f3ef; --fg:#1a1f25; --muted:#5b6570; --line:#d3d7d1; --accent:#a8792a; --accent-fg:#fff;
  --ok:#2f8a5b; --warn:#b7791f; --bad:#c2413a; --sel:#3fb8ff; --chip:#e7e9e3;
  --plate:#0b0f15; --plate2:#05070b;
  --f-display:"Marcellus","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1217;--panel:#151a20;--panel2:#1b2129;--fg:#e5e8eb;--muted:#9aa4ae;--line:#29323c;--accent:#d9a84a;--accent-fg:#1a1205;--chip:#222a33;--ok:#4cc38a;--warn:#e0a640;--bad:#ef6a5f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1217;--panel:#151a20;--panel2:#1b2129;--fg:#e5e8eb;--muted:#9aa4ae;--line:#29323c;--accent:#d9a84a;--accent-fg:#1a1205;--chip:#222a33;--ok:#4cc38a;--warn:#e0a640;--bad:#ef6a5f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--f-body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 9px;line-height:1.3}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 7px;min-width:0}
textarea{resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%}
/* top bar */
#top{display:flex;flex-wrap:nowrap;align-items:center;gap:6px 8px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
#top>*{flex:none}
#top .brand{font:400 18px/1 var(--f-display);white-space:nowrap}
@media (max-width:1720px) and (min-width:821px){#top .brand{display:none}}  /* the version name already says what is open */
#top .grp{display:flex;align-items:center;gap:4px}
#top .sep{width:1px;height:22px;background:var(--line)}
#verBtn{font-family:var(--f-mono);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#saveState{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap;display:inline-block;width:6.5em}
#saveState.dirty{color:var(--warn)}
#find{width:150px}
#top .grp:has(#find){flex:1 1 auto;min-width:120px}#top .grp:has(#find) #find{width:100%;max-width:220px}
#modeSel{width:132px}#snapSel{width:118px}#boxSel{width:104px}
#foundN{font:12px var(--f-mono);color:var(--muted);min-width:5ch}
.tools button{min-width:34px}
.kbd{font:500 10.5px var(--f-mono);color:var(--muted);margin-left:3px}
button.on .kbd{color:inherit;opacity:.7}
/* main */
#main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
#main.noside{grid-template-columns:minmax(0,1fr) 0}
#stage{position:relative;min-height:0;background:radial-gradient(circle at 50% 50%,var(--plate) 0%,var(--plate2) 80%);overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#mini{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;width:180px;height:180px;border:1px solid #2b3440;border-radius:6px;background:rgba(5,7,11,.78);cursor:pointer}
#tip{position:absolute;pointer-events:none;max-width:340px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:7px 9px;font-size:12px;line-height:1.45;box-shadow:0 6px 22px rgba(0,0,0,.35);z-index:3}
#tip ul{margin:3px 0 0;padding-left:16px}#tip .meta{color:var(--muted)}#tip .cost{font:500 11.5px var(--f-mono);color:var(--accent)}
#hud{position:absolute;left:10px;top:10px;font:500 12px var(--f-mono);color:#e9e3d2;background:rgba(5,7,11,.6);padding:3px 8px;border-radius:4px;pointer-events:none}
#hud:empty{display:none}
/* side */
#side{background:var(--panel);border-left:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;overflow:hidden}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:8px 4px;color:var(--muted);border-bottom:2px solid transparent}
#tabs button.on{color:var(--fg);border-bottom-color:var(--accent);background:transparent}
.pane{overflow:auto;padding-block:10px 40px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));min-height:0}
.pane[hidden]{display:none}
h2{font:400 18px/1.2 var(--f-display);margin:2px 0 8px}
h3{font:600 11px/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.row{display:grid;grid-template-columns:78px minmax(0,1fr);gap:6px;align-items:center;margin:5px 0}
.row>label{color:var(--muted);font-size:12px}
.row input,.row select{width:100%}
.seg{display:flex;flex-wrap:wrap;gap:3px}
.seg button{padding:3px 7px;font-size:12px}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.btns button{font-size:12px;padding:3px 8px}
.hint{color:var(--muted);font-size:12px}
.mods{display:grid;gap:5px}
.mod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;align-items:start;border:1px solid var(--line);border-radius:5px;padding:4px;background:var(--panel2)}
.mod textarea{width:100%;border:0;background:transparent;padding:2px 3px;min-height:22px;height:auto;resize:none;overflow:hidden;line-height:1.4}
.mod .side{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.mod .ops{display:flex;gap:2px}
.mod .ops button{padding:0 5px;font-size:11px;border-color:transparent;background:transparent;color:var(--muted)}
.mod .ops button:hover{color:var(--fg);border-color:var(--line)}
.badge{font:500 10px/1.5 var(--f-mono);padding:0 5px;border-radius:3px;white-space:nowrap}
.badge.cat{background:rgba(47,138,91,.16);color:var(--ok)}
.badge.free{background:rgba(183,121,31,.18);color:var(--warn)}
.badge.gen{background:var(--chip);color:var(--muted)}
.union .count{font:11px var(--f-mono);color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:3px 5px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:11px}
td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.issue{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:3px 2px;font-size:12px}
.issue:hover{background:var(--panel2)}
details{border:1px solid var(--line);border-radius:5px;margin:6px 0;background:var(--panel)}
details>summary{cursor:pointer;padding:5px 8px;display:flex;justify-content:space-between;gap:8px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary .n{font-family:var(--f-mono)}
details>summary .n.bad{color:var(--bad);font-weight:600}
details>summary .n.ok{color:var(--ok)}
details .list{max-height:260px;overflow:auto;padding:0 6px 6px}
.vlist{display:grid;gap:4px}
.ver{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;border:1px solid var(--line);border-radius:5px;padding:6px 8px}
.ver.cur{border-color:var(--accent)}
.ver .nm{font:500 12.5px var(--f-mono);overflow-wrap:anywhere}
.ver .sub{grid-column:1/-1;color:var(--muted);font-size:11.5px}
.totals{font:12px var(--f-mono);display:grid;gap:1px}
.clist{display:grid;gap:2px}
.clist button{display:grid;grid-template-columns:minmax(0,1fr) auto;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:4px 2px}
.clist button:hover{background:var(--panel2)}
.clist .sub{color:var(--muted);font-size:11px}
/* status */
#status{display:flex;gap:16px;align-items:center;padding-block:3px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
#status .mono{font-family:var(--f-mono)}
#hint{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
/* modal and toasts */
#modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
#modalWrap[hidden]{display:none}
#modal{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 60px rgba(0,0,0,.45);width:min(560px,100%);max-height:min(86vh,900px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
#modal.wide{width:min(860px,100%)}
#modal header{padding:12px 14px 6px}
#modal .body{padding:4px 14px 10px;overflow:auto}
#modal footer{display:flex;gap:6px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel2);flex-wrap:wrap;align-items:center}
.pk-tabs{display:flex;gap:4px;margin:6px 0}
.pk-list{display:grid;gap:2px;max-height:52vh;overflow:auto;margin-top:6px}
.pk-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;border:1px solid transparent;border-radius:5px;padding:5px 8px;background:transparent}
.pk-item.act{border-color:var(--accent);background:var(--panel2)}
.pk-item .nm{font-weight:500}
.pk-item .sub{grid-column:1/-1;color:var(--muted);font-size:11.5px}
.pk-item .val{font:12px var(--f-mono);color:var(--accent);white-space:nowrap}
.pk-grp{font:600 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 8px 2px}
#toasts{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);display:grid;gap:6px;z-index:30;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:6px 12px;border-radius:6px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.3);text-align:center}
.help{columns:2 260px;column-gap:24px;font-size:12.5px}
.help div{break-inside:avoid;display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px dotted var(--line)}
.help kbd{font:500 11.5px var(--f-mono);background:var(--chip);border-radius:3px;padding:0 5px;white-space:nowrap}
.help h4{margin:10px 0 4px;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);break-after:avoid}
body.readonly .edit-only{display:none!important}
@media (max-width:820px){
  body{overflow:auto}
  #app{height:auto;min-height:100vh;grid-template-rows:auto auto auto auto}
  #main{grid-template-columns:minmax(0,1fr);grid-template-rows:72vh auto}
  #side{border-left:0;border-top:1px solid var(--line);max-height:none}
  #mini{width:120px;height:120px}
  #find{width:140px}
  #top{flex-wrap:wrap;overflow-x:visible}
  #status{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <span class="brand" title="Kinh Mạch Đồ">Meridian Map</span>
    <div class="grp"><button id="verBtn" title="Versions (open, save as new)">…</button><span id="saveState"></span></div>
    <div class="grp edit-only"><button id="saveBtn" class="primary" title="Save over this version (Ctrl+S)">Save</button><button id="saveAsBtn" title="Save as a new version (Ctrl+Shift+S)">Save as…</button></div>
    <span class="sep edit-only"></span>
    <div class="grp edit-only"><button id="undoBtn" title="Undo (Ctrl+Z)">↶</button><button id="redoBtn" title="Redo (Ctrl+Shift+Z)">↷</button></div>
    <span class="sep"></span>
    <div class="grp tools" role="group" aria-label="Tools">
      <button data-tool="select" title="Select and move (V)">Select<span class="kbd">V</span></button>
      <button data-tool="add" class="edit-only" title="Add nodes (N)">Add<span class="kbd">N</span></button>
      <button data-tool="connect" class="edit-only" title="Connect nodes (C)">Link<span class="kbd">C</span></button>
      <button data-tool="pan" title="Pan (H, or hold Space)">Pan<span class="kbd">H</span></button>
      <select id="boxSel" class="edit-only" aria-label="What a box selects" title="What dragging a box over empty space selects (E cycles)"><option value="nodes">Box: nodes</option><option value="links">Box: links</option><option value="both">Box: both</option></select>
    </div>
    <span class="sep edit-only"></span>
    <div class="grp edit-only">
      <select id="snapSel" aria-label="Snapping" title="Snapping while you drag (G cycles; hold Ctrl while dragging to skip it)">
        <option value="guides">Snap: guides</option><option value="0.25">Snap: grid 0.25</option><option value="0.5">Snap: grid 0.5</option><option value="1">Snap: grid 1</option><option value="off">Snap: off</option>
      </select>
    </div>
    <div class="grp">
      <select id="modeSel" aria-label="Colour by" title="Colour the map by">
        <option value="elem">Colour: element</option><option value="theme">Colour: theme</option><option value="kind">Colour: kind</option><option value="cluster">Colour: cluster</option><option value="region">Colour: region</option><option value="dist">Colour: points from start</option><option value="mods">Colour: modifier source</option>
      </select>
      <label class="hint" title="Node names when zoomed in"><input type="checkbox" id="labChk" checked> Names</label>
      <label class="hint"><input type="checkbox" id="issChk" checked> Issues</label>
    </div>
    <div class="grp"><input id="find" type="search" placeholder="Find (Ctrl+F)" aria-label="Find nodes by name, theme, cluster or modifier"><span id="foundN"></span></div>
    <div class="grp" style="margin-left:auto"><button id="sideBtn" title="Show or hide the panel (\)">Panel</button><button id="helpBtn" title="Shortcuts (?)">?</button></div>
  </header>
  <main id="main">
    <div id="stage"><canvas id="cv" aria-label="The meridian map. Drag to select or move, scroll to zoom."></canvas><canvas id="mini" aria-label="Minimap"></canvas><div id="tip" hidden></div><div id="hud"></div></div>
    <aside id="side">
      <nav id="tabs"><button data-tab="inspect" class="on">Inspect</button><button data-tab="checks">Checks</button><button data-tab="clusters">Clusters</button><button data-tab="version">Version</button></nav>
      <section class="pane" id="pane-inspect"></section>
      <section class="pane" id="pane-checks" hidden></section>
      <section class="pane" id="pane-clusters" hidden></section>
      <section class="pane" id="pane-version" hidden></section>
    </aside>
  </main>
  <footer id="status"><span id="hint"></span><span class="mono" id="coords"></span><span class="mono" id="zoomTxt"></span><span class="mono" id="counts"></span></footer>
</div>
<div id="modalWrap" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toasts"></div>
<script id="embed" type="application/json">__EMBED__</script>
<script>
'use strict';
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r3=v=>Math.round(v*1000)/1000;
const clone=o=>o==null?null:structuredClone(o);

// ---------------------------------------------------------------------------------------------------------------
// Mode: served by serve.py (edit) or embedded data (read-only view published as an artifact)
let EMBED=null;try{const t=$('#embed').textContent.trim();if(t[0]==='{')EMBED=JSON.parse(t);}catch(_){}
const RO=!!(EMBED&&EMBED.readonly);
if(RO)document.body.classList.add('readonly');

// ---------------------------------------------------------------------------------------------------------------
// Model. Edges keep their curve as a bend ratio k = signed bulge / chord length (|k| <= 0.5, a half circle), so a
// curve keeps its shape when its ends move, rotate or scale. Files store the kit's form: the arc's circle centre.
const M={meta:{},extra:{},nodes:new Map(),edges:new Map(),clusters:new Map(),nextN:0,nextE:0,nextC:0};
let adj=new Map(), PAIR=new Map(), TOPO=0;      // node -> Set(edge ids); "a|b" -> edge id; topology version
const pk=(a,b)=>a<b?a+'|'+b:b+'|'+a;
let VER={name:null,mtime:null};let dirty=false;let savedRec=null;  // the undo record the file matches (null: none)
let CAT={modifiers:[],stats:[],effects:[]};
const KINDS=[['small','Minor','1'],['notable','Notable','2'],['keystone','Keystone','3'],['travel','Travel','4'],['start','Start','5']];
const KLABEL=Object.fromEntries(KINDS.map(k=>[k[0],k[1]]));

function arcToK(a,b,c){if(!c)return 0;const L=Math.hypot(b.x-a.x,b.y-a.y);if(L<1e-9)return 0;
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,nx=-(b.y-a.y)/L,ny=(b.x-a.x)/L,r=Math.hypot(a.x-c[0],a.y-c[1]);
  const h=r-Math.sqrt(Math.max(0,r*r-L*L/4));const side=(c[0]-mx)*nx+(c[1]-my)*ny;return (side>0?-h:h)/L;}
function geom(e){const a=M.nodes.get(e.a),b=M.nodes.get(e.b);if(!a||!b)return null;
  const L=Math.hypot(b.x-a.x,b.y-a.y),k=Math.max(-.5,Math.min(.5,e.k||0));
  if(Math.abs(k)<1e-4||L<1e-9)return {a,b,L,arc:null,mid:[(a.x+b.x)/2,(a.y+b.y)/2]};
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,nx=-(b.y-a.y)/L,ny=(b.x-a.x)/L,s=k*L,as=Math.abs(s),sg=Math.sign(s);
  const r=(L*L/4+s*s)/(2*as),cx=mx-nx*sg*(r-as),cy=my-ny*sg*(r-as);
  const ta=Math.atan2(a.y-cy,a.x-cx);let d=Math.atan2(b.y-cy,b.x-cx)-ta;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
  return {a,b,L,arc:{cx,cy,r,ta,d},mid:[mx+nx*s,my+ny*s]};}
function pathEdge(p,g){p.moveTo(g.a.x,g.a.y);if(g.arc){const A=g.arc;p.arc(A.cx,A.cy,A.r,A.ta,A.ta+A.d,A.d<0);}else p.lineTo(g.b.x,g.b.y);}
function onEdge(g,t){if(!g.arc)return [g.a.x+(g.b.x-g.a.x)*t,g.a.y+(g.b.y-g.a.y)*t];const A=g.arc,th=A.ta+A.d*t;return [A.cx+A.r*Math.cos(th),A.cy+A.r*Math.sin(th)];}
function samplesOf(g,step){if(!g.arc)return [[g.a.x,g.a.y],[g.b.x,g.b.y]];const n=Math.max(2,Math.ceil(Math.abs(g.arc.d)*g.arc.r/step));const o=[];for(let i=0;i<=n;i++)o.push(onEdge(g,i/n));return o;}

function rebuildTopo(){adj=new Map();PAIR=new Map();for(const id of M.nodes.keys())adj.set(id,new Set());
  for(const e of M.edges.values()){if(!adj.has(e.a)||!adj.has(e.b))continue;adj.get(e.a).add(e.id);adj.get(e.b).add(e.id);PAIR.set(pk(e.a,e.b),e.id);}TOPO++;}
const other=(e,id)=>e.a===id?e.b:e.a;
function neighbours(id){const o=[];for(const eid of adj.get(id)||[]){const e=M.edges.get(eid);if(e)o.push(other(e,id));}return o;}

function loadDoc(doc){
  M.nodes.clear();M.edges.clear();M.clusters.clear();M.meta=doc.meta||{};M.extra={};
  for(const k in doc)if(!['meta','nodes','edges','clusters'].includes(k))M.extra[k]=doc[k];
  const nid=new Map();
  (doc.nodes||[]).forEach((n,i)=>{const o={...n,id:i};nid.set(n.id,i);o.mods=Array.isArray(n.mods)?n.mods.slice():[];
    o.mod_refs=Array.isArray(n.mod_refs)&&n.mod_refs.length===o.mods.length?n.mod_refs.slice():o.mods.map(()=> 'gen');M.nodes.set(i,o);});
  const cid=new Map();(doc.clusters||[]).forEach((c,i)=>{cid.set(c.id,i);const o={...c,id:i};delete o.n;M.clusters.set(i,o);});
  for(const n of M.nodes.values())n.cluster=n.cluster!=null&&cid.has(n.cluster)?cid.get(n.cluster):null;

// Checks: run in the background after edits; click an issue to go to it
let chkTimer=null;

function runChecks(){const t0=performance.now(),N=M.nodes,spacing=+($('#ck-sp')?.value||0.6);
  const sts=starts(),reach=new Set(),per={};
  for(const s of sts){const d=bfs(s.id);for(const k of d.keys())reach.add(k);
    let web9=0,web9n=0,fn=null,nk=null,far=0;for(const [id,v] of d){const n=N.get(id);if(v<=9){web9++;if(n.kind==='notable')web9n++;}if(n.kind==='notable'&&(fn==null||v<fn))fn=v;if(n.kind==='keystone'&&(nk==null||v<nk))nk=v;if(v>far)far=v;}

  const eg=new Map();bb.forEach((b,i)=>{if(!b)return;for(let gx=Math.floor(b[0]/4);gx<=Math.floor(b[2]/4);gx++)for(let gy=Math.floor(b[1]/4);gy<=Math.floor(b[3]/4);gy++){const k=gk(gx,gy);let c=eg.get(k);if(!c)eg.set(k,c=[]);c.push(i);}});
  const cr=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);const seen=new Set(),cross=[];
  for(const c of eg.values())for(let x=0;x<c.length;x++)for(let y=x+1;y<c.length;y++){const i=c[x],j=c[y],key=i<j?i*100000+j:j*100000+i;if(seen.has(key))continue;seen.add(key);
    const A=es[i],B=es[j];if(A.a===B.a||A.a===B.b||A.b===B.a||A.b===B.b)continue;const bi=bb[i],bj=bb[j];if(bi[2]<bj[0]||bj[2]<bi[0]||bi[3]<bj[1]||bj[3]<bi[1])continue;
    const si=S[i],sj=S[j];let hit=null;for(let a=0;a<si.length-1&&!hit;a++)for(let b=0;b<sj.length-1;b++){const p1=si[a],p2=si[a+1],p3=sj[b],p4=sj[b+1];
      if(cr(p1,p2,p3)*cr(p1,p2,p4)<0&&cr(p3,p4,p1)*cr(p3,p4,p2)<0){const d1=cr(p3,p4,p1),d2=cr(p3,p4,p2),t=d1/(d1-d2);hit=[p1[0]+(p2[0]-p1[0])*t,p1[1]+(p2[1]-p1[1])*t];break;}}
    if(hit)cross.push([A.id,B.id,hit]);}
  // links that pass over a node
  const graze=[];es.forEach((e,i)=>{const g=geom(e);if(!g)return;const L=g.arc?Math.abs(g.arc.d)*g.arc.r:g.L,n=Math.max(2,Math.ceil(L/0.25));const hit=new Set();
    for(let k=1;k<n;k++){const [x,y]=onEdge(g,k/n);for(const m of near(x,y,0.28))if(m.id!==e.a&&m.id!==e.b&&!hit.has(m.id)){hit.add(m.id);graze.push([e.id,m.id]);}}});
  const isolated=[],empty=[],free=[];let gen=0,catN=0;for(const n of N.values()){if(!(adj.get(n.id)||new Set()).size)isolated.push(n.id);

let rcT=null;function renderChecksSoon(){clearTimeout(rcT);rcT=setTimeout(()=>{if(tab==='checks')renderChecks();},200);}
function renderChecks(){const p=$('#pane-checks');if(!CHK){p.innerHTML='<h2>Checks</h2><p class="hint">Running…</p>';return;}const C=CHK;const live=id=>M.nodes.has(id);C.unreach=C.unreach.filter(live);C.isolated=C.isolated.filter(live);C.empty=C.empty.filter(live);C.free=C.free.filter(live);C.overlap=C.overlap.filter(([a,b])=>live(a)&&live(b));C.cross=C.cross.filter(([a,b])=>M.edges.has(a)&&M.edges.has(b));C.graze=C.graze.filter(([e,n])=>M.edges.has(e)&&live(n));const nm=id=>{const n=M.nodes.get(id);return n?esc(n.name||KLABEL[n.kind])+` <span class="hint">#${id}</span>`:'#'+id;};
  const sec=(title,list,fmt,bad=true,help='')=>`<details ${list.length&&bad&&list.length<200?'open':''}><summary><span>${title}</span><span class="n ${list.length?(bad?'bad':''):'ok'}">${list.length.toLocaleString()}</span></summary>${help?`<div class="hint" style="padding:0 8px 4px">${help}</div>`:''}<div class="list">${list.slice(0,300).map((x,i)=>`<button class="issue" data-k="${title}" data-i="${i}">${fmt(x)}</button>`).join('')}${list.length>300?`<div class="hint">…and ${list.length-300} more</div>`:''}</div></details>`;
  const lists={'Unreachable from every start':[C.unreach,id=>nm(id),'Pink rings on the map.'],'Too close together':[C.overlap,([a,b,d])=>`${nm(a)} / ${nm(b)} · ${r3(d)}`,'Orange rings on the map.'],
    'Crossing links':[C.cross,([a,b])=>{const A=M.edges.get(a),B=M.edges.get(b);return A&&B?`${nm(A.a)}–${nm(A.b)} × ${nm(B.a)}–${nm(B.b)}`:'(changed)';},'Red crosses on the map.'],
    'Links passing over a node':[C.graze,([e,n])=>{const E=M.edges.get(e);return E?`${nm(E.a)}–${nm(E.b)} over ${nm(n)}`:'(changed)';},''],
    'Nodes with no links':[C.isolated,id=>nm(id),''],'Duplicate links':[C.dup,id=>{const E=M.edges.get(id);return E?`${nm(E.a)}–${nm(E.b)}`:'(changed)';},''],
    'Minor, notable or keystone with nothing on it':[C.empty,id=>nm(id),''],'Nodes with free-text lines':[C.free,id=>nm(id),'Lines typed by hand, not from the catalogues. Fine while drafting; worth a look before a version ships.']};
  p.innerHTML=`<h2>Checks</h2><div class="hint">Last run ${C.at.toLocaleTimeString()} in ${C.ms} ms. They re-run on their own after each edit. <button id="ck-run" style="margin-left:6px">Run now</button></div>
   <div class="row" style="margin-top:8px"><label for="ck-sp">Spacing</label><input type="number" id="ck-sp" value="${$('#ck-sp')?.value||0.6}" step="0.05" min="0.1" title="Two nodes closer than this count as too close (the kit uses 0.6)"></div>
   ${Object.entries(lists).map(([t,[l,f,h]],i)=>sec(t,l,f,i!==7,h)).join('')}
   <div class="hint" style="margin:4px 0 10px">Modifier sources: ${C.catN.toLocaleString()} nodes use catalogue lines, ${C.gen.toLocaleString()} still hold generator placeholders. Colour by <i>Modifier source</i> to see them.</div>
   <h3>From each start</h3><div class="row"><label for="ck-start">Distances</label><select id="ck-start">${starts().map(s=>`<option value="${s.id}" ${s.id===startId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
   <table><tr><th>Start</th><th title="Nodes within 9 points">≤ 9</th><th title="Points to the first notable">Notable</th><th title="Points to the nearest keystone">Key</th><th title="Points to the farthest node">Far</th></tr>
   ${Object.entries(C.per).map(([id,v])=>`<tr><td><button class="issue" data-start="${id}" style="padding:0">${esc(v.name.replace(/ start.*/,''))}</button></td><td class="n">${v.web9}</td><td class="n">${v.fn??'—'}</td><td class="n">${v.nk??'—'}</td><td class="n">${v.far}</td></tr>`).join('')}</table>`;
  p.querySelector('#ck-run').onclick=runChecks;p.querySelector('#ck-sp').onchange=runChecks;
  p.querySelector('#ck-start').onchange=e=>{startId=+e.target.value;DISTC=null;colCache.clear();miniDirty=true;draw.req();toast('Distances now from '+M.nodes.get(startId).name);};
  p.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{select([+b.dataset.start]);frame([+b.dataset.start],200);});
  p.querySelectorAll('.issue[data-k]').forEach(b=>b.onclick=()=>{const [l]=lists[b.dataset.k],x=l[+b.dataset.i];let ns=[],es=[];
    if(b.dataset.k==='Crossing links'){es=[x[0],x[1]].filter(i=>M.edges.has(i));}else if(b.dataset.k==='Too close together')ns=[x[0],x[1]];else if(b.dataset.k==='Links passing over a node'){es=[x[0]];ns=[x[1]];}

  const go=async()=>{const name=$('#sa-name').value.trim();if(!/^[A-Za-z0-9][A-Za-z0-9._-]{0,80}$/.test(name))return toast('Use letters, digits, dot, dash or underscore');if(taken.has(name))return toast('That name is taken');
    const doc=serialize();doc.meta={...doc.meta,parent:VER.name,note:$('#sa-note').value};const r=await api('/api/versions/'+encodeURIComponent(name),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(doc)});
    if(!r.ok)return toast('Save failed: '+(r.body?.error||r.status));const old=VER.name;VER={name:r.body.name,mtime:r.body.mtime};M.meta=r.body.meta||{...M.meta,name:VER.name,parent:old,note:doc.meta.note,source:'editor'};closeModal();markSaved();dropDraft(old);history.replaceState(null,'','?v='+encodeURIComponent(VER.name));toast('Saved as '+VER.name);if(tab==='version')renderVersion();};
  $('#sa-ok').onclick=go;$('#sa-cancel').onclick=closeModal;$('#sa-name').addEventListener('keydown',e=>{if(e.key==='Enter')go();});$('#sa-name').select();}
async function renderVersion(){const p=$('#pane-version');const m=M.meta||{};
  p.innerHTML=`<h2>${esc(VER.name||m.name||'Version')}</h2><table><tr><td>Created</td><td>${esc(m.created||'—')}</td></tr><tr><td>Saved</td><td>${esc(m.saved||'—')}</td></tr><tr><td>Source</td><td>${esc(m.source||'—')}</td></tr><tr><td>From</td><td>${esc(m.parent||'—')}</td></tr></table>
   <div class="row edit-only"><label for="v-note">Note</label><input type="text" id="v-note" value="${esc(m.note||'')}"></div>${RO?`<p>${esc(m.note||'')}</p>`:''}
   <div class="btns edit-only"><button class="primary" id="v-save">Save</button><button id="v-saveas">Save as new…</button></div>
   <p class="hint edit-only">Save overwrites only this version (its previous copy goes to versions/.prev/). A generator run always makes a new one.</p>
   ${SERVER?'<h3>All versions</h3><div class="vlist" id="v-list"><div class="hint">Loading…</div></div>':''}`;
  if(RO)return;const vn=p.querySelector('#v-note');vn.addEventListener('input',()=>{M.meta={...M.meta,note:vn.value};metaDirty=true;markDirty(true);scheduleDraft();});
  p.querySelector('#v-save').onclick=save;p.querySelector('#v-saveas').onclick=saveAs;
  await listVersions();const L=p.querySelector('#v-list');if(!L)return;L.innerHTML=VERS.map(v=>`<div class="ver ${v.name===VER.name?'cur':''}"><span class="nm">${esc(v.name)}</span>${v.name===VER.name?'<span class="hint">open</span>':`<button data-open="${esc(v.name)}">Open</button>`}<span class="sub">${new Date(v.mtime*1000).toLocaleString()} · ${(v.bytes/1e6).toFixed(1)} MB${v.meta?.source?' · '+esc(v.meta.source):''}${v.meta?.note?'<br>'+esc(v.meta.note):''}</span></div>`).join('')||'<div class="hint">No versions yet.</div>';
  L.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openVersion(b.dataset.open));}
// drafts: unsaved edits survive a closed tab (IndexedDB, this browser only)
const IDB={db:null,async open(){if(this.db)return this.db;this.db=await new Promise((res,rej)=>{const r=indexedDB.open('kmd-editor',1);r.onupgradeneeded=()=>r.result.createObjectStore('drafts');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return this.db;},
  async op(mode,fn){try{const db=await this.open();return await new Promise((res,rej)=>{const t=db.transaction('drafts',mode),q=fn(t.objectStore('drafts'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}catch(_){return null;}}};
let draftT=null;function scheduleDraft(){if(RO||!VER.name)return;clearTimeout(draftT);draftT=setTimeout(()=>{if(dirty)IDB.op('readwrite',s=>s.put({base:VER.mtime,at:Date.now(),doc:serialize()},VER.name));},3000);}
function dropDraft(name){clearTimeout(draftT);IDB.op('readwrite',s=>s.delete(name||VER.name));}
async function offerDraft(){if(RO)return;const d=await IDB.op('readonly',s=>s.get(VER.name));if(!d||!d.doc)return;
  const same=Math.abs(d.base-VER.mtime)<1e-6;const c=await choose('Unsaved edits found',`<p>This browser kept edits to <b>${esc(VER.name)}</b> from ${new Date(d.at).toLocaleString()} that were never saved.</p>${same?'':'<p class="hint">The file has changed on disk since then; restoring puts the old edits over the newer file once you save.</p>'}`,[['drop','Discard them'],['keep','Restore']]);
  if(c==='keep'){loadDoc(d.doc);M.meta={...M.meta,name:VER.name};metaDirty=true;markDirty(true);fitAll();runChecks();toast('Restored unsaved edits');}else if(c==='drop')dropDraft();}
window.addEventListener('beforeunload',e=>{if(dirty&&!RO){e.preventDefault();e.returnValue='';}});

// ---------------------------------------------------------------------------------------------------------------
// Modal, toasts, help
let modalResolve=null;
function openModal(head,body,foot,wide){const m=$('#modal');m.className=wide?'wide':'';m.innerHTML=`<header>${head}</header><div class="body">${body}</div><footer>${foot||''}</footer>`;$('#modalWrap').hidden=false;}
function closeModal(){$('#modalWrap').hidden=true;$('#modal').innerHTML='';if(modalResolve){const r=modalResolve;modalResolve=null;r(null);}}
$('#modalWrap').addEventListener('pointerdown',e=>{if(e.target.id==='modalWrap')closeModal();});
function choose(title,html,opts){return new Promise(res=>{openModal(`<h2 style="margin:0">${esc(title)}</h2>`,html,opts.map(([v,l],i)=>`<button data-ch="${v}" class="${i===opts.length-1?'primary':''}">${l}</button>`).join(''));
  modalResolve=res;$$('[data-ch]').forEach(b=>b.onclick=()=>{modalResolve=null;closeModal();res(b.dataset.ch);});});}
async function confirmDiscard(){const c=await choose('Unsaved changes',`<p>${esc(VER.name)} has changes that are not saved.</p>`,[['cancel','Cancel'],['discard','Discard them'],['save','Save first']]);
  if(c==='save'){await save();return !dirty;}if(c==='discard'){dropDraft();return true;}return false;}
function toast(t){const box=$('#toasts');while(box.children.length>=3)box.firstChild.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;box.appendChild(d);setTimeout(()=>d.remove(),2200);}
function help(){const K=(k,t)=>`<div><span>${t}</span><kbd>${k}</kbd></div>`;
  openModal('<h2 style="margin:0">Shortcuts</h2>',`<div class="help">
   <h4>Select and view</h4>${K('Click','Select a node or a link')}${K('E','Box selects nodes, links or both')}${K('Shift / Ctrl + click','Add or remove')}${K('Drag empty space','Box select (Shift adds)')}${K('Double-click node','Select its cluster')}${K('Ctrl+A','Select everything')}${K('Esc','Clear, or leave a tool')}${K('Scroll','Zoom')}${K('Space+drag, right or middle drag, H','Pan')}${K('F','Frame the selection')}${K('Shift+F','Fit the whole map')}${K('Ctrl+F','Find')}${K('Enter (in Find)','Next match')}
   ${RO?'':`<h4>Move and shape</h4>${K('Drag','Move (snaps to guides)')}${K('Ctrl while dragging','No snapping')}${K('Alt+drag','Copy and move')}${K('Arrows','Nudge 0.1')}${K('Shift / Ctrl + arrows','Nudge 1 / 0.02')}${K('R / Shift+R','Rotate 15° / −15°')}${K('[  ]','Shrink / grow 10 %')}${K('Shift+[  ]','Shrink / grow 2 %')}${K('M / Shift+M','Mirror ↔ / ↕')}${K('Box corners','Scale (Alt: from the centre)')}${K('Round handle','Rotate (Shift: 15° steps)')}${K('G','Cycle snapping')}${K('K','Lock or unlock')}
   <h4>Build</h4>${K('N','Add tool: click to place, linked to the selected node')}${K('Double-click empty','Add a node here')}${K('C','Link tool: click node, node, node…')}${K('L','Link selected (in click order); two: toggle')}${K('I','Put a node on the selected link')}${K('Drag a link','Curve it')}${K('X','Swap two nodes: places (links stay)')}${K('Shift+X','Swap positions (links follow)')}${K('Drag onto a node, Shift','Swap places')}${K('S','Straighten links')}${K('B','Curve links, again to flip')}${K('1 2 3 4 5','Minor, notable, keystone, travel, start')}${K('Ctrl+D','Duplicate')}${K('Ctrl+C / X / V','Copy, cut, paste at the cursor')}${K('Ctrl+G','New cluster from the selection')}${K('Delete','Delete')}${K('Shift+Delete','Delete and join its two neighbours')}${K('Enter','Edit the name')}
   <h4>File</h4>${K('Ctrl+S','Save over this version')}${K('Ctrl+Shift+S','Save as a new version')}${K('Ctrl+Z','Undo')}${K('Ctrl+Shift+Z / Ctrl+Y','Redo')}`}${K('\\','Hide or show the panel')}${K('?','This sheet')}</div>`,'<button class="primary" id="hl-ok">Close</button>',true);$('#hl-ok').onclick=closeModal;}
function toggleSide(){$('#main').classList.toggle('noside');setTimeout(resize,0);}

// ---------------------------------------------------------------------------------------------------------------
// Top bar wiring
$$('[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
$('#modeSel').addEventListener('change',e=>{mode=e.target.value;colCache.clear();miniDirty=true;draw.req();});
$('#snapSel').addEventListener('change',e=>{opt.snap=e.target.value;draw.req();});
$('#boxSel').addEventListener('change',e=>{opt.box=e.target.value;});
$('#labChk').addEventListener('change',e=>{opt.labels=e.target.checked;draw.req();});
$('#issChk').addEventListener('change',e=>{opt.issues=e.target.checked;draw.req();});
$('#saveBtn').onclick=save;$('#saveAsBtn').onclick=saveAs;$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;$('#helpBtn').onclick=help;$('#sideBtn').onclick=toggleSide;
$('#verBtn').onclick=()=>setTab('version');
function updUndo(){$('#undoBtn').disabled=!HIST.length;$('#redoBtn').disabled=!FUT.length;$('#undoBtn').title='Undo'+(HIST.length?': '+HIST[HIST.length-1].label:'')+' (Ctrl+Z)';}
const findEl=$('#find');
function runFind(){const q=findEl.value.trim().toLowerCase();found=[];foundIx=-1;
  if(q.length>=2){for(const n of M.nodes.values()){const c=n.cluster!=null?M.clusters.get(n.cluster):null;const s=(n.name+' '+themeLabel(n.theme)+' '+(c?c.name:'')+' '+n.mods.join(' ')).toLowerCase();if(s.includes(q))found.push(n.id);}found.sort((a,b)=>(!(M.nodes.get(a).name||'').toLowerCase().includes(q))-(!(M.nodes.get(b).name||'').toLowerCase().includes(q)));}
  $('#foundN').innerHTML=q.length>=2?`${found.length}${found.length?` <button id="selFound" style="padding:0 5px;font-size:11px">select</button>`:''}`:'';const sf=$('#selFound');if(sf)sf.onclick=()=>{select(found);frame(found);};draw.req();}
findEl.addEventListener('input',runFind);
findEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&found.length){e.preventDefault();if(e.ctrlKey){select(found);frame(found);return;}foundIx=(foundIx+(e.shiftKey?-1:1)+found.length)%found.length;const id=found[foundIx];select([id]);frame([id],Math.min(W,H)/2.4);$('#foundN').firstChild.textContent=`${foundIx+1}/${found.length}`;}});
function updCoords(){const [x,y]=cursorW;$('#coords').textContent=`x ${x.toFixed(2)}  y ${y.toFixed(2)}  r ${Math.hypot(x,y).toFixed(2)}  ${((Math.atan2(x,-y)*180/Math.PI+360)%360).toFixed(1)}°`;}
function updZoom(){$('#zoomTxt').textContent=`zoom ${view.s.toFixed(1)}`;}
function refreshCounts(){const c=CHK;$('#counts').textContent=`${M.nodes.size.toLocaleString()} nodes · ${M.edges.size.toLocaleString()} links`+(SEL.size?` · ${SEL.size} selected`:'')+(SELE.size?` · ${SELE.size} links selected`:'')+(c?` · ${c.cross.length} crossings · ${c.overlap.length} too close · ${c.unreach.length} unreachable`:'');}

// ---------------------------------------------------------------------------------------------------------------
// Start
new ResizeObserver(resize).observe(stage);
// a handle for automated tests and the console (read-only use; edits go through the UI)
window.__kmd={M,SEL,SELE,HIST,pickHandle,handleBox,pickEdge,pickNode,geom,toS:(x,y)=>toS(x,y),view:()=>view,serialize,get CHK(){return CHK;},get ptrs(){return [...ptrs.keys()];},get drag(){return dragInfo&&dragInfo.type;},get pinch(){return !!pinch;},get VER(){return VER;},get dirty(){return dirty;},get CAT(){return CAT;}};
async function boot(){resize();setTool('select');updHint();
  if(EMBED){CAT=EMBED.catalogue||CAT;VER={name:EMBED.version||EMBED.doc?.meta?.name,mtime:null};loadDoc(EMBED.doc);markSaved();fitAll();runChecks();setTab('inspect');updUndo();return;}
  api('/api/catalogue').then(r=>{if(r.ok)CAT=r.body;if(r.body?.error)toast('Catalogue: '+r.body.error);});
  const want=new URLSearchParams(location.search).get('v');const vs=await listVersions();
  if(!vs.length){$('#pane-inspect').innerHTML='<h2>No versions yet</h2><p class="hint">Run <code>python -I tools/design/meridian_rework/build_tree.py</code> to generate one, then reload.</p>';return;}
  await openVersion(want&&vs.some(v=>v.name===want)?want:vs[0].name,{skipDirty:true});updUndo();}
boot();
})();
