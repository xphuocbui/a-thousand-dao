<title>Fight Replay Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one screen; header, three columns (you | fight log | foe), playback bar. Ink on rice paper. */
:root {
  --paper: #ecebe3;        /* xuan paper */
  --paper-2: #e2e0d5;      /* wash */
  --ink: #1c1e1d;          /* ink stick */
  --ink-2: #4b4f4c;        /* diluted ink */
  --ink-3: #8a8d87;        /* faint wash */
  --line: #c9c7bb;
  --you: #2f4a6b;          /* indigo ink */
  --foe: #a8382a;          /* cinnabar seal */
  --hp: #3d5a3f;           /* pine */
  --hp-lost: #c9a46b;
  --body: #8a6a3b;         /* bronze */
  --ward: #4f7f8c;         /* celadon */
  --qi: #3c5f9a;           /* lapis */
  --qi-res: #9fb0c9;
  --heal: #2f7d4f;
  --gold: #b0882a;
  --panel: rgba(255,255,255,.38);
  --shadow: rgba(28,30,29,.12);
  --font-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  /* damage types and elements */
  --t-phys: #4b4f4c; --t-fire: #c2412b; --t-cold: #4a8fb3; --t-lightning: #7b4fb3; --t-force: #8a6a3b;
  --t-chaos: #6b2f5f; --t-soul: #2f7d7a; --t-elem: #3c5f9a;
  --e-water: #3c5f9a; --e-earth: #9a7a3b; --e-metal: #6f7a80; --e-wood: #3d7a46; --e-ice: #5aa0bf; --e-thunder: #7b4fb3; --e-wind: #3f8f86;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #191b1a; --paper-2: #212423; --ink: #e8e5da; --ink-2: #b9b6ab; --ink-3: #7c7f78; --line: #343835;
  --you: #8fb0d8; --foe: #e07a63; --hp: #7fae7a; --hp-lost: #a3824f; --body: #c49a5c; --ward: #7fb6c2;
  --qi: #7f9fd6; --qi-res: #45546b; --heal: #6fc28f; --gold: #d6b25a; --panel: rgba(255,255,255,.04); --shadow: rgba(0,0,0,.4);
  --t-phys: #b9b6ab; --t-fire: #e6765c; --t-cold: #7fbedc; --t-lightning: #b08ee0; --t-force: #c49a5c; --t-chaos: #c47ab3; --t-soul: #6fc2bd; --t-elem: #7f9fd6;
  --e-water: #7f9fd6; --e-earth: #c9a76b; --e-metal: #a9b4ba; --e-wood: #7fbf86; --e-ice: #8fcbe3; --e-thunder: #b08ee0; --e-wind: #74c2b8;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #191b1a; --paper-2: #212423; --ink: #e8e5da; --ink-2: #b9b6ab; --ink-3: #7c7f78; --line: #343835;
  --you: #8fb0d8; --foe: #e07a63; --hp: #7fae7a; --hp-lost: #a3824f; --body: #c49a5c; --ward: #7fb6c2;
  --qi: #7f9fd6; --qi-res: #45546b; --heal: #6fc28f; --gold: #d6b25a; --panel: rgba(255,255,255,.04); --shadow: rgba(0,0,0,.4);
  --t-phys: #b9b6ab; --t-fire: #e6765c; --t-cold: #7fbedc; --t-lightning: #b08ee0; --t-force: #c49a5c; --t-chaos: #c47ab3; --t-soul: #6fc2bd; --t-elem: #7f9fd6;
  --e-water: #7f9fd6; --e-earth: #c9a76b; --e-metal: #a9b4ba; --e-wood: #7fbf86; --e-ice: #8fcbe3; --e-thunder: #b08ee0; --e-wind: #74c2b8;
  color-scheme: dark }

html, body { height: 100%; }
body {
  background: var(--paper);
  background-image: radial-gradient(ellipse at 15% 0%, var(--paper-2), transparent 55%),
                    radial-gradient(ellipse at 90% 100%, var(--paper-2), transparent 50%);
  color: var(--ink); font-family: var(--font-body); font-size: 14px;
}
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; max-width: 1500px; margin: 0 auto; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }

/* header */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.brand { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: .01em; }
.seal { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 4px; background: var(--foe);
  color: var(--paper); font-family: var(--font-display); font-weight: 700; font-size: 16px; margin-right: 8px; vertical-align: 3px; }
.top .meta { color: var(--ink-2); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.clock { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 18px; color: var(--ink); }
.fatigue { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--foe); border: 1px solid var(--foe);
  border-radius: 3px; padding: 1px 6px; }
.top select { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; max-width: 100%; }
.spacer { flex: 1; }

/* stage */
.stage { position: relative; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr); gap: 14px; min-height: 0; }
.col { min-width: 0; display: flex; flex-direction: column; gap: 8px; overflow: auto; padding: 2px; }
.col.B { text-align: right; }
.who { display: flex; align-items: center; gap: 10px; }
.col.B .who { flex-direction: row-reverse; }
.portrait { width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; cursor: help;
  font-family: var(--font-display); font-weight: 700; font-size: 26px; color: var(--paper);
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--side) 70%, var(--paper)), var(--side) 70%);
  box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px var(--side); position: relative; }
.col.A { --side: var(--you); } .col.B { --side: var(--foe); }
.portrait.down { filter: grayscale(1); opacity: .6; }
.who .nm { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.05; }
.who .sub { color: var(--ink-2); font-size: 12px; }
.tag-down { display: inline-block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; background: var(--ink); color: var(--paper); border-radius: 3px; padding: 1px 5px; margin-left: 6px; }

.bars { display: grid; gap: 4px; position: relative; }
.bar { position: relative; height: 15px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 8%, transparent); overflow: hidden; cursor: help; }
.bar.thin { height: 8px; }
.bar > i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; transition: width .12s linear; }
.col.B .bar > i { left: auto; right: 0; }
.bar .lag { background: var(--hp-lost); transition: width .6s ease-out .15s; }
.bar .hp { background: var(--hp); }
.bar .bd { background: var(--body); }
.bar .ws { background: var(--ward); }
.bar .qi { background: var(--qi); }
.bar .res { background: repeating-linear-gradient(45deg, var(--qi-res) 0 3px, transparent 3px 6px); }
.bar b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 6px;
  font-size: 10.5px; font-weight: 600; color: var(--paper); text-shadow: 0 0 2px var(--ink); font-variant-numeric: tabular-nums; pointer-events: none; }
.bar.thin b { display: none; }
.barlab { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); }
.col.B .barlab { flex-direction: row-reverse; }

.row { display: flex; flex-direction: column; gap: 4px; }
.row h4 { margin: 4px 0 0; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.icons { display: flex; flex-wrap: wrap; gap: 6px; }
.col.B .icons { justify-content: flex-end; }
.ic { position: relative; width: 50px; height: 50px; border-radius: 6px; border: 1.5px solid var(--el, var(--ink-2)); background: var(--panel);
  display: grid; place-items: center; cursor: pointer; overflow: hidden; padding: 0; }
.ic .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: color-mix(in srgb, var(--el, var(--ink-2)) 22%, transparent); }
.ic .gl { position: relative; font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--el, var(--ink)); }
.ic .bdg { position: absolute; font-size: 9.5px; font-weight: 600; line-height: 1; padding: 2px 3px; border-radius: 3px; background: var(--ink); color: var(--paper); }
.ic .bdg.stp { left: 2px; bottom: 2px; }
/* painted icons (assets/icons, art bible §7): image, dimmed while charging, an ivory ring that fills round the edge */
.ic.img { border: 0; background: #0b0d10; box-shadow: 0 1px 0 rgba(28,30,29,.35); }
.ic.img > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: filter .15s; }
.ic.img.charging > img { filter: brightness(.55) saturate(.55); }
.ic.img .fill { display: none; }
.ic .ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.ic .ring rect { fill: none; stroke: #f4f1e8; stroke-width: 3; stroke-linecap: round; }
.ic .ring rect.bg { stroke: rgba(244,241,232,.16); }
.ic .tick { position: absolute; right: 3px; bottom: 3px; width: 6px; height: 6px; border-radius: 50%; background: #f4f1e8; box-shadow: 0 0 4px #f4f1e8; }
.ic.charging .tick { display: none; }
.chip img { width: 16px; height: 16px; display: block; margin-left: -3px; }
.ic .bdg.emp { right: 2px; top: 2px; background: var(--gold); }
.ic .bdg.chg { right: 2px; bottom: 2px; }
.ic.flash { animation: flash .35s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--el, var(--ink)); background: color-mix(in srgb, var(--el, var(--ink)) 45%, transparent); transform: scale(1.08); }
  100% { box-shadow: 0 0 0 10px transparent; transform: scale(1); } }
.ic.sel { outline: 2px solid var(--side); outline-offset: 2px; }
.ic.small { width: 40px; height: 40px; }
.ic.small .gl { font-size: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; min-height: 22px; }
.col.B .chips { justify-content: flex-end; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 2px 7px; border-radius: 999px; cursor: help;
  border: 1px solid var(--el, var(--line)); color: var(--ink); background: var(--panel); font-variant-numeric: tabular-nums; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--el, var(--ink-2)); }
.chip.ctr { border-style: dashed; }
.chip.flash { animation: flash .35s ease-out; }
.none { font-size: 11px; color: var(--ink-3); }

/* centre log */
.logcol { min-width: 0; display: flex; flex-direction: column; gap: 6px; min-height: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0 10px; }
.loghead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.loghead h3 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 3px 9px; cursor: pointer; font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.filter { font-size: 12px; color: var(--ink-2); }
.filter button { border: 0; background: none; text-decoration: underline; cursor: pointer; color: var(--ink-2); padding: 0 2px; }
.log { flex: 1; overflow: auto; min-height: 0; font-size: 12.5px; display: flex; flex-direction: column; gap: 1px; }
.ln { display: grid; grid-template-columns: 44px 1fr; gap: 6px; padding: 3px 4px; border-radius: 3px; cursor: default; }
.ln.click { cursor: pointer; }
.ln.click:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.ln .tm { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; padding-top: 1px; }
.ln .tx { min-width: 0; overflow-wrap: anywhere; }
.ln.A .tx { border-left: 2px solid var(--you); padding-left: 6px; }
.ln.B .tx { border-left: 2px solid var(--foe); padding-left: 6px; }
.ln.minor { color: var(--ink-2); font-size: 11.5px; }
.ln .who-a { color: var(--you); font-weight: 600; } .ln .who-b { color: var(--foe); font-weight: 600; }
.dmg { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.k { display: inline-block; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; border-radius: 3px; padding: 0 4px; margin-left: 4px; border: 1px solid currentColor; }

/* overlays */
#links { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
#links path { fill: none; stroke-width: 2; stroke-linecap: round; opacity: .9; animation: link .45s ease-out forwards; }
@keyframes link { from { stroke-dashoffset: var(--len); opacity: .95 } 70% { stroke-dashoffset: 0; opacity: .9 } to { stroke-dashoffset: 0; opacity: 0 } }
.float { position: absolute; pointer-events: none; font-family: var(--font-mono); font-weight: 600; font-size: 14px; text-shadow: 0 1px 0 var(--paper), 0 0 3px var(--paper);
  animation: rise .75s ease-out forwards; white-space: nowrap; }
@keyframes rise { from { transform: translateY(0); opacity: 1 } to { transform: translateY(-34px); opacity: 0 } }
.tip { position: fixed; z-index: 30; max-width: min(340px, calc(100vw - 32px)); background: var(--paper); color: var(--ink); border: 1px solid var(--ink-2);
  border-radius: 5px; padding: 9px 11px; box-shadow: 0 6px 24px var(--shadow); font-size: 12.5px; line-height: 1.45; pointer-events: none; }
.tip h5 { margin: 0 0 3px; font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.tip .mut { color: var(--ink-2); font-size: 11.5px; }
.tip dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 6px 0 0; font-size: 11.5px; }
.tip dt { color: var(--ink-3); } .tip dd { margin: 0; font-variant-numeric: tabular-nums; }
.panel { position: absolute; z-index: 20; inset: 40px 6px auto 6px; background: var(--paper); border: 1px solid var(--ink-2); border-radius: 6px;
  box-shadow: 0 10px 34px var(--shadow); padding: 12px 14px; }
.panel h5 { margin: 0 0 6px; font-family: var(--font-display); font-size: 19px; }
.panel .close { position: absolute; top: 6px; right: 8px; border: 0; background: none; font-size: 18px; cursor: pointer; color: var(--ink-2); }
.steps { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
.steps .v { font-family: var(--font-mono); text-align: right; }
.steps .tot { border-top: 1px solid var(--line); padding-top: 3px; font-weight: 600; }
.result { position: absolute; z-index: 15; left: 50%; top: 40%; transform: translate(-50%,-50%); width: min(420px, 92%);
  background: var(--paper); border: 1px solid var(--ink); border-radius: 6px; padding: 16px 18px; box-shadow: 0 14px 40px var(--shadow); text-align: center; }
.result .big { font-family: var(--font-display); font-size: 30px; font-weight: 700; margin: 2px 0 6px; }
.result table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 8px 0; font-variant-numeric: tabular-nums; }
.result td, .result th { padding: 3px 4px; border-bottom: 1px solid var(--line); }
.result th { font-weight: 600; color: var(--ink-2); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 4px; padding: 5px 12px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }

/* controls */
.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 8px; }
.ctl .b { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 5px 10px; cursor: pointer; min-width: 34px; }
.ctl .b[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ctl .play { min-width: 74px; font-weight: 600; }
.scrub { flex: 1 1 220px; min-width: 160px; accent-color: var(--foe); }
.keys { font-size: 11px; color: var(--ink-3); }
kbd { font-family: var(--font-mono); font-size: 10.5px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }

@media (max-width: 900px) {
  .app { height: auto; }
  .stage { grid-template-columns: 1fr; }
  .logcol { border: 0; border-top: 1px solid var(--line); padding: 8px 0 0; height: 360px; order: 3; }
  .col.B { order: 2; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .ic.flash, .chip.flash { animation: none; } #links { display: none; } .float { animation-duration: .01s; } .bar > i { transition: none; }
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="seal" aria-hidden="true">戰</span>Fight Replay</div>
    <label class="meta"><span class="sr" style="position:absolute;left:-9999px">Fight</span>
      <select id="pick" aria-label="Choose a fight"></select></label>
    <div class="meta" id="hdr"></div>
    <div class="spacer"></div>
    <span id="fat" class="fatigue" hidden>Fatigue</span>
    <span class="clock" id="clock">0.0 s</span>
  </header>

  <main class="stage" id="stage">
    <section class="col A" id="colA" aria-label="You"></section>
    <section class="logcol" aria-label="Fight log">
      <div class="loghead">
        <h3>Fight log</h3>
        <div class="seg" role="group" aria-label="Log detail">
          <button id="mSum" aria-pressed="true">Summary</button><button id="mFull" aria-pressed="false">Full</button>
        </div>
      </div>
      <div class="filter" id="filt" hidden></div>
      <div class="log" id="log" aria-live="off"></div>
    </section>
    <section class="col B" id="colB" aria-label="Foe"></section>
    <svg id="links" aria-hidden="true"></svg>
    <div id="floats" aria-hidden="true"></div>
  </main>

  <footer class="ctl" aria-label="Playback">
    <button class="b" id="back" title="Back one pulse (←)">⏮</button>
    <button class="b play" id="play" title="Play / pause (Space)">▶ Play</button>
    <button class="b" id="fwd" title="Forward one pulse (→)">⏭</button>
    <span role="group" aria-label="Speed" style="display:inline-flex;gap:4px">
      <button class="b" data-sp="1" aria-pressed="true" title="1× (1)">1×</button>
      <button class="b" data-sp="2" aria-pressed="false" title="2× (2)">2×</button>
      <button class="b" data-sp="4" aria-pressed="false" title="4× (3)">4×</button>
    </span>
    <button class="b" id="skip" title="Skip to the result (Enter)">Skip to result</button>
    <input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Fight time">
    <span class="keys"><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> pulse · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> speed · <kbd>L</kbd> log · <kbd>Enter</kbd> skip</span>
  </footer>
</div>
<div class="tip" id="tip" hidden></div>

<script id="data" type="application/json">/*__DATA__*/</script>
<script id="icons" type="application/json">/*__ICONS__*/</script>
<script>
(() => {
const DATA = JSON.parse(document.getElementById('data').textContent);
let ICONS = {}; try { ICONS = JSON.parse(document.getElementById('icons').textContent) || {}; } catch (e) { ICONS = {}; }
const $ = (id) => document.getElementById(id);
const EL_VAR = { fire:'--t-fire', water:'--e-water', earth:'--e-earth', metal:'--e-metal', wood:'--e-wood', ice:'--e-ice', thunder:'--e-thunder', wind:'--e-wind' };
const T_VAR = { phys:'--t-phys', fire:'--t-fire', cold:'--t-cold', lightning:'--t-lightning', force:'--t-force', chaos:'--t-chaos', soul:'--t-soul', elem:'--t-elem' };
const EL_HV = { fire:'Hỏa', water:'Thủy', earth:'Thổ', metal:'Kim', wood:'Mộc', ice:'Băng', thunder:'Lôi', wind:'Phong' };
const REALM = { luyen_khi:'Luyện Khí', truc_co:'Trúc Cơ', ket_dan:'Kết Đan', nguyen_anh:'Nguyên Anh', hoa_than:'Hóa Thần' };
const nice = (s) => String(s||'').replace(/[._-]+/g,' ').replace(/\b\w/g, c => c.toUpperCase());
const buildName = (n) => nice(String(n).replace(/[.](luyen|truc|ket|nguyen|hoa)[-_]?\w*$/,''));
const fmt = (x) => Math.round(x).toLocaleString();
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const elv = (e) => EL_VAR[e] ? `var(${EL_VAR[e]})` : 'var(--ink-2)';
const tyv = (t) => `var(${T_VAR[t]||'--t-phys'})`;
const artName = (side, id) => { if (id==='basic') return 'Basic strike'; if (id==='tick') return 'Tick'; const a = R[side].arts.find(x=>x.id===id); return a ? a.name.replace(/\s*\(.*\)$/,'') : nice(id); };

let R, idx = 0, t = 0, playing = false, speed = 1, last = 0, mode = 'sum', filter = null, ended = false;
let lines = [];        // [{t, side, html, minor, ev}]
let fireIdx = {};      // side -> art index -> [times]
let logKey = '';

DATA.forEach((r, i) => { const o = document.createElement('option'); o.value = i;
  o.textContent = `${buildName(r.A.name)} vs ${buildName(r.B.name)} · ${REALM[r.realm]||r.realm}`; $('pick').appendChild(o); });

function prep() {
  R = DATA[idx]; t = 0; ended = false; filter = null;
  fireIdx = { A: {}, B: {} };
  for (const e of R.log) if (e.ev === 'art_fired') { const s = R[e.side]; const i = s.arts.findIndex(a => a.id === e.art_id); (fireIdx[e.side][i] ||= []).push(e.t); }
  lines = buildLines(); lines.forEach((l, i) => l.i = i); logKey = '';
  $('hdr').innerHTML = `<span>${REALM[R.realm]||R.realm}</span><span>Duel · seed 1</span><span>Recorded by the combat engine</span>`;
  renderCol('A'); renderCol('B');
  $('scrub').max = Math.round(R.end * 1000);
  hideResult(); closePanel();

}

/* ---------- log lines ---------- */
function who(side) { return `<span class="who-${side.toLowerCase()}">${esc(buildName(R[side].name))}</span>`; }
function buildLines() {
  const out = []; const L = R.log;
  for (let i = 0; i < L.length; i++) {
    const e = L[i]; const s = e.side;
    if (e.ev === 'art_fired') out.push({ t: e.t, side: s, art: e.art_id, html: `${who(s)} uses <b>${esc(artName(s, e.art_id))}</b>` });
    else if (e.ev === 'step_unlocked') out.push({ t: e.t, side: s, art: e.art_id, html: `${esc(artName(s, e.art_id))} reaches <b>step ${e.step+1}</b><span class="k" style="color:var(--gold)">engine</span>` });
    else if (e.ev === 'empowered') out.push({ t: e.t, side: s, art: e.art_id, html: `${esc(artName(s, e.art_id))} is <b>empowered</b> ⚡` });
    else if (e.ev === 'defend') {
      const lost = e.hp + e.body + e.ward_sh; const a = e.from;
      const minor = e.art_id === 'tick' || (lost < R[s].hpMax * 0.01 && e.art_id === 'basic');
      out.push({ t: e.t, side: a, art: e.art_id, minor, ev: e, click: true,
        html: `${esc(artName(a, e.art_id))} → ${who(s)} <span class="dmg" style="color:${tyv(e.dtype)}">${fmt(lost)}</span> <span style="color:var(--ink-3)">${e.dtype}</span>` +
              (e.raw > 0 ? ` <span style="color:var(--ink-3)">of ${fmt(e.raw)}</span>` : '') });
    }
    else if (e.ev === 'crit') out.push({ t: e.t, side: s, art: e.art_id, minor: true, html: `critical hit` });
    else if (e.ev === 'heal_restored') out.push({ t: e.t, side: s, art: e.art_id, html: `${who(s)} heals <span class="dmg" style="color:var(--heal)">+${fmt(e.amount)}</span>` });
    else if (e.ev === 'shield_broken') out.push({ t: e.t, side: s, html: `${who(s)}'s ward shield <b>breaks</b>` });
    else if (e.ev === 'status_applied') out.push({ t: e.t, side: s, minor: true, html: `applies ${esc(nice(e.status || e.element))} ×${+(e.stacks||1).toFixed(1)}` });
    else if (e.ev === 'evaded') out.push({ t: e.t, side: s, minor: true, html: `${who(s)} evades` });
    else if (e.ev === 'cleansed') out.push({ t: e.t, side: s, minor: true, html: `${who(s)} cleanses ${fmt(e.amount)}` });
    else if (e.ev === 'down') out.push({ t: e.t, side: s, html: `${who(s)} is <b>Down</b>` });
    else if (e.ev === 'effect') {
      const own = R[s].owner[e.id];
      out.push({ t: e.t, side: s, art: own || e.src, minor: true, html: `<span style="color:var(--ink-3)">Effect</span> ${esc(nice(e.id))}${e.src ? ` <span style="color:var(--ink-3)">(from ${esc(artName(s, e.src))})</span>` : ''}` });
    }

}
function renderLog() {
  let n = 0; for (const l of lines) { if (l.t <= t) n++; else break; }
  const key = n + mode + (filter ? filter.side + filter.art : '');
  if (key === logKey) return; logKey = key;
  const box = $('log'); const keep = [];
  for (let i = lines.length - 1; i >= 0 && keep.length < 220; i--) {
    const l = lines[i]; if (l.t > t) continue;
    if (mode === 'sum' && l.minor) continue;
    if (filter && !(l.side === filter.side && l.art === filter.art)) continue;
    keep.push(l);
  }
  box.innerHTML = keep.map((l, k) => `<div class="ln ${l.side}${l.minor?' minor':''}${l.click?' click':''}" data-k="${l.i}"><span class="tm">${(l.t/1000).toFixed(1)}</span><span class="tx">${l.html}</span></div>`).join('')
    || `<div class="none">Nothing yet. Press Play.</div>`;
}
$('log').addEventListener('click', (ev) => { const d = ev.target.closest('.ln.click'); if (!d) return; const l = lines[+d.dataset.k]; if (l && l.ev) { setPlay(false); openBreakdown(l.ev); } });

}

function snapAt(time) { const S = R.snaps; let lo = 0, hi = S.length - 1, k = 0; if (!S.length) return null;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (S[m].t <= time) { k = m; lo = m + 1; } else hi = m - 1; } return S[k].t <= time ? S[k] : S[0]; }
function sumBy(list) { const m = {}; for (const [k, n] of list) m[k] = (m[k] || 0) + n; return m; }

function draw(force) {
  const sn = snapAt(t);
  $('clock').textContent = (t / 1000).toFixed(1) + ' s';
  $('fat').hidden = t < 60000;
  $('scrub').value = Math.round(t);
  for (const side of ['A', 'B']) {
    const s = R[side]; const x = sn ? sn[side] : null; if (!x) continue;
    const hp = x.hp / s.hpMax;
    $('hp' + side).style.width = (hp * 100) + '%'; $('lag' + side).style.width = (hp * 100) + '%';
    $('bars' + side).querySelector('.bar b').innerHTML = `<span>${fmt(x.hp)}</span><span>${Math.round(hp*100)}%</span>`;
    $('hpT' + side).textContent = `${fmt(x.hp)} / ${fmt(s.hpMax)}`;
    $('bd' + side).style.width = Math.min(100, x.body / s.hpMax * 100) + '%';
    const wl = x.wsh.reduce((a, w) => a + w[0], 0), wm = x.wsh.reduce((a, w) => a + w[1], 0);
    $('ws' + side).style.width = (wm ? wl / wm * 100 : 0) + '%';
    $('qi' + side).style.width = Math.min(100, x.qi / x.qm * 100) + '%';
    $('qiT' + side).textContent = `${fmt(x.qi)} / ${fmt(x.qm)}`;
    $('por' + side).classList.toggle('down', !!x.down || (ended && R.win !== side && R.win !== 'draw' && R.win !== 'time' && x.hp <= 0));
    $('dn' + side).innerHTML = x.down ? '<span class="tag-down">Down</span>' : '';
    s.arts.forEach((a, i) => {
      const fired = (fireIdx[side][i] || []).filter(v => v <= t); const lastF = fired.length ? fired[fired.length - 1] : 0;
      const rd = x.ready[i]; const span = Math.max(1, rd - lastF); const fill = rd <= t ? 1 : Math.max(0, Math.min(1, (t - lastF) / span));
      const el = $('art' + side + i); el.querySelector('.fill').style.height = (fill * 100) + '%';
      const fg = el.querySelector('.ring .fg'); if (fg) fg.setAttribute('stroke-dashoffset', String(100 - fill * 100));
      el.classList.toggle('charging', fill < 1);
      const st = $('stp' + side + i); if (st) st.textContent = `${(x.step[i]||0) + 1}/${a.steps + 1}`;
    });
    $('wsh' + side).innerHTML = x.wsh.map((w, i) => ICONS['ward:shield']
      ? `<button class="ic small img${w[0] < w[1] ? ' charging' : ''}" data-tip="wsh:${side}:${i}"><img src="${ICONS['ward:shield']}" alt=""><svg class="ring" viewBox="0 0 50 50" aria-hidden="true"><rect class="bg" x="1.5" y="1.5" width="47" height="47" rx="5" pathLength="100"/><rect class="fg" x="1.5" y="1.5" width="47" height="47" rx="5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${w[1] ? 100 - w[0] / w[1] * 100 : 100}"/></svg></button>`
      : `<button class="ic small" style="--el:var(--ward)" data-tip="wsh:${side}:${i}"><span class="fill" style="height:${w[1]?w[0]/w[1]*100:0}%"></span><span class="gl">◈</span></button>`).join('');
    const bf = sumBy(x.buffs), df = sumBy(x.debuffs);
    $('buf' + side).innerHTML = chips(bf, 'buff', side) || '<span class="none">none</span>';
    $('deb' + side).innerHTML = chips(df, 'debuff', side) || '<span class="none">none</span>';
    const sta = Object.entries(x.st).map(([k, n]) => `<span class="chip" tabindex="0" data-tip="st:${k}:${n}" style="--el:var(--foe)"><span class="dot"></span>${esc(nice(k))} ×${+(+n).toFixed(1)}</span>`)
      .concat(Object.entries(x.ct).map(([k, n]) => `<span class="chip ctr" id="ct${side}-${k}" tabindex="0" data-tip="ct:${side}:${k}:${n}" style="--el:var(--gold)"><span class="dot"></span>${esc(nice(k))} ${+(+n).toFixed(1)}</span>`))
      .concat(x.state ? [`<span class="chip" style="--el:var(--you)">Stance: ${esc(nice(x.state))}</span>`] : []);
    $('sta' + side).innerHTML = sta.join('') || '<span class="none">none</span>';
  }
  renderLog();
}
function chips(m, kind, side) { return Object.entries(m).filter(([, n]) => n > 0.05).map(([el, n]) =>
  `<span class="chip" tabindex="0" data-tip="${kind}:${el}:${n}" style="--el:${elv(el)}">${ICONS[kind + ':' + el] ? `<img src="${ICONS[kind + ':' + el]}" alt="">` : '<span class="dot"></span>'}${EL_HV[el] ? EL_HV[el] + ' ' : ''}${esc(nice(el))} ×${+n.toFixed(1)}</span>`).join(''); }

/* ---------- animations for events between t0 and t1 ---------- */
const stageRect = () => $('stage').getBoundingClientRect();
function center(el) { const r = el.getBoundingClientRect(), s = stageRect(); return [r.left - s.left + r.width / 2, r.top - s.top + r.height / 2]; }
function flash(el) { if (!el) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
function link(a, b, color) {
  if (!a || !b || a === b) return; const [x1, y1] = center(a), [x2, y2] = center(b);
  const mx = (x1 + x2) / 2, my = Math.min(y1, y2) - 30;
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', `M${x1},${y1} Q${mx},${my} ${x2},${y2}`); p.style.stroke = color;
  const len = Math.hypot(x2 - x1, y2 - y1) + 60; p.style.strokeDasharray = len; p.style.setProperty('--len', len);
  $('links').appendChild(p); setTimeout(() => p.remove(), 520);
}
let floatBudget = {};
function floatNum(side, text, color) {
  const key = side + Math.floor(t / 1000); if (speed >= 4) { if (floatBudget[key]) return; floatBudget[key] = 1; }
  const bar = $('hp' + side).parentElement; const r = bar.getBoundingClientRect(), s = stageRect();
  const d = document.createElement('div'); d.className = 'float'; d.textContent = text; d.style.color = color;
  d.style.left = (r.left - s.left + r.width * (0.25 + Math.random() * 0.5)) + 'px'; d.style.top = (r.top - s.top - 4) + 'px';
  $('floats').appendChild(d); setTimeout(() => d.remove(), 800);
}
function animate(t0, t1) {
  if (t1 - t0 > 1500 || t1 < t0) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const agg = {};
  for (const e of R.log) {
    if (e.t <= t0 || e.t > t1) continue; const s = e.side; const S = R[s];
    if (e.ev === 'art_fired' || e.ev === 'empowered' || e.ev === 'step_unlocked') {
      const i = S.arts.findIndex(a => a.id === e.art_id); const el = $('art' + s + i); if (!reduce) flash(el);
      if (e.ev === 'empowered') { const b = $('emp' + s + i); if (b) { b.hidden = false; setTimeout(() => b.hidden = true, 900); } }
    } else if (e.ev === 'defend') {
      const lost = e.hp + e.body + e.ward_sh; if (lost <= 0) continue;
      const k = s + e.dtype; agg[k] = agg[k] || { side: s, dtype: e.dtype, v: 0 }; agg[k].v += lost;
      if (e.drain > 0 && !reduce) flash($('ward' + s));
    } else if (e.ev === 'heal_restored') { floatNum(s, '+' + fmt(e.amount), 'var(--heal)'); }
    else if (e.ev === 'effect' && !reduce) {
      const own = S.owner[e.id]; const srcI = S.arts.findIndex(a => a.id === e.src); const ownI = S.arts.findIndex(a => a.id === own);
      const src = srcI >= 0 ? $('art' + s + srcI) : null;
      let dst = ownI >= 0 ? $('art' + s + ownI) : null;
      if (!dst || dst === src) { const ce = document.querySelector(`#sta${s} .chip.ctr`); if (ce) dst = ce; }
      if (src && dst && dst !== src) { link(src, dst, `var(${s === 'A' ? '--you' : '--foe'})`); flash(dst); }
      const ei = S.effects.findIndex(x => x.id === e.id); if (ei >= 0) flash($('eff' + s + ei));
    }
  }
  for (const k in agg) { const a = agg[k]; if (a.v >= 0.5) floatNum(a.side, '−' + fmt(a.v), tyv(a.dtype)); }
}

/* ---------- breakdown, result ---------- */
function closePanel() { const p = document.querySelector('.panel'); if (p) p.remove(); }
function openBreakdown(e) {
  closePanel(); const stopped = Math.max(0, e.raw - e.ward_sh - e.body - e.hp);

  p.innerHTML = `<button class="close" aria-label="Close">×</button>
    <h5>${esc(artName(e.from, e.art_id))} → ${esc(buildName(R[e.side].name))}</h5>

    <div class="steps">
      <span>Incoming (after offence and crit)</span><span class="v">${fmt(e.raw)}</span>
      <span>Stopped by resistance and block</span><span class="v">−${fmt(stopped)}</span>
      <span>Soaked by ward shields</span><span class="v">−${fmt(e.ward_sh)}</span>
      <span>Soaked by the body shield</span><span class="v">−${fmt(e.body)}</span>
      <span class="tot">Health lost</span><span class="v tot">${fmt(e.hp)}</span>
      <span style="color:var(--ink-2)">Linh lực paid to the ward (drain)</span><span class="v" style="color:var(--ink-2)">${fmt(e.drain)}</span>
    </div>`;
  p.querySelector('.close').onclick = closePanel; $('stage').appendChild(p);

function hideResult() { const r = document.querySelector('.result'); if (r) r.remove(); }
function showResult() {
  hideResult(); const sum = (side, f) => R.log.filter(e => e.ev === 'defend' && e.side === side).reduce((a, e) => a + f(e), 0);
  const dealtA = sum('B', e => e.hp + e.body + e.ward_sh), dealtB = sum('A', e => e.hp + e.body + e.ward_sh);
  const heal = (s) => R.log.filter(e => e.ev === 'heal_restored' && e.side === s).reduce((a, e) => a + e.amount, 0);
  const fires = (s) => R.log.filter(e => e.ev === 'art_fired' && e.side === s).length;
  const title = R.win === 'A' ? `${buildName(R.A.name)} wins` : R.win === 'B' ? `${buildName(R.B.name)} wins` : R.win === 'draw' ? 'Both fall' : 'No winner';
  const d = document.createElement('div'); d.className = 'result'; d.setAttribute('role', 'dialog');
  d.innerHTML = `<div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)">Result</div>
    <div class="big">${esc(title)}</div><div style="color:var(--ink-2)">after ${R.end.toFixed(1)} s${R.end >= 60 ? ' (fatigue reached)' : ''}</div>
    <table><tr><th></th><th>${esc(buildName(R.A.name))}</th><th>${esc(buildName(R.B.name))}</th></tr>
    <tr><td>Damage dealt</td><td>${fmt(dealtA)}</td><td>${fmt(dealtB)}</td></tr>
    <tr><td>Healed</td><td>${fmt(heal('A'))}</td><td>${fmt(heal('B'))}</td></tr>
    <tr><td>Arts fired</td><td>${fires('A')}</td><td>${fires('B')}</td></tr></table>
    <div style="display:flex;gap:8px;justify-content:center"><button class="btn ghost" id="rv">Review the fight</button><button class="btn" id="ag">Watch again</button></div>`;
  $('stage').appendChild(d);
  $('rv').onclick = hideResult; $('ag').onclick = () => { hideResult(); seek(0); setPlay(true); };
}

  if (p[0] === 'art') { const a = R[p[1]].arts[+p[2]];
    return `<h5>${esc(a.name)}</h5><div class="mut">${a.power ? nice(a.power) + ' art' : 'Art'}${a.group ? ' · ' + esc(nice(a.group)) : ''}${a.element ? ' · ' + (EL_HV[a.element]||'') + ' ' + nice(a.element) : ''}</div>
      ${a.rule ? `<div style="margin-top:5px">${esc(a.rule)}</div>` : ''}
      <dl><dt>Cost</dt><dd>${Math.round(a.cost * 100)} % of linh lực</dd><dt>Cooldown</dt><dd>${a.cd} s</dd>
      ${a.steps ? `<dt>Steps</dt><dd>${a.steps + 1} (later steps need their conditions)</dd>` : ''}${a.empower ? `<dt>Empower</dt><dd>${a.empower} condition(s)</dd>` : ''}
      ${a.tags.length ? `<dt>Tags</dt><dd>${esc(a.tags.join(', '))}</dd>` : ''}</dl><div class="mut" style="margin-top:5px">Click to show only this art in the log.</div>`; }
  if (p[0] === 'tech') { const q = R[p[1]].techniques[+p[2]]; return `<h5>${esc(q.name)}</h5><div class="mut">Technique (công pháp) passives</div><dl>${q.passives.map(x => `<dt>·</dt><dd>${esc(x)}</dd>`).join('')}</dl>`; }
  if (p[0] === 'eff') { const e = R[p[1]].effects[+p[2]]; return `<h5>${esc(nice(e.id))}</h5><div class="mut">Effect · on ${esc(nice(e.on))}</div>${e.rule ? `<div style="margin-top:5px">${esc(e.rule)}</div>` : ''}`; }
  if (p[0] === 'ward') { const s = R[p[1]]; const res = s.resist; return `<h5>Ward</h5><div class="mut">Drain-paid resistance ward</div><dl><dt>Resistance</dt><dd>${fmt(res)} points (stops ${Math.round(res / (100 + res) * 100)} %)</dd><dt>Block</dt><dd>${s.block} rating</dd></dl><div class="mut" style="margin-top:5px">It flashes when it bills linh lực for a hit it stopped.</div>`; }
  if (p[0] === 'wsh') return `<h5>Ward shield</h5><div class="mut">Soaks damage before the body shield and health; recharges after a quiet spell.</div>`;
  if (p[0] === 'por') { const s = R[p[1]]; return `<h5>${esc(buildName(s.name))}</h5><div class="mut">${REALM[s.realm]||s.realm} · ${p[1]==='A'?'You':'Foe'}</div><dl><dt>Health</dt><dd>${fmt(s.hpMax)}</dd><dt>Offence M</dt><dd>×${s.M}</dd><dt>Resistance</dt><dd>${fmt(s.resist)}</dd><dt>Block</dt><dd>${s.block}</dd><dt>Roots</dt><dd>${esc(Object.entries(s.purity||{}).map(([k,v])=>`${nice(k)} ${v}`).join(', ')||'—')}</dd><dt>Arts</dt><dd>${s.arts.length}</dd></dl>`; }
  if (p[0] === 'bar') { const nm = { hp: 'Health', body: 'Body shield', ws: 'Ward shields', qi: 'Linh lực' }[p[1]]; const x = snapAt(t)[p[2]], s = R[p[2]];
    const v = p[1] === 'hp' ? `${fmt(x.hp)} / ${fmt(s.hpMax)}` : p[1] === 'body' ? `${fmt(x.body)}` : p[1] === 'ws' ? (x.wsh.length ? x.wsh.map(w => `${fmt(w[0])} / ${fmt(w[1])}`).join(', ') : 'none') : `${fmt(x.qi)} / ${fmt(x.qm)}`;
    return `<h5>${nm}</h5><div>${v}</div>${p[1]==='body'?'<div class="mut">Its own bar over health; it never refills.</div>':''}${p[1]==='qi'?'<div class="mut">Pays for arts and the ward. Running dry is how most builds lose.</div>':''}`; }
  if (p[0] === 'buff' || p[0] === 'debuff') return `<h5>${EL_HV[p[1]] ? EL_HV[p[1]] + ' · ' : ''}${esc(nice(p[1]))} ${p[0]}</h5><div>${(+p[2]).toFixed(1)} stacks</div><div class="mut">Element stacks: each stack adds its element's effect.</div>`;
  if (p[0] === 'st') return `<h5>${esc(nice(p[1]))}</h5><div>×${(+p[2]).toFixed(1)}</div><div class="mut">A status or curse on this side.</div>`;
  if (p[0] === 'ct') return `<h5>${esc(nice(p[2]))}</h5><div>${(+p[3]).toFixed(1)}</div><div class="mut">A counter the build's engine fills and its payoff arts spend.</div>`;
  return '';
}
function showTip(el) { const k = el.dataset.tip; if (!k || !R) return; tip.innerHTML = tipHtml(k); tip.hidden = false;
  const r = el.getBoundingClientRect(); const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = r.left + r.width / 2 - w / 2; x = Math.max(8, Math.min(innerWidth - w - 8, x));
  let y = r.top - h - 8; if (y < 8) y = r.bottom + 8; tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
document.addEventListener('mouseover', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); else tip.hidden = true; });
document.addEventListener('focusin', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('focusout', () => tip.hidden = true);

/* ---------- playback ---------- */
function setPlay(v) { playing = v && !(t >= R.end * 1000); $('play').textContent = playing ? '⏸ Pause' : '▶ Play'; last = performance.now(); if (playing) hideResult(); }
function seek(ms) { const t0 = t; t = Math.max(0, Math.min(R.end * 1000, ms)); ended = t >= R.end * 1000; draw(); if (t > t0) animate(t0, t); }
function frame(now) {
  if (playing) { const dt = Math.min(100, now - last) * speed; const t0 = t; t = Math.min(R.end * 1000, t + dt);
    draw(); animate(t0, t);
    if (t >= R.end * 1000) { playing = false; ended = true; $('play').textContent = '▶ Play'; showResult(); } }
  last = now; requestAnimationFrame(frame);
}
$('play').onclick = () => setPlay(!playing);
$('back').onclick = () => { setPlay(false); seek(Math.ceil(t / 1000 - 1) * 1000); };
$('fwd').onclick = () => { setPlay(false); seek(Math.floor(t / 1000 + 1) * 1000); };
$('skip').onclick = () => { setPlay(false); seek(R.end * 1000); showResult(); };
$('scrub').addEventListener('input', (e) => { setPlay(false); hideResult(); seek(+e.target.value); });
document.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { speed = +b.dataset.sp; document.querySelectorAll('[data-sp]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
$('mSum').onclick = () => { mode = 'sum'; $('mSum').setAttribute('aria-pressed', true); $('mFull').setAttribute('aria-pressed', false); renderLog(); };
$('mFull').onclick = () => { mode = 'full'; $('mFull').setAttribute('aria-pressed', true); $('mSum').setAttribute('aria-pressed', false); renderLog(); };
$('pick').onchange = (e) => { idx = +e.target.value; setPlay(false); prep(); };
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, select')) return;
  if (e.key === ' ') { e.preventDefault(); setPlay(!playing); }
  else if (e.key === 'ArrowRight') $('fwd').click(); else if (e.key === 'ArrowLeft') $('back').click();
  else if (e.key === '1' || e.key === '2' || e.key === '3') document.querySelector(`[data-sp="${{1:1,2:2,3:4}[e.key]}"]`).click();
  else if (e.key === 'Enter') $('skip').click();
  else if (e.key === 'l' || e.key === 'L') (mode === 'sum' ? $('mFull') : $('mSum')).click();
  else if (e.key === 'Escape') { closePanel(); hideResult(); }
});

prep();
seek(4000);
requestAnimationFrame(frame);
})();
</script>
