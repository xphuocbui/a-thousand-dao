# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: global_random_in_combat
    status: active
    description: "Combat code must not call the global random functions (randf, randi_range, Array.shuffle, pick_random); each fight uses one RandomNumberGenerator seeded from FightRequest.seed."
    why: "Global draws make fights unrepeatable and break the parity suite against the design sim."
    adr: docs/architecture/adr-0001-combat-engine-in-godot.md
    added: 2026-11-13
  - pattern: full_fight_engine_in_world_tick
    status: active
    description: "The world tick must not run the full fight engine for NPC-against-NPC or mass fights; it uses the rating profile (combat.md Formulas K)."
    why: "Thousands of NPCs: full fights would cost seconds per season; the GDD designed the closed-form clash for this."
    adr: docs/architecture/adr-0001-combat-engine-in-godot.md
    added: 2026-11-13
  - pattern: mutating_cached_fighter_profile
    status: active
    description: "A Fight must not change a FighterProfile; it copies what it changes into its FighterState."
    why: "Profiles are cached and shared; GDScript has no immutable objects, so a mutation silently corrupts every later fight."
    adr: docs/architecture/adr-0001-combat-engine-in-godot.md
    added: 2026-11-13
  - pattern: builtin_tooltip_api
    status: active
    description: "Game code must not use a built-in tooltip API: a non-empty Control.tooltip_text, set_item_tooltip, set_tab_tooltip, TreeItem.set_tooltip_text or RichTextLabel.push_meta's tooltip argument. Tooltips go through TooltipLayer.set_tip."
    why: "Godot's popup would show beside the game's tooltip layer and cannot lock, nest or be reached by keyboard; tests/integration/ui/ui_no_builtin_tooltips_test.gd scans src/."
    adr: docs/architecture/adr-0005-tooltip-layer.md
    added: 2026-11-22
  - pattern: tooltip_reads_state_while_busy
    status: "superseded_by: ADR-0006"
    description: "A tooltip Callable must not change state, and the layer must not call one while the session's background job runs (TooltipLayer.busy)."
    why: "Tips run on the main thread every frame while hovered; the season resolves on a worker thread, so a read during it races the simulation."
    adr: docs/architecture/adr-0005-tooltip-layer.md
    added: 2026-11-22
  - pattern: frontend_reads_while_job_runs
    status: active
    description: "While a session action or job runs, a frontend reads nothing from the session: no read method, Guidance read, tooltip Callable or StatSheet kept from before (the HUD is inert; TooltipLayer.busy is on)."
    why: "The job runs on a worker thread; a main-thread read races the simulation."
    adr: docs/architecture/adr-0006-game-session-facade.md
    added: 2026-11-22
  - pattern: frontend_reads_session_members
    status: active
    description: "A shipped frontend (src/ui) names no GameSession member outside the allowlist of actions, jobs and read methods, and no WorldDB or service object."
    why: "Live records let the UI change the world by accident and couple it to the DB schema; tests/integration/ui/ui_frontend_rule_test.gd checks it."
    adr: docs/architecture/adr-0006-game-session-facade.md
    added: 2026-11-22
  - pattern: frontend_uses_terminal_code
    status: active
    description: "A shipped frontend does not use the debug terminal's code (TerminalViews, TerminalIO)."
    why: "The terminal is exempt from the frontend rule; borrowing its views imports that exemption into the Game UI."
    adr: docs/architecture/adr-0006-game-session-facade.md
    added: 2026-11-22
  - pattern: read_mutates_state
    status: active
    description: "A read (GameSession read method, StateSnapshot, Advisor, GameQuery) never changes to_dict() or the session RNG state, and never runs a rating panel or fights on the session stream."
    why: "A UI that reads more often than a headless run would drift from it (TR-sim-001); tests/unit/session/session_reads_test.gd checks every read."
    adr: docs/architecture/adr-0006-game-session-facade.md
    added: 2026-11-22
  - pattern: query_returns_live_record
    status: active
    description: "GameQuery, StateSnapshot and Advisor return deep copies built for the purpose, never a WorldDB record or live service object."
    why: "WorldDB.get_record returns the live Dictionary; a caller changing it changes the world."
    adr: docs/architecture/adr-0006-game-session-facade.md
    added: 2026-11-22
  - pattern: frontend_connects_session_signals
    status: active
    description: "A shipped frontend does not connect to GameSession signals (life_ended, breakthrough_succeeded); it acts on the action result's events."
    why: "The signals fire partway through an action on the job thread; a handler could run before the action finishes."
    adr: docs/architecture/adr-0006-game-session-facade.md
    added: 2026-11-22

