#     revised: ""


# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets: []

# Example:
#
# performance_budgets:
#   - target_fps: 60
#     total_frame_budget_ms: 16.6
#     platform: PC             # PC | Console | Mobile | All
#     adr: docs/architecture/adr-0000-performance-targets.md
#     added: 2026-03-26
#     revised: ""
#
#   - system: combat
#     status: active
#     budget_ms: 2.0
#     adr: docs/architecture/adr-0003-combat-system.md
#     notes: "Includes physics queries, hitbox evaluation, and damage calculation"
#     referenced_by:
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: combat_effects
    status: active
    api: "The shared JSON Effect DSL (assets/data/combat_effects.json and art/technique records), compiled at load to typed EffectDef objects indexed by event"
    not: "Effects written as GDScript classes"
    adr: docs/architecture/adr-0001-combat-engine-in-godot.md
    reason: "One format for the game engine and the Python design sim, so Effects cannot drift between them (user decision 2026-11-13)"
    referenced_by:
      - docs/architecture/adr-0001-combat-engine-in-godot.md
    added: 2026-11-13
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "Direct server calls avoid per-frame node overhead; 3× faster in profiling"
#     referenced_by:
#       - docs/architecture/adr-0002-physics-architecture.md
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: global_random_in_combat
    status: active
    description: "Combat code must not call the global random functions (randf, randi_range, Array.shuffle, pick_random); each fight uses one RandomNumberGenerator seeded from FightRequest.seed."
    why: "Global draws make fights unrepeatable and break the parity suite against the design sim."
    adr: docs/architecture/adr-0001-combat-engine-in-godot.md
    added: 2026-11-13
  - pattern: full_fight_engine_in_world_tick
    status: active
    description: "The world tick must not run the full fight engine for NPC-against-NPC or mass fights; it uses the rating profile (combat.md Formulas K)."
    why: "Thousands of NPCs: full fights would cost seconds per season; the GDD designed the closed-form clash for this."
    adr: docs/architecture/adr-0001-combat-engine-in-godot.md
    added: 2026-11-13
  - pattern: mutating_cached_fighter_profile
    status: active
    description: "A Fight must not change a FighterProfile; it copies what it changes into its FighterState."
    why: "Profiles are cached and shared; GDScript has no immutable objects, so a mutation silently corrupts every later fight."
    adr: docs/architecture/adr-0001-combat-engine-in-godot.md
    added: 2026-11-13

