# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: combat_effects
    status: active
    api: "The shared JSON Effect DSL (assets/data/combat_effects.json and art/technique records), compiled at load to typed EffectDef objects indexed by event"
    not: "Effects written as GDScript classes"
    adr: docs/architecture/adr-0001-combat-engine-in-godot.md
    reason: "One format for the game engine and the Python design sim, so Effects cannot drift between them (user decision 2026-11-13)"
    referenced_by:
      - docs/architecture/adr-0001-combat-engine-in-godot.md
    added: 2026-11-13
    revised: ""
  - purpose: session_action_threading
    status: active
    api: "One Thread per action or job through BackgroundCall (src/ui/turn/background_call.gd); events in the action's result"
    not: "Actions on the main thread; WorkerThreadPool for session actions; frontends connecting to session signals"
    adr: docs/architecture/adr-0006-game-session-facade.md
    reason: "The screen keeps drawing while a season resolves (ui-code.md); one job at a time keeps single access to the session; results carry events in order"
    referenced_by:
      - docs/architecture/adr-0006-game-session-facade.md
    added: 2026-11-22
    revised: ""

