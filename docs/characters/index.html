<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cast &amp; Spirit Beasts Compendium</title>
<style>
:root {
  --bg: #15110e;
  --bg-elev: #1d1713;
  --card: #221b16;
  --card-hover: #2b221c;
  --panel: #1a1410;
  --border: #3c2f24;
  --border-strong: #5c4735;
  --text: #efe5d6;
  --text-muted: #aa9984;
  --text-dim: #7b6c5a;
  --brass: #d5a356;
  --brass-soft: rgba(213, 163, 86, 0.14);
  --brass-border: rgba(213, 163, 86, 0.42);
  --crimson: #c25949;
  --jade: #5aa382;
  --azure: #5d94bf;
  --amethyst: #a37acc;
  --amber: #d49642;
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  --radius: 8px;
  --font-serif: Georgia, 'Noto Serif', 'Times New Roman', serif;
  --font-sans: 'Segoe UI', 'Noto Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'Cascadia Code', Consolas, 'Courier New', monospace;
  --font-han: 'KaiTi', 'STKaiti', 'Noto Serif SC', Georgia, serif;
}
[data-theme="light"] {
  --bg: #f4eee2;
  --bg-elev: #fbf7ef;
  --card: #fffdf8;
  --card-hover: #f7f0e2;
  --panel: #f7f1e6;
  --border: #d6c8b0;
  --border-strong: #b8a382;
  --text: #241b14;
  --text-muted: #655543;
  --text-dim: #8c7b67;
  --brass: #96641b;
  --brass-soft: rgba(150, 100, 27, 0.11);
  --brass-border: rgba(150, 100, 27, 0.38);
  --crimson: #a83c2c;
  --jade: #2e7657;
  --azure: #2d6591;
  --amethyst: #6d4799;
  --amber: #a86b15;
  --shadow: 0 6px 20px rgba(40, 26, 12, 0.10);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  min-height: 100%;
}
a { color: var(--brass); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select {
  font-family: inherit;
  font-size: 13px;
  color: var(--text);
}
.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
}
.header-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  padding: 12px 20px 10px;
  border-bottom: 1px solid var(--border);
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}
.brand h1 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--brass);
}
.brand-sub {
  font-size: 12px;
  color: var(--text-muted);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 11px;
  cursor: pointer;
  color: var(--text);
  transition: background 0.14s, border-color 0.14s;
}
.btn:hover {
  background: var(--card-hover);
  border-color: var(--border-strong);
}
.btn.active, .btn-brass {
  background: var(--brass-soft);
  border-color: var(--brass-border);
  color: var(--brass);
  font-weight: 600;
}
.segmented {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.segmented button {
  border: none;
  border-radius: 0;
  background: var(--card);
  padding: 6px 11px;
  cursor: pointer;
}
.segmented button + button { border-left: 1px solid var(--border); }
.segmented button.active {
  background: var(--brass-soft);
  color: var(--brass);
  font-weight: 600;
}
.tabs-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  padding: 8px 20px;
  border-bottom: 1px solid var(--border);
  scrollbar-width: thin;
}
.tab-btn {
  flex: 0 0 auto;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 5px 12px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 12.5px;
  white-space: nowrap;
  transition: all 0.13s;
}
.tab-btn:hover { color: var(--text); background: var(--card); }
.tab-btn.active {
  background: var(--brass-soft);
  border-color: var(--brass-border);
  color: var(--brass);
  font-weight: 600;
}
.tab-count {
  font-family: var(--font-mono);
  font-size: 11px;
  opacity: 0.8;
  margin-left: 4px;
}
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 9px 20px;
  background: var(--panel);
}
.search-box {
  flex: 1 1 240px;
  min-width: 190px;
  position: relative;
}
.search-box input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 28px 6px 10px;
  outline: none;
}
.search-box input:focus, .filter-select:focus {
  border-color: var(--brass);
}
.search-clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  padding: 2px 5px;
  font-size: 14px;
  display: none;
}
.search-clear.visible { display: block; }
.filter-select {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
  outline: none;
  max-width: 190px;
}
.workspace {
  display: flex;
  align-items: flex-start;
  min-height: calc(100vh - 160px);
}
.main-col {
  flex: 1 1 auto;
  min-width: 0;
  padding: 16px 20px 32px;
}
.toolbar-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
  font-size: 12.5px;
  color: var(--text-muted);
}
.pager {
  display: flex;
  align-items: center;
  gap: 6px;
}
.pager button:disabled { opacity: 0.4; cursor: default; }

/* Portrait Grid */
.grid-view {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
  gap: 14px;
}
.char-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  transition: transform 0.13s, border-color 0.13s, box-shadow 0.13s;
}
.char-card:hover {
  transform: translateY(-2px);
  border-color: var(--border-strong);
  box-shadow: var(--shadow);
}
.char-card.selected {
  border-color: var(--brass);
  box-shadow: 0 0 0 2px var(--brass-soft), var(--shadow);
}
.portrait-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 3;
  background: #100d0a;
  overflow: hidden;
}
[data-theme="light"] .portrait-wrap { background: #e6dccb; }
.portrait-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
}
.sigil-card {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 14px;
  text-align: center;
  background: radial-gradient(circle at 50% 35%, rgba(213, 163, 86, 0.16), transparent 72%),
              linear-gradient(160deg, #211a14 0%, #14100d 100%);
  color: var(--brass);
}
[data-theme="light"] .sigil-card {
  background: radial-gradient(circle at 50% 35%, rgba(150, 100, 27, 0.14), transparent 72%),
              linear-gradient(160deg, #efe5d3 0%, #e1d4bc 100%);
}
.sigil-han {
  font-family: var(--font-han);
  font-size: 40px;
  line-height: 1.1;
  margin-bottom: 8px;
}
.sigil-species {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.sigil-pending {
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 999px;
  border: 1px dashed var(--brass-border);
  color: var(--text-muted);
}
.card-overlay-top {
  position: absolute;
  top: 6px;
  left: 6px;
  right: 6px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 4px;
  pointer-events: none;
}
.rank-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 5px;
  background: rgba(16, 12, 9, 0.84);
  color: #f3e8d6;
  border: 1px solid rgba(255, 255, 255, 0.14);
}
.rank-badge.top10 {
  background: rgba(145, 96, 22, 0.92);
  color: #fff6e5;
  border-color: #f0c97a;
}
.power-pill {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 5px;
  background: rgba(16, 12, 9, 0.82);
  color: #ecc57b;
  border: 1px solid rgba(213, 163, 86, 0.35);
}
.card-overlay-bot {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 18px 8px 6px;
  background: linear-gradient(to top, rgba(12, 9, 7, 0.90), transparent);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
}
.card-body {
  padding: 9px 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.card-name-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
}
.card-name {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 13.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-han {
  font-family: var(--font-han);
  font-size: 12px;
  color: var(--text-muted);
  flex-shrink: 0;
}
.card-sub {
  font-size: 11.5px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-traits {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-top: 4px;
}
.tbl-traits-cell {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  max-width: 245px;
}
.trait-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  line-height: 1.3;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.trait-pill-more {
  background: var(--panel);
  color: var(--text-muted);
  border-color: var(--border);
  font-family: var(--font-mono);
}

/* Trait category color accents */
.tcat-calling { background: rgba(213, 163, 86, 0.18); color: #f2c874; border-color: rgba(213, 163, 86, 0.46); }
.tcat-fate_given { background: rgba(163, 122, 204, 0.20); color: #d6b6f7; border-color: rgba(163, 122, 204, 0.50); }
.tcat-talent { background: rgba(90, 163, 130, 0.19); color: #8fd9b6; border-color: rgba(90, 163, 130, 0.46); }
.tcat-personality { background: rgba(93, 148, 191, 0.18); color: #95c8f0; border-color: rgba(93, 148, 191, 0.44); }
.tcat-path { background: rgba(212, 150, 66, 0.19); color: #ecc17e; border-color: rgba(212, 150, 66, 0.46); }
.tcat-lifestyle { background: rgba(77, 166, 158, 0.18); color: #88dbd2; border-color: rgba(77, 166, 158, 0.44); }
.tcat-upbringing { background: rgba(140, 154, 176, 0.18); color: #c4cfe0; border-color: rgba(140, 154, 176, 0.42); }
.tcat-gained { background: rgba(194, 89, 73, 0.20); color: #f09a8b; border-color: rgba(194, 89, 73, 0.46); }
.tcat-health { background: rgba(204, 109, 82, 0.20); color: #f2aa91; border-color: rgba(204, 109, 82, 0.46); }
.tcat-coping { background: rgba(166, 114, 148, 0.20); color: #deb0cf; border-color: rgba(166, 114, 148, 0.46); }
[data-theme="light"] .tcat-calling { background: #faecc8; color: #7a4c09; border-color: #d6a756; }
[data-theme="light"] .tcat-fate_given { background: #efe4fa; color: #5b2f8c; border-color: #bc98e3; }
[data-theme="light"] .tcat-talent { background: #ddf2e8; color: #1f6345; border-color: #7bbfa0; }
[data-theme="light"] .tcat-personality { background: #dfeef9; color: #1f547d; border-color: #82b5db; }
[data-theme="light"] .tcat-path { background: #faecd4; color: #875512; border-color: #dbb16e; }
[data-theme="light"] .tcat-lifestyle { background: #daf2ef; color: #1e6b64; border-color: #7cc4bc; }
[data-theme="light"] .tcat-upbringing { background: #e6ebf2; color: #39485e; border-color: #a9b6c9; }
[data-theme="light"] .tcat-gained { background: #fae1dc; color: #8f2d1e; border-color: #dc8e81; }
[data-theme="light"] .tcat-health { background: #fbe5dc; color: #8f3c1e; border-color: #dfa08a; }
[data-theme="light"] .tcat-coping { background: #f3e4ee; color: #6e3559; border-color: #cca3be; }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10.5px;
  font-weight: 600;
  padding: 1.5px 6px;
  border-radius: 4px;
  border: 1px solid transparent;
  line-height: 1.3;
  white-space: nowrap;
}
.realm-4 { background: rgba(213, 163, 86, 0.22); color: #f2c874; border-color: rgba(213, 163, 86, 0.5); }
.realm-3 { background: rgba(163, 122, 204, 0.20); color: #d3b2f5; border-color: rgba(163, 122, 204, 0.45); }
.realm-2 { background: rgba(90, 163, 130, 0.20); color: #8fd9b6; border-color: rgba(90, 163, 130, 0.45); }
.realm-1 { background: rgba(93, 148, 191, 0.20); color: #95c8f0; border-color: rgba(93, 148, 191, 0.45); }
.realm-0 { background: rgba(155, 140, 122, 0.18); color: #cfc2b2; border-color: rgba(155, 140, 122, 0.35); }
[data-theme="light"] .realm-4 { background: #faecc8; color: #7a4c09; border-color: #d6a756; }
[data-theme="light"] .realm-3 { background: #efe4fa; color: #5b2f8c; border-color: #bc98e3; }
[data-theme="light"] .realm-2 { background: #ddf2e8; color: #1f6345; border-color: #7bbfa0; }
[data-theme="light"] .realm-1 { background: #dfeef9; color: #1f547d; border-color: #82b5db; }
[data-theme="light"] .realm-0 { background: #ece5da; color: #52463a; border-color: #c4b7a3; }

.tier-A { background: rgba(194, 89, 73, 0.22); color: #f09586; border-color: rgba(194, 89, 73, 0.45); }
.tier-B { background: rgba(212, 150, 66, 0.20); color: #ebc07c; border-color: rgba(212, 150, 66, 0.42); }
.tier-C { background: rgba(130, 120, 108, 0.18); color: #bdb0a0; border-color: rgba(130, 120, 108, 0.35); }
.tier-beast { background: rgba(74, 158, 150, 0.22); color: #88dbd2; border-color: rgba(74, 158, 150, 0.45); }
[data-theme="light"] .tier-A { background: #fae1dc; color: #8f2d1e; border-color: #dc8e81; }
[data-theme="light"] .tier-B { background: #faecd4; color: #875512; border-color: #dbb16e; }
[data-theme="light"] .tier-C { background: #ebe5dc; color: #5b5044; border-color: #c4b8a7; }
[data-theme="light"] .tier-beast { background: #daf2ef; color: #1e6b64; border-color: #7cc4bc; }

.status-dead { background: rgba(140, 126, 114, 0.24); color: #c7bbb0; border-color: rgba(140, 126, 114, 0.45); }
[data-theme="light"] .status-dead { background: #e8e2da; color: #574e45; border-color: #bfb5a8; }

/* Table View */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
}
table.lb-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.lb-table th {
  text-align: left;
  padding: 9px 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  color: var(--text-muted);
  font-weight: 600;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
.lb-table th:hover { color: var(--brass); }
.lb-table th.num, .lb-table td.num { text-align: right; font-family: var(--font-mono); }
.lb-table td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.lb-table tbody tr { cursor: pointer; }
.lb-table tbody tr:hover { background: var(--card-hover); }
.lb-table tbody tr.selected { background: var(--brass-soft); }
.tbl-name-cell {
  display: flex;
  align-items: center;
  gap: 8px;
}
.tbl-thumb {
  width: 26px;
  height: 36px;
  border-radius: 3px;
  object-fit: cover;
  object-position: top;
  background: var(--panel);
  flex-shrink: 0;
}
.tbl-sigil {
  width: 26px;
  height: 36px;
  border-radius: 3px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--brass-soft);
  color: var(--brass);
  font-family: var(--font-han);
  font-size: 13px;
  flex-shrink: 0;
}

/* Dossier Inspector */
.dossier-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 45;
}
.dossier-pane {
  flex: 0 0 440px;
  width: 440px;
  position: sticky;
  top: 148px;
  max-height: calc(100vh - 160px);
  overflow-y: auto;
  background: var(--bg-elev);
  border-left: 1px solid var(--border);
  padding: 16px 18px 28px;
  scrollbar-width: thin;
}
.dossier-close-mobile {
  display: none;
  margin-bottom: 10px;
}
.dossier-empty {
  padding: 40px 18px;
  text-align: center;
  color: var(--text-muted);
}
.dossier-hero {
  display: flex;
  gap: 14px;
  margin-bottom: 14px;
}
.dossier-portrait-box {
  flex: 0 0 124px;
  width: 124px;
  aspect-ratio: 2 / 3;
  border-radius: 7px;
  overflow: hidden;
  border: 1px solid var(--border-strong);
  background: #100d0a;
  cursor: zoom-in;
}
.dossier-portrait-box.no-zoom { cursor: default; }
.dossier-portrait-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
}
.dossier-head-info { flex: 1 1 auto; min-width: 0; }
.dossier-title {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 19px;
  line-height: 1.2;
}
.dossier-han {
  font-family: var(--font-han);
  font-size: 15px;
  color: var(--brass);
  margin-left: 6px;
}
.dossier-gloss {
  font-style: italic;
  font-size: 12px;
  color: var(--text-muted);
  margin: 4px 0 8px;
}
.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 8px;
}
.dossier-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}
.btn-xs {
  font-size: 11.5px;
  padding: 3.5px 8px;
  border-radius: 5px;
}
.stat-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 12px;
}
.stat-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
  text-align: center;
}
.stat-box .lbl {
  font-size: 10px;
  text-transform: uppercase;
  color: var(--text-muted);
  letter-spacing: 0.04em;
}
.stat-box .val {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--brass);
}
.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 10px 12px;
  margin-bottom: 12px;
  font-size: 12.5px;
}
.meta-item { min-width: 0; }
.meta-item.full { grid-column: 1 / -1; }
.meta-k {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  display: block;
}
.meta-v { color: var(--text); word-break: break-word; }
.jump-link {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: var(--brass);
  cursor: pointer;
  background: var(--brass-soft);
  border: 1px solid var(--brass-border);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 12px;
  margin: 2px 3px 0 0;
}
.jump-link:hover { filter: brightness(1.15); }

/* Bars */
.section-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 10px 12px;
  margin-bottom: 12px;
}
.section-title {
  margin: 0 0 8px;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--brass);
  font-weight: 700;
}
.bars-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 12px;
}
.bar-row { display: flex; flex-direction: column; gap: 2px; }
.bar-head {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
}
.bar-track {
  height: 6px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--border);
  overflow: hidden;
}
.bar-fill { height: 100%; border-radius: 999px; }

/* Dossier Sub-tabs */
.subtabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.subtab-btn {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 7px 11px;
  cursor: pointer;
  color: var(--text-muted);
  font-weight: 600;
  font-size: 12.5px;
}
.subtab-btn.active {
  color: var(--brass);
  border-bottom-color: var(--brass);
}
.list-clean {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.item-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 12.5px;
}
.trait-group { margin-bottom: 10px; }
.trait-group-lbl {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  margin-bottom: 5px;
  font-weight: 700;
}
.trait-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.dossier-traits-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 7px;
}
.dossier-traits-head .section-title { margin: 0; }
.dossier-traits-hint { font-size: 10.5px; color: var(--text-muted); }
.dossier-trait-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;
  font-weight: 600;
  padding: 2.5px 7px;
  border-radius: 5px;
  border: 1px solid var(--border);
  cursor: pointer;
  line-height: 1.3;
  transition: filter 0.12s, box-shadow 0.12s;
}
.dossier-trait-chip:hover { filter: brightness(1.14); }
.dossier-trait-chip.active-filter {
  box-shadow: 0 0 0 2px var(--brass);
}
.trait-ico-16 {
  width: 16px;
  height: 16px;
  border-radius: 3px;
  object-fit: cover;
  flex-shrink: 0;
  display: block;
}
.trait-detail-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.trait-detail-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 7px 9px;
  border-radius: 6px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-left-width: 3px;
}
.trait-detail-item.tcat-calling { border-left-color: #d5a356; }
.trait-detail-item.tcat-fate_given { border-left-color: #a37acc; }
.trait-detail-item.tcat-talent { border-left-color: #5aa382; }
.trait-detail-item.tcat-personality { border-left-color: #5d94bf; }
.trait-detail-item.tcat-path { border-left-color: #d49642; }
.trait-detail-item.tcat-lifestyle { border-left-color: #4da69e; }
.trait-detail-item.tcat-upbringing { border-left-color: #8c9ab0; }
.trait-detail-item.tcat-gained { border-left-color: #c25949; }
.trait-detail-item.tcat-health { border-left-color: #cc6d52; }
.trait-detail-item.tcat-coping { border-left-color: #a67294; }
.trait-detail-item.active-filter {
  box-shadow: 0 0 0 1px var(--brass);
}
.trait-ico-22 {
  width: 22px;
  height: 22px;
  border-radius: 4px;
  object-fit: cover;
  flex-shrink: 0;
  margin-top: 1px;
  border: 1px solid var(--border);
  background: var(--card);
}
.trait-ico-fallback {
  width: 22px;
  height: 22px;
  border-radius: 4px;
  flex-shrink: 0;
  margin-top: 1px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  border: 1px solid currentColor;
  opacity: 0.9;
}
.trait-detail-body { flex: 1 1 auto; min-width: 0; }
.trait-detail-top {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 5px;
}
.trait-detail-name {
  background: transparent;
  border: none;
  padding: 0;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text);

}
.trait-detail-name:hover { color: var(--brass); text-decoration: underline; }
.trait-detail-vi { color: var(--text-muted); font-size: 11.5px; }
.trait-detail-tier {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 0.5px 5px;

}

  color: var(--text-muted);
  margin-top: 2px;

}
.trait-detail-effects {

  gap: 4px;

}
.trait-eff-tag {
  font-family: var(--font-mono);
  font-size: 10.5px;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
}
.trait-eff-tag.eff-open {
  border-color: var(--brass-border);
  color: var(--brass);
}
.trait-eff-tag.eff-price {
  border-color: rgba(194, 89, 73, 0.45);
  color: var(--crimson);
}
.lore-block { margin-bottom: 10px; font-size: 13px; }
.lore-block h4 {
  margin: 0 0 3px;
  font-size: 11px;
  text-transform: uppercase;
  color: var(--text-muted);
}
.lore-block p { margin: 0; white-space: pre-wrap; }
.secret-box {
  margin-top: 6px;
  padding: 9px 11px;
  background: rgba(194, 89, 73, 0.10);
  border: 1px solid rgba(194, 89, 73, 0.35);
  border-radius: 6px;
  font-size: 12.5px;
  white-space: pre-wrap;
}
.event-card {
  padding: 8px 10px;

  border: 1px solid var(--border);

  margin-bottom: 8px;
}
.event-meta {

  align-items: center;
  gap: 6px;
  margin-bottom: 4px;

}
.event-year {

  font-weight: 700;
  color: var(--brass);
}

.event-text.alt { color: var(--text-muted); font-size: 12px; }

/* Lightbox */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(8, 6, 4, 0.88);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  padding: 20px;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-height: 82vh;
  max-width: 90vw;
  border-radius: 8px;
  border: 2px solid var(--brass-border);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
}
.lightbox-caption {
  color: #efe5d6;
  font-family: var(--font-serif);
  font-size: 16px;
}

.empty-state {
  padding: 48px 20px;
  text-align: center;
  color: var(--text-muted);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}

@media (max-width: 960px) {
  .dossier-pane {
    display: none;
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(440px, 94vw);
    max-height: none;
    z-index: 50;
    box-shadow: -8px 0 30px rgba(0, 0, 0, 0.5);
  }
  .dossier-pane.open { display: block; }
  .dossier-backdrop.open { display: block; }
  .dossier-close-mobile { display: inline-flex; }
}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-top">
    <div class="brand">
      <h1>Cast &amp; Spirit Beasts Compendium</h1>
      <span class="brand-sub" id="headerMeta">Loading data...</span>
    </div>
    <div class="header-actions">
      <div class="segmented" role="group" aria-label="View mode">
        <button id="btnViewGrid" class="active" type="button">Portrait Grid</button>
        <button id="btnViewTable" type="button">Leaderboard Table</button>
      </div>
      <button id="btnTheme" class="btn" type="button" title="Toggle dark/light theme">Light Parchment</button>
    </div>
  </div>
  <nav class="tabs-bar" id="tabsBar" aria-label="Character categories"></nav>
  <div class="filters-bar">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Search name, Hanzi, id, sect, role, technique, gear, trait..." autocomplete="off">
      <button id="searchClear" class="search-clear" type="button" aria-label="Clear search">&times;</button>
    </div>
    <select id="filterSect" class="filter-select" aria-label="Filter by sect"></select>
    <select id="filterTier" class="filter-select" aria-label="Filter by tier">
      <option value="">All Tiers</option>
      <option value="A">Tier A</option>
      <option value="B">Tier B</option>
      <option value="C">Tier C</option>
      <option value="beast">Spirit Beast</option>
      <option value="__none">Unassigned</option>
    </select>
    <select id="filterElement" class="filter-select" aria-label="Filter by root element"></select>
    <select id="filterArchetype" class="filter-select" aria-label="Filter by archetype"></select>
    <select id="filterTrait" class="filter-select" aria-label="Filter by trait"></select>
    <select id="sortSelect" class="filter-select" aria-label="Sort by">
      <option value="rank">Sort: Rank / Power</option>
      <option value="name">Sort: Name</option>
      <option value="age">Sort: Age</option>
      <option value="ties">Sort: Ties</option>
      <option value="events">Sort: Events</option>
    </select>
    <select id="pageSizeSelect" class="filter-select" aria-label="Page size">
      <option value="48">48 / page</option>
      <option value="100">100 / page</option>
      <option value="250">250 / page</option>
      <option value="99999">Show All</option>
    </select>
    <button id="btnReset" class="btn" type="button">Reset</button>
  </div>
</header>

<div class="workspace">
  <main class="main-col">
    <div class="toolbar-meta">
      <span id="matchSummary">—</span>
      <div class="pager">
        <button id="btnPrev" class="btn btn-xs" type="button">&larr; Prev</button>
        <span id="pageInfo">Page 1 / 1</span>
        <button id="btnNext" class="btn btn-xs" type="button">Next &rarr;</button>
      </div>
    </div>
    <div id="contentHost"></div>
  </main>

  <div id="dossierBackdrop" class="dossier-backdrop"></div>
  <aside id="dossierPane" class="dossier-pane" aria-label="Character dossier">
    <button id="btnCloseMobile" class="btn btn-xs dossier-close-mobile" type="button">&larr; Close Dossier</button>
    <div id="dossierBody" class="dossier-empty">Select a character to inspect their full dossier.</div>
  </aside>
</div>

<div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
  <img id="lightboxImg" src="" alt="">
  <div id="lightboxCaption" class="lightbox-caption"></div>
  <button id="lightboxClose" class="btn" type="button">Close (Esc)</button>
</div>

<script src="./characters.data.js"></script>
<script>
(function() {
  "use strict";

  const ELEMENT_META = {
    kim: { name: "Kim (Metal)", color: "#d6b85a" },
    moc: { name: "Mộc (Wood)", color: "#58a86a" },
    thuy: { name: "Thủy (Water)", color: "#4d8fd6" },
    hoa: { name: "Hỏa (Fire)", color: "#d66045" },
    tho: { name: "Thổ (Earth)", color: "#b58b52" },
    phong: { name: "Phong (Wind)", color: "#6ac4b1" },
    huyet: { name: "Huyết (Blood)", color: "#b83b4a" },
    hu_khong: { name: "Hư Không (Void)", color: "#8c6cd6" },
    loi: { name: "Lôi (Thunder)", color: "#a474e8" },
    am: { name: "Ám (Shadow)", color: "#767a99" },
    hon_don: { name: "Hỗn Độn (Chaos)", color: "#b868b0" },
    quang: { name: "Quang (Light)", color: "#e8cf72" },
    bang: { name: "Băng (Frost)", color: "#7ec8e8" }
  };

  const ARCHETYPE_LABELS = {
    kiem_tu: "Kiếm Tu (Sword)",
    phap_tu: "Pháp Tu (Spell)",
    the_tu: "Thể Tu (Body)",
    tran_su: "Trận Sư (Formation)",
    dan_su: "Đan Sư (Alchemy)",
    linh_thuc_su: "Linh Thực Sư (Spirit Planter)",
    tan_tu: "Tán Tu (Loose)",
    linh_thu: "Linh Thú (Spirit Beast)"
  };

  const THIEN_PHU_LABELS = {
    ngo_tinh: "Ngộ tính",
    can_cot: "Căn cốt",
    than_hon: "Thần hồn",
    khi_van: "Khí vận",
    dao_tam: "Đạo tâm",
    mi_luc: "Mị lực"
  };

  const TECH_TIERS = ["Hoàng giai", "Huyền giai", "Địa giai", "Thiên giai"];
  const GEAR_GRADES = ["Phàm phẩm", "Hạ phẩm", "Trung phẩm", "Thượng phẩm", "Cực phẩm"];
  const TRAIT_GROUP_LABELS = {
    calling: "Calling",
    fate_given: "Fate-Given",
    talent: "Talent",
    personality: "Personality",
    path: "Path",
    lifestyle: "Lifestyle",
    upbringing: "Upbringing",
    gained: "Gained",
    health: "Health",
    coping: "Coping"
  };
  const TRAIT_PRIORITY_ORDER = [
    "calling", "fate_given", "talent", "personality", "path",
    "lifestyle", "upbringing", "gained", "health", "coping"
  ];

  let DATA = null;
  let BY_ID = new Map();
  let SEARCH_INDEX = new Map();
  let FILTERED = [];

  const state = {
    tab: "all",
    view: "grid",
    search: "",
    sect: "",
    tier: "",
    element: "",
    archetype: "",
    trait: "",
    sort: "rank",
    sortDir: "asc",
    tableSortCol: "rank",
    pageSize: 48,
    page: 1,
    selectedId: null,
    dossierTab: "build",
    secretOpen: false,
    eventLang: "both"
  };

  function collectCharTraits(c) {
    const out = [];
    const lookupMap = (DATA && DATA.lookups && DATA.lookups.traits) || {};
    for (const cat of TRAIT_PRIORITY_ORDER) {
      const arr = (c.traits && c.traits[cat]) || [];
      for (const t of arr) {
        out.push({ cat, trait: t, meta: lookupMap[t.id] || null });
      }
    }
    return out;
  }

  function hasTraitId(c, traitId) {
    if (!traitId || !c.traits) return false;
    for (const cat of TRAIT_PRIORITY_ORDER) {
      const arr = c.traits[cat];
      if (!arr) continue;
      for (const t of arr) {
        if (t.id === traitId) return true;
      }
    }
    return false;
  }

  function traitLabel(t) {
    return t.tier != null ? `${t.name} T${t.tier}` : t.name;
  }

  function traitTooltip(entry) {
    const t = entry.trait;
    const m = entry.meta;
    const catLbl = TRAIT_GROUP_LABELS[entry.cat] || entry.cat;
    const head = `${traitLabel(t)}${t.name_vi ? " (" + t.name_vi + ")" : ""}`;
    const parts = [head, catLbl];
    if (m && m.meaning) parts.push(m.meaning);
    if (m && m.effects && m.effects.length) parts.push(m.effects.join("; "));
    return parts.join(" | ");
  }

  function renderCompactTraitPills(c, maxShow) {
    const all = collectCharTraits(c);
    if (!all.length) return "";
    const shown = all.slice(0, maxShow);
    const rem = all.length - shown.length;
    const pills = shown.map(e =>
      `<span class="trait-pill tcat-${esc(e.cat)}" title="${esc(traitTooltip(e))}">${esc(traitLabel(e.trait))}</span>`
    ).join("");
    const more = rem > 0
      ? `<span class="trait-pill trait-pill-more" title="${esc(all.slice(maxShow).map(e => traitLabel(e.trait)).join(", "))}">+${rem}</span>`
      : "";
    return pills + more;
  }

  function activateTraitFilter(traitId) {
    state.trait = state.trait === traitId ? "" : traitId;
    const sel = document.getElementById("filterTrait");
    if (sel) sel.value = state.trait;
    state.page = 1;
    applyFilters();
    renderDossier();
  }

  function norm(s) {
    if (!s) return "";
    return String(s)
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/đ/g, "d")
      .replace(/Đ/g, "d")
      .toLowerCase();
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function fmtNum(n) {
    return n == null ? "—" : Number(n).toLocaleString("en-US");
  }

  function fmtPowerShort(p) {
    if (p == null) return "—";
    if (p >= 1000000) return (p / 1000000).toFixed(2).replace(/\.00$/, "") + "M";
    if (p >= 100000) return Math.round(p / 1000) + "K";
    if (p >= 10000) return (p / 1000).toFixed(1).replace(/\.0$/, "") + "K";
    return fmtNum(p);
  }

  function initTheme() {
    const saved = localStorage.getItem("characters_viewer_theme") || "dark";
    applyTheme(saved);
    document.getElementById("btnTheme").addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      applyTheme(next);
      localStorage.setItem("characters_viewer_theme", next);
    });
  }

  function applyTheme(mode) {
    if (mode === "light") {
      document.documentElement.setAttribute("data-theme", "light");
      document.getElementById("btnTheme").textContent = "Dark Hardwood";
    } else {
      document.documentElement.removeAttribute("data-theme");
      document.getElementById("btnTheme").textContent = "Light Parchment";
    }
  }

  function buildSearchText(c) {
    const parts = [
      c.name, c.name_han, c.id, c.gloss, c.sect.name, c.sect.id,
      c.owner ? c.owner.name : "", c.species, c.rank_title, c.role,
      c.realm.name, c.realm.label
    ];
    if (c.build) {
      parts.push(c.build.archetype);
      if (c.build.main_technique) parts.push(c.build.main_technique.name);
      for (const a of c.build.aux_techniques) parts.push(a.name);
      for (const g of c.build.gear) parts.push(g.name);
      for (const s of c.build.sets) parts.push(s.name);
    }
    for (const k of Object.keys(c.traits)) {
      for (const t of c.traits[k]) {
        parts.push(t.name, t.name_vi, t.id);
      }
    }
    return norm(parts.join(" "));
  }

  function boot(data) {
    DATA = data;
    BY_ID = new Map();
    SEARCH_INDEX = new Map();
    for (const c of DATA.characters) {
      BY_ID.set(c.id, c);
      SEARCH_INDEX.set(c.id, buildSearchText(c));
    }

    const ct = DATA.counts;
    document.getElementById("headerMeta").textContent =
      `${fmtNum(ct.total)} total · ${fmtNum(ct.living_cast)} living · ${fmtNum(ct.beasts)} beasts · ${fmtNum(ct.dead_cast)} historical · ${fmtNum(ct.with_portrait)} portraits · v${DATA.generated_from.world_history_version}`;

    buildTabs();
    populateFilterDropdowns();
    bindEvents();
    handleHash();
    if (!state.selectedId && DATA.characters.length) {
      state.selectedId = DATA.characters[0].id;
    }
    applyFilters();
    renderDossier();
  }

  function buildTabs() {
    const c = DATA.characters;
    const realmCounts = { hoa_than: 0, nguyen_anh: 0, ket_dan: 0, truc_co: 0, luyen_khi: 0 };
    for (const ch of c) {
      if (ch.status === "living" && realmCounts[ch.realm.id] != null) realmCounts[ch.realm.id]++;
    }
    const defs = [
      { id: "all", label: "All", count: DATA.counts.total },
      { id: "living", label: "Living Cast", count: DATA.counts.living_cast },
      { id: "hoa_than", label: "Hóa Thần", count: realmCounts.hoa_than },
      { id: "nguyen_anh", label: "Nguyên Anh", count: realmCounts.nguyen_anh },
      { id: "ket_dan", label: "Kết Đan", count: realmCounts.ket_dan },
      { id: "truc_co", label: "Trúc Cơ", count: realmCounts.truc_co },
      { id: "luyen_khi", label: "Luyện Khí", count: realmCounts.luyen_khi },
      { id: "beast", label: "Spirit Beasts", count: DATA.counts.beasts },
      { id: "dead", label: "Dead / Historical", count: DATA.counts.dead_cast }
    ];
    const bar = document.getElementById("tabsBar");
    bar.innerHTML = defs.map(d =>
      `<button type="button" class="tab-btn${d.id === state.tab ? " active" : ""}" data-tab="${d.id}">${esc(d.label)}<span class="tab-count">${fmtNum(d.count)}</span></button>`
    ).join("");
    bar.addEventListener("click", (ev) => {
      const btn = ev.target.closest(".tab-btn");
      if (!btn) return;
      state.tab = btn.dataset.tab;
      state.page = 1;
      for (const b of bar.querySelectorAll(".tab-btn")) b.classList.toggle("active", b === btn);
      applyFilters();
    });
  }

  function populateFilterDropdowns() {
    const sectSel = document.getElementById("filterSect");
    const activeSects = [];
    const fallenSects = [];
    for (const s of Object.values(DATA.lookups.sects)) {
      if (s.fallen) fallenSects.push(s); else activeSects.push(s);
    }
    activeSects.sort((a, b) => a.name.localeCompare(b.name, "vi"));
    fallenSects.sort((a, b) => a.name.localeCompare(b.name, "vi"));
    sectSel.innerHTML =
      `<option value="">All Sects</option>` +
      `<option value="__tantu">Tán Tu (No Sect)</option>` +
      `<optgroup label="Active Sects (${activeSects.length})">` +
      activeSects.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("") +
      `</optgroup>` +
      `<optgroup label="Fallen Sects (${fallenSects.length})">` +
      fallenSects.map(s => `<option value="${esc(s.id)}">${esc(s.name)} (Fallen)</option>`).join("") +
      `</optgroup>`;

    const elemSel = document.getElementById("filterElement");
    elemSel.innerHTML =
      `<option value="">All Root Elements</option>` +
      Object.entries(ELEMENT_META).map(([k, v]) => `<option value="${k}">${esc(v.name)}</option>`).join("");

    const archSel = document.getElementById("filterArchetype");
    archSel.innerHTML =
      `<option value="">All Archetypes</option>` +
      Object.entries(ARCHETYPE_LABELS).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");

    const traitCounts = new Map();
    for (const ch of DATA.characters) {
      const seen = new Set();
      for (const cat of TRAIT_PRIORITY_ORDER) {
        for (const t of (ch.traits[cat] || [])) {
          if (!seen.has(t.id)) {
            seen.add(t.id);
            traitCounts.set(t.id, (traitCounts.get(t.id) || 0) + 1);
          }
        }
      }
    }
    const traitsByCat = {};
    for (const cat of TRAIT_PRIORITY_ORDER) traitsByCat[cat] = [];
    for (const td of Object.values(DATA.lookups.traits || {})) {
      if (traitsByCat[td.kind]) traitsByCat[td.kind].push(td);
    }
    const traitSel = document.getElementById("filterTrait");
    traitSel.innerHTML =
      `<option value="">All Traits</option>` +
      TRAIT_PRIORITY_ORDER.map(cat => {
        const list = (traitsByCat[cat] || []).slice().sort((a, b) => a.name.localeCompare(b.name, "en"));
        if (!list.length) return "";
        const lbl = TRAIT_GROUP_LABELS[cat] || cat;
        const opts = list.map(td => {
          const cnt = traitCounts.get(td.id) || 0;
          return `<option value="${esc(td.id)}">${esc(td.name)}${cnt ? " (" + cnt + ")" : ""}</option>`;
        }).join("");
        return `<optgroup label="${esc(lbl)} (${list.length})">${opts}</optgroup>`;
      }).join("");
  }

  function bindEvents() {
    let searchTimer = null;
    const sInput = document.getElementById("searchInput");
    const sClear = document.getElementById("searchClear");
    sInput.addEventListener("input", () => {
      sClear.classList.toggle("visible", sInput.value.length > 0);
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.search = norm(sInput.value.trim());
        state.page = 1;
        applyFilters();
      }, 75);
    });
    sClear.addEventListener("click", () => {
      sInput.value = "";
      sClear.classList.remove("visible");
      state.search = "";
      state.page = 1;
      applyFilters();
    });

    document.getElementById("filterSect").addEventListener("change", e => { state.sect = e.target.value; state.page = 1; applyFilters(); });
    document.getElementById("filterTier").addEventListener("change", e => { state.tier = e.target.value; state.page = 1; applyFilters(); });
    document.getElementById("filterElement").addEventListener("change", e => { state.element = e.target.value; state.page = 1; applyFilters(); });
    document.getElementById("filterArchetype").addEventListener("change", e => { state.archetype = e.target.value; state.page = 1; applyFilters(); });
    document.getElementById("filterTrait").addEventListener("change", e => { state.trait = e.target.value; state.page = 1; applyFilters(); renderDossier(); });
    document.getElementById("sortSelect").addEventListener("change", e => {
      state.sort = e.target.value;
      state.tableSortCol = e.target.value;
      state.sortDir = "asc";
      state.page = 1;
      applyFilters();
    });
    document.getElementById("pageSizeSelect").addEventListener("change", e => {
      state.pageSize = parseInt(e.target.value, 10) || 48;
      state.page = 1;
      renderContent();
    });
    document.getElementById("btnReset").addEventListener("click", () => {
      state.search = ""; state.sect = ""; state.tier = ""; state.element = ""; state.archetype = ""; state.trait = "";
      state.sort = "rank"; state.tableSortCol = "rank"; state.sortDir = "asc"; state.page = 1;
      sInput.value = ""; sClear.classList.remove("visible");
      document.getElementById("filterSect").value = "";
      document.getElementById("filterTier").value = "";
      document.getElementById("filterElement").value = "";
      document.getElementById("filterArchetype").value = "";
      document.getElementById("filterTrait").value = "";
      document.getElementById("sortSelect").value = "rank";
      applyFilters();
      renderDossier();
    });

    document.getElementById("btnViewGrid").addEventListener("click", () => setView("grid"));
    document.getElementById("btnViewTable").addEventListener("click", () => setView("table"));
    document.getElementById("btnPrev").addEventListener("click", () => { if (state.page > 1) { state.page--; renderContent(); window.scrollTo({ top: 0, behavior: "smooth" }); } });
    document.getElementById("btnNext").addEventListener("click", () => {
      const totalPages = Math.max(1, Math.ceil(FILTERED.length / state.pageSize));
      if (state.page < totalPages) { state.page++; renderContent(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    });

    document.getElementById("btnCloseMobile").addEventListener("click", closeMobileDossier);
    document.getElementById("dossierBackdrop").addEventListener("click", closeMobileDossier);

    document.getElementById("dossierBody").addEventListener("click", (e) => {
      const tf = e.target.closest("[data-trait-filter]");
      if (tf) {
        activateTraitFilter(tf.dataset.traitFilter);
        return;
      }
      const jump = e.target.closest("[data-jump]");
      if (jump) {
        selectChar(jump.dataset.jump, true);
        return;
      }
      const secBtn = e.target.closest("#btnToggleSecret");
      if (secBtn) {
        state.secretOpen = !state.secretOpen;
        renderDossier();
        return;
      }
      const langBtn = e.target.closest("[data-evlang]");
      if (langBtn) {
        state.eventLang = langBtn.dataset.evlang;
        renderDossier();
      }
    });

    const lb = document.getElementById("lightbox");
    document.getElementById("lightboxClose").addEventListener("click", () => lb.classList.remove("open"));
    lb.addEventListener("click", (e) => { if (e.target === lb) lb.classList.remove("open"); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") lb.classList.remove("open"); });
    window.addEventListener("hashchange", handleHash);
  }

  function setView(v) {
    state.view = v;
    document.getElementById("btnViewGrid").classList.toggle("active", v === "grid");
    document.getElementById("btnViewTable").classList.toggle("active", v === "table");
    renderContent();
  }

  function matchesTab(c) {
    switch (state.tab) {
      case "all": return true;
      case "living": return c.status === "living";
      case "beast": return c.status === "beast";
      case "dead": return c.status === "dead";
      default: return c.status === "living" && c.realm.id === state.tab;
    }
  }

  function applyFilters() {
    const qTokens = state.search ? state.search.split(/\s+/).filter(Boolean) : [];
    FILTERED = DATA.characters.filter(c => {
      if (!matchesTab(c)) return false;
      if (state.sect === "__tantu") { if (c.sect.id !== "") return false; }
      else if (state.sect && c.sect.id !== state.sect) return false;
      if (state.tier === "__none") { if (c.tier !== "") return false; }
      else if (state.tier && c.tier !== state.tier) return false;
      if (state.element) {
        const b = c.build;
        if (!b || (!(state.element in b.root.elements) && !(state.element in b.root.variants))) return false;
      }
      if (state.archetype) {
        if (!c.build || c.build.archetype !== state.archetype) return false;
      }
      if (state.trait) {
        if (!hasTraitId(c, state.trait)) return false;
      }
      if (qTokens.length) {
        const hay = SEARCH_INDEX.get(c.id) || "";
        for (const tok of qTokens) {
          if (hay.indexOf(tok) === -1) return false;
        }
      }
      return true;
    });
    sortFiltered();
    renderContent();
  }

  function sortFiltered() {
    const col = state.tableSortCol || state.sort;
    const dir = state.sortDir === "desc" ? -1 : 1;
    const tierOrder = { A: 0, B: 1, C: 2, beast: 3, "": 4 };
    FILTERED.sort((a, b) => {
      let cmp = 0;
      if (col === "rank") {
        const ra = a.rating ? a.rating.global_rank : 999999;
        const rb = b.rating ? b.rating.global_rank : 999999;
        cmp = ra - rb;
        if (cmp === 0) cmp = b.realm.index - a.realm.index;
      } else if (col === "sub_rank") {
        const ra = a.rating ? a.rating.sub_rank : 999999;
        const rb = b.rating ? b.rating.sub_rank : 999999;
        cmp = ra - rb;
      } else if (col === "name") {
        cmp = a.name.localeCompare(b.name, "vi");
      } else if (col === "sect") {
        const sa = a.kind === "beast" && a.owner ? a.owner.name : a.sect.name;
        const sb = b.kind === "beast" && b.owner ? b.owner.name : b.sect.name;
        cmp = sa.localeCompare(sb, "vi");
      } else if (col === "stage") {
        cmp = (b.realm.index * 10 + (b.realm.stage == null ? -1 : b.realm.stage)) -
              (a.realm.index * 10 + (a.realm.stage == null ? -1 : a.realm.stage));
      } else if (col === "tier") {
        cmp = (tierOrder[a.tier] ?? 9) - (tierOrder[b.tier] ?? 9);
      } else if (col === "traits") {
        cmp = collectCharTraits(b).length - collectCharTraits(a).length;
      } else if (col === "power") {
        const pa = a.rating ? a.rating.power : -1;
        const pb = b.rating ? b.rating.power : -1;
        cmp = pb - pa;
      } else if (col === "elo") {
        const ea = a.rating ? a.rating.elo : -1e9;
        const eb = b.rating ? b.rating.elo : -1e9;
        cmp = eb - ea;
      } else if (col === "age") {
        cmp = (b.age == null ? -1 : b.age) - (a.age == null ? -1 : a.age);
      } else if (col === "ties") {
        cmp = b.ties.length - a.ties.length;
      } else if (col === "events") {
        cmp = b.events.length - a.events.length;
      }
      if (cmp === 0) cmp = a.name.localeCompare(b.name, "vi") || a.id.localeCompare(b.id);
      return cmp * dir;
    });
  }

  function renderContent() {
    const total = FILTERED.length;
    const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
    if (state.page > totalPages) state.page = totalPages;
    const start = (state.page - 1) * state.pageSize;
    const slice = FILTERED.slice(start, start + state.pageSize);

    document.getElementById("matchSummary").textContent =
      total === 0 ? "No matching characters" : `Showing ${fmtNum(start + 1)}–${fmtNum(Math.min(total, start + slice.length))} of ${fmtNum(total)} characters`;
    document.getElementById("pageInfo").textContent = `Page ${state.page} / ${totalPages}`;
    document.getElementById("btnPrev").disabled = state.page <= 1;
    document.getElementById("btnNext").disabled = state.page >= totalPages;

    const host = document.getElementById("contentHost");
    if (!slice.length) {
      host.innerHTML = `<div class="empty-state">No characters match the active filters. Try clearing your search or switching tabs.</div>`;
      return;
    }

    if (state.view === "grid") {
      host.innerHTML = `<div class="grid-view">${slice.map(renderCard).join("")}</div>`;
      host.querySelector(".grid-view").addEventListener("click", (e) => {
        const card = e.target.closest(".char-card");
        if (card) selectChar(card.dataset.id, true);
      });
    } else {
      host.innerHTML = renderTable(slice);
      host.querySelector("thead").addEventListener("click", (e) => {
        const th = e.target.closest("th[data-col]");
        if (!th) return;
        const col = th.dataset.col;
        if (state.tableSortCol === col) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        else { state.tableSortCol = col; state.sortDir = "asc"; }
        sortFiltered();
        renderContent();
      });
      host.querySelector("tbody").addEventListener("click", (e) => {
        const tr = e.target.closest("tr[data-id]");
        if (tr) selectChar(tr.dataset.id, true);
      });
    }
  }

  function renderCard(c) {
    const sel = c.id === state.selectedId ? " selected" : "";
    const rankHtml = c.rating
      ? `<span class="rank-badge${c.rating.global_rank <= 10 ? " top10" : ""}">#${c.rating.global_rank}</span>`
      : `<span class="rank-badge">Hist</span>`;
    const powerHtml = c.rating
      ? `<span class="power-pill">${esc(fmtPowerShort(c.rating.power))}</span>`
      : "";
    const mediaHtml = c.portrait.has_file
      ? `<img loading="lazy" src="${esc(c.portrait.rel_from_viewer)}" alt="${esc(c.name)}">`
      : `<div class="sigil-card"><div class="sigil-han">${esc(c.name_han || c.name.slice(0, 2))}</div><div class="sigil-species">${esc(c.species || "Spirit Beast")}</div><div class="sigil-pending">Portrait pending</div></div>`;
    const tierBadge = c.tier ? `<span class="badge tier-${esc(c.tier)}">${c.tier === "beast" ? "Beast" : "Tier " + esc(c.tier)}</span>` : "";
    const subLine = c.kind === "beast" && c.owner
      ? `Owner: ${c.owner.name}`
      : (c.sect.fallen ? `${c.sect.name} (Fallen)` : c.sect.name);
    const traitStrip = renderCompactTraitPills(c, 3);
    return `<article class="char-card${sel}" data-id="${esc(c.id)}">
      <div class="portrait-wrap">
        ${mediaHtml}
        <div class="card-overlay-top">${rankHtml}${powerHtml}</div>
        <div class="card-overlay-bot">
          <span class="badge realm-${c.realm.index}">${esc(c.realm.label)}</span>
          ${tierBadge}
        </div>
      </div>
      <div class="card-body">
        <div class="card-name-row">
          <span class="card-name" title="${esc(c.name)}">${esc(c.name)}</span>
          <span class="card-han">${esc(c.name_han)}</span>
        </div>
        <div class="card-sub" title="${esc(subLine)}">${esc(subLine)}</div>
        ${traitStrip ? `<div class="card-traits">${traitStrip}</div>` : ""}
      </div>
    </article>`;
  }

  function sortIndicator(col) {
    if (state.tableSortCol !== col) return "";
    return state.sortDir === "asc" ? " ▲" : " ▼";
  }

  function renderTable(slice) {
    const cols = [
      { id: "rank", label: "#", num: true },
      { id: "sub_rank", label: "Sub#", num: true },
      { id: "name", label: "Name" },
      { id: "sect", label: "Sect / Owner" },
      { id: "stage", label: "Stage" },
      { id: "tier", label: "Tier" },
      { id: "traits", label: "Traits" },
      { id: "power", label: "Power", num: true },
      { id: "elo", label: "Elo", num: true },
      { id: "ties", label: "Ties", num: true },
      { id: "events", label: "Events", num: true }
    ];
    const head = cols.map(co => `<th data-col="${co.id}" class="${co.num ? "num" : ""}">${esc(co.label)}${sortIndicator(co.id)}</th>`).join("");
    const rows = slice.map(c => {
      const sel = c.id === state.selectedId ? " class=\"selected\"" : "";
      const thumb = c.portrait.has_file
        ? `<img loading="lazy" class="tbl-thumb" src="${esc(c.portrait.rel_from_viewer)}" alt="">`
        : `<span class="tbl-sigil">${esc((c.name_han || c.name).slice(0, 1))}</span>`;
      const sectOrOwner = c.kind === "beast" && c.owner
        ? `Owner: ${c.owner.name}`
        : (c.sect.fallen ? `${c.sect.name} (Fallen)` : c.sect.name);
      const traitPills = renderCompactTraitPills(c, 3);
      return `<tr data-id="${esc(c.id)}"${sel}>
        <td class="num">${c.rating ? "#" + c.rating.global_rank : "—"}</td>
        <td class="num">${c.rating ? "#" + c.rating.sub_rank : "—"}</td>
        <td><div class="tbl-name-cell">${thumb}<div><strong>${esc(c.name)}</strong> <span style="color:var(--text-muted);font-family:var(--font-han)">${esc(c.name_han)}</span></div></div></td>
        <td>${esc(sectOrOwner)}</td>
        <td><span class="badge realm-${c.realm.index}">${esc(c.realm.label)}</span></td>
        <td>${c.tier ? `<span class="badge tier-${esc(c.tier)}">${c.tier === "beast" ? "Beast" : esc(c.tier)}</span>` : "—"}</td>
        <td>${traitPills ? `<div class="tbl-traits-cell">${traitPills}</div>` : "—"}</td>
        <td class="num">${c.rating ? esc(fmtNum(c.rating.power)) : "—"}</td>
        <td class="num">${c.rating ? c.rating.elo.toFixed(1) : "—"}</td>
        <td class="num">${c.ties.length}</td>
        <td class="num">${c.events.length}</td>
      </tr>`;
    }).join("");
    return `<div class="table-wrap"><table class="lb-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function selectChar(id, updateHash) {
    if (!BY_ID.has(id)) return;
    state.selectedId = id;
    state.secretOpen = false;
    if (updateHash) {
      const targetHash = "#char=" + encodeURIComponent(id);
      if (location.hash !== targetHash) history.replaceState(null, "", targetHash);
    }
    for (const el of document.querySelectorAll(".char-card.selected, .lb-table tbody tr.selected")) {
      el.classList.remove("selected");
    }
    const activeEl = document.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (activeEl) activeEl.classList.add("selected");
    renderDossier();
    if (window.innerWidth <= 960) {
      document.getElementById("dossierPane").classList.add("open");
      document.getElementById("dossierBackdrop").classList.add("open");
    }
  }

  function closeMobileDossier() {
    document.getElementById("dossierPane").classList.remove("open");
    document.getElementById("dossierBackdrop").classList.remove("open");
  }

  function handleHash() {
    const m = /^#char=(.+)$/.exec(location.hash || "");
    if (m) {
      const id = decodeURIComponent(m[1]);
      if (BY_ID.has(id)) {
        selectChar(id, false);
      }
    }
  }

  function openLightbox(c) {
    if (!c.portrait.has_file) return;
    document.getElementById("lightboxImg").src = c.portrait.rel_from_viewer;
    document.getElementById("lightboxCaption").textContent = `${c.name} ${c.name_han} — ${c.realm.label}`;
    document.getElementById("lightbox").classList.add("open");
  }

  function renderDossier() {
    const box = document.getElementById("dossierBody");
    const c = state.selectedId ? BY_ID.get(state.selectedId) : null;
    if (!c) {
      box.className = "dossier-empty";
      box.textContent = "Select a character to inspect their full dossier.";
      return;
    }
    box.className = "";

    const portraitHtml = c.portrait.has_file
      ? `<div class="dossier-portrait-box" id="dossierPortrait" title="Click to zoom"><img src="${esc(c.portrait.rel_from_viewer)}" alt="${esc(c.name)}"></div>`
      : `<div class="dossier-portrait-box no-zoom"><div class="sigil-card"><div class="sigil-han">${esc(c.name_han || c.name.slice(0, 2))}</div><div class="sigil-pending">Pending</div></div></div>`;

    const statusBadge = c.status === "dead"
      ? `<span class="badge status-dead">Historical (Dead)</span>`
      : (c.status === "beast" ? `<span class="badge tier-beast">Spirit Beast</span>` : `<span class="badge" style="background:var(--brass-soft);color:var(--brass);border-color:var(--brass-border)">Living Cast</span>`);
    const tierBadge = c.tier && c.tier !== "beast" ? `<span class="badge tier-${esc(c.tier)}">Tier ${esc(c.tier)}</span>` : "";

    const statStrip = c.rating
      ? `<div class="stat-strip">
          <div class="stat-box"><div class="lbl">Global</div><div class="val">#${c.rating.global_rank}</div></div>
          <div class="stat-box"><div class="lbl">Sub-Rank</div><div class="val">#${c.rating.sub_rank}</div></div>
          <div class="stat-box"><div class="lbl">Power</div><div class="val">${esc(fmtPowerShort(c.rating.power))}</div></div>
          <div class="stat-box"><div class="lbl">Elo (${c.rating.fights}f)</div><div class="val">${c.rating.elo.toFixed(0)}</div></div>
        </div>`
      : `<div class="stat-strip">
          <div class="stat-box"><div class="lbl">Status</div><div class="val">Historical</div></div>
          <div class="stat-box"><div class="lbl">Peak</div><div class="val">${esc(c.realm.name)}</div></div>
          <div class="stat-box"><div class="lbl">Lifespan</div><div class="val">${c.age != null ? c.age + "y" : "—"}</div></div>
          <div class="stat-box"><div class="lbl">Events</div><div class="val">${c.events.length}</div></div>
        </div>`;

    const ageStr = c.status === "dead"
      ? `${c.age != null ? c.age + " yrs" : "—"} (Yr ${c.born ?? "?"}–${c.died ?? "?"})`
      : `${c.age != null ? c.age + " yrs" : "—"} (Born Yr ${c.born ?? "?"})`;
    const locParts = [];
    if (c.location.home_name) locParts.push(c.location.home_name);
    if (c.location.region_name) locParts.push(c.location.region_name);
    const locStr = locParts.join(" · ") || "—";

    const metaRows = [
      `<div class="meta-item"><span class="meta-k">Age / Years</span><span class="meta-v">${esc(ageStr)}</span></div>`,
      `<div class="meta-item"><span class="meta-k">Sex / Rank</span><span class="meta-v">${esc(c.sex || "—")}${c.rank_title ? " · " + esc(c.rank_title) : ""}</span></div>`,
      `<div class="meta-item"><span class="meta-k">Sect</span><span class="meta-v">${esc(c.sect.name || "—")}${c.sect.fallen ? " (Fallen)" : ""}</span></div>`,
      `<div class="meta-item"><span class="meta-k">Location</span><span class="meta-v">${esc(locStr)}</span></div>`
    ];
    if (c.location.birthplace_name) {
      metaRows.push(`<div class="meta-item full"><span class="meta-k">Birthplace</span><span class="meta-v">${esc(c.location.birthplace_name)}</span></div>`);
    }
    if (c.cause_of_death) {
      metaRows.push(`<div class="meta-item full"><span class="meta-k">Cause of Death</span><span class="meta-v">${esc(c.cause_of_death)}</span></div>`);
    }
    if (c.species) {
      metaRows.push(`<div class="meta-item"><span class="meta-k">Species</span><span class="meta-v">${esc(c.species)}</span></div>`);
      metaRows.push(`<div class="meta-item"><span class="meta-k">Loyalty</span><span class="meta-v">${c.loyalty != null ? c.loyalty + " / 100" : "—"}</span></div>`);
    }
    if (c.master) {
      metaRows.push(`<div class="meta-item full"><span class="meta-k">Master</span><span class="meta-v"><button type="button" class="jump-link" data-jump="${esc(c.master.id)}">${esc(c.master.name)} &rarr;</button></span></div>`);
    }
    if (c.owner) {
      metaRows.push(`<div class="meta-item full"><span class="meta-k">Owner</span><span class="meta-v"><button type="button" class="jump-link" data-jump="${esc(c.owner.id)}">${esc(c.owner.name)} &rarr;</button></span></div>`);
    }
    if (c.beasts.length) {
      metaRows.push(`<div class="meta-item full"><span class="meta-k">Bonded Spirit Beasts</span><span class="meta-v">${c.beasts.map(b => `<button type="button" class="jump-link" data-jump="${esc(b.id)}">${esc(b.name)} &rarr;</button>`).join("")}</span></div>`);
    }

    // Always-visible compact Traits strip (directly below stat strip / meta grid, above subtabs)
    const allTraits = collectCharTraits(c);
    let traitsStripHtml = "";
    if (allTraits.length) {
      const chipsHtml = allTraits.map(entry => {
        const t = entry.trait;
        const m = entry.meta;
        const ico = m && m.icon && m.icon.has_file
          ? `<img class="trait-ico-16" src="${esc(m.icon.rel_from_viewer)}" width="16" height="16" loading="lazy" alt="">`
          : "";
        const activeCls = state.trait === t.id ? " active-filter" : "";
        return `<button type="button" class="dossier-trait-chip tcat-${esc(entry.cat)}${activeCls}" data-trait-filter="${esc(t.id)}" title="${esc(traitTooltip(entry))}">${ico}<span>${esc(traitLabel(t))}</span></button>`;
      }).join("");
      const hintTxt = state.trait && hasTraitId(c, state.trait) ? "Active filter (click to clear)" : "Click any trait to filter";
      traitsStripHtml = `<div class="section-card">
        <div class="dossier-traits-head">
          <h3 class="section-title">Traits (${allTraits.length})</h3>
          <span class="dossier-traits-hint">${esc(hintTxt)}</span>
        </div>
        <div class="trait-chips">${chipsHtml}</div>
      </div>`;
    }

    // Root + Thien Phu bars
    let barsHtml = "";
    if (c.build) {
      const rootBars = [];
      for (const [k, v] of Object.entries(c.build.root.elements)) {
        const em = ELEMENT_META[k] || { name: k, color: "#c9a050" };
        rootBars.push(renderBar(em.name, v, 100, em.color));
      }
      for (const [k, v] of Object.entries(c.build.root.variants)) {
        const em = ELEMENT_META[k] || { name: k, color: "#9d7ed6" };
        rootBars.push(renderBar(em.name + " ★", v, 100, em.color));
      }
      if (rootBars.length) {
        barsHtml += `<div class="section-card"><h3 class="section-title">Spiritual Root (Linh Căn)</h3><div class="bars-grid">${rootBars.join("")}</div></div>`;
      }
      const tpEntries = Object.entries(c.build.thien_phu || {});
      if (tpEntries.length) {
        const tpBars = tpEntries.map(([k, v]) => {
          const col = v >= 86 ? "#d5a356" : (v >= 61 ? "#5aa382" : (v >= 31 ? "#5d94bf" : "#9c8b78"));
          return renderBar(THIEN_PHU_LABELS[k] || k, v, 100, col);
        }).join("");
        barsHtml += `<div class="section-card"><h3 class="section-title">Innate Attributes (Thiên Phú)</h3><div class="bars-grid">${tpBars}</div></div>`;
      }
    }

    const subTabContent = state.dossierTab === "build"
      ? renderDossierBuild(c)
      : (state.dossierTab === "traits" ? renderDossierTraits(c) : renderDossierHistory(c));

    box.innerHTML = `
      <div class="dossier-hero">
        ${portraitHtml}
        <div class="dossier-head-info">
          <h2 class="dossier-title">${esc(c.name)}<span class="dossier-han">${esc(c.name_han)}</span></h2>
          ${c.gloss ? `<div class="dossier-gloss">“${esc(c.gloss)}”</div>` : ""}
          <div class="badge-row">
            <span class="badge realm-${c.realm.index}">${esc(c.realm.label)}</span>
            ${statusBadge}
            ${tierBadge}
          </div>
          <div class="dossier-actions">
            <button type="button" class="btn btn-xs" id="btnCopyJson">Copy JSON</button>
            <button type="button" class="btn btn-xs" id="btnCopyLink">Copy #Link</button>
          </div>
        </div>
      </div>
      ${statStrip}
      <div class="meta-grid">${metaRows.join("")}</div>
      ${traitsStripHtml}
      ${barsHtml}
      <div class="subtabs" id="dossierSubtabs">
        <button type="button" class="subtab-btn${state.dossierTab === "build" ? " active" : ""}" data-sub="build">Build</button>
        <button type="button" class="subtab-btn${state.dossierTab === "traits" ? " active" : ""}" data-sub="traits">Traits (${allTraits.length}) &amp; Lore</button>
        <button type="button" class="subtab-btn${state.dossierTab === "history" ? " active" : ""}" data-sub="history">Ties (${c.ties.length}) &amp; History (${c.events.length})</button>
      </div>
      <div id="dossierSubBody">${subTabContent}</div>
    `;

    const dp = document.getElementById("dossierPortrait");
    if (dp) dp.addEventListener("click", () => openLightbox(c));

    document.getElementById("btnCopyJson").addEventListener("click", (e) => {
      copyText(JSON.stringify(c, null, 2), e.currentTarget, "Copied JSON!");
    });
    document.getElementById("btnCopyLink").addEventListener("click", (e) => {
      const url = location.href.split("#")[0] + "#char=" + encodeURIComponent(c.id);
      copyText(url, e.currentTarget, "Copied Link!");
    });

    document.getElementById("dossierSubtabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".subtab-btn");
      if (!btn) return;
      state.dossierTab = btn.dataset.sub;
      renderDossier();
    });
  }

  function renderBar(label, val, max, color) {
    const pct = Math.max(0, Math.min(100, (val / max) * 100));
    return `<div class="bar-row">
      <div class="bar-head"><span>${esc(label)}</span><span style="font-family:var(--font-mono)">${val}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
  }

  function renderDossierBuild(c) {
    if (!c.build) {
      return `<div class="section-card"><p style="margin:0;color:var(--text-muted)">Historical record only — no active combat build at Year 1200.</p></div>`;
    }
    const b = c.build;
    const parts = [];
    parts.push(`<div class="section-card"><h3 class="section-title">Archetype &amp; Notes</h3>
      <div class="badge-row"><span class="badge btn-brass">${esc(ARCHETYPE_LABELS[b.archetype] || b.archetype)}</span></div>
      ${b.note ? `<p style="margin:6px 0 0;font-size:12.5px;color:var(--text-muted)">${esc(b.note)}</p>` : ""}
    </div>`);

    if (b.combat_beast) {
      const cb = b.combat_beast;
      const em = ELEMENT_META[cb.strikes] ? ELEMENT_META[cb.strikes].name : cb.strikes;
      parts.push(`<div class="section-card"><h3 class="section-title">Spirit Beast Combat</h3>
        <ul class="list-clean">
          <li class="item-row"><span>Strike Element</span><strong>${esc(em || "—")}</strong></li>
          <li class="item-row"><span>Owner Power Share</span><strong>${Math.round(cb.power_share * 100)}%</strong></li>
        </ul>
      </div>`);
    }

    if (b.main_technique || b.aux_techniques.length) {
      const rows = [];
      if (b.main_technique) {
        const t = b.main_technique;
        rows.push(`<li class="item-row"><span><strong>Main:</strong> ${esc(t.name)}</span><span class="badge tier-A">${esc(TECH_TIERS[t.tier] || "T" + t.tier)} · L${t.layer}</span></li>`);
      }
      for (const a of b.aux_techniques) {
        rows.push(`<li class="item-row"><span><strong>Aux:</strong> ${esc(a.name)}</span><span class="badge tier-C">${esc(TECH_TIERS[a.tier] || "T" + a.tier)} · L${a.layer}</span></li>`);
      }
      parts.push(`<div class="section-card"><h3 class="section-title">Cultivation Techniques (Công Pháp)</h3><ul class="list-clean">${rows.join("")}</ul></div>`);
    }

    if (b.gear.length || b.sets.length) {
      const setHtml = b.sets.length
        ? `<div class="badge-row" style="margin-bottom:8px">${b.sets.map(s => {
            const active = s.equipped_count >= 2;
            return `<span class="badge ${active ? "realm-2" : "tier-C"}">${active ? "★ " : ""}${esc(s.name)} (${s.equipped_count}/${s.total_pieces})</span>`;
          }).join("")}</div>`
        : "";
      const gearRows = b.gear.map(g =>
        `<li class="item-row"><span>${esc(g.name)}</span><span class="badge tier-${g.grade >= 3 ? "A" : (g.grade === 2 ? "B" : "C")}">${esc(GEAR_GRADES[g.grade] || "G" + g.grade)}${g.family ? " · " + esc(g.family) : ""}</span></li>`
      ).join("");
      parts.push(`<div class="section-card"><h3 class="section-title">Equipped Gear &amp; Sets (${b.gear.length})</h3>${setHtml}<ul class="list-clean">${gearRows}</ul></div>`);
    }

    if (b.tree) {
      const em = ELEMENT_META[b.tree.start] ? ELEMENT_META[b.tree.start].name : b.tree.start;
      const targets = b.tree.targets.length ? b.tree.targets.join(", ") : "None";
      parts.push(`<div class="section-card"><h3 class="section-title">Đạo Đồ Path</h3>
        <div style="font-size:12.5px"><strong>Start Sector:</strong> ${esc(em || "—")}</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;font-family:var(--font-mono)">Targets (${b.tree.targets.length}): ${esc(targets)}</div>
      </div>`);
    }

    return parts.join("");
  }

  function renderDossierTraits(c) {
    const lookupMap = (DATA && DATA.lookups && DATA.lookups.traits) || {};
    const traitGroups = [];
    for (const k of TRAIT_PRIORITY_ORDER) {
      const arr = c.traits[k] || [];
      if (!arr.length) continue;
      const label = TRAIT_GROUP_LABELS[k] || k;
      const itemsHtml = arr.map(t => {
        const meta = lookupMap[t.id] || null;
        const hasIcon = meta && meta.icon && meta.icon.has_file;
        const icoHtml = hasIcon
          ? `<img class="trait-ico-22" src="${esc(meta.icon.rel_from_viewer)}" width="22" height="22" loading="lazy" alt="">`
          : `<span class="trait-ico-fallback tcat-${esc(k)}" aria-hidden="true">${esc(label.slice(0, 2).toUpperCase())}</span>`;
        const tierHtml = t.tier != null ? `<span class="trait-detail-tier tcat-${esc(k)}">T${t.tier}</span>` : "";
        const meaningHtml = meta && meta.meaning ? `<div class="trait-detail-meaning">${esc(meta.meaning)}</div>` : "";
        const effs = (meta && meta.effects) || [];
        const effectsHtml = effs.length
          ? `<div class="trait-detail-effects">${effs.map(ef => {
              const cls = ef.startsWith("opens ") ? " eff-open" : (ef.includes("price:") ? " eff-price" : "");
              return `<span class="trait-eff-tag${cls}">${esc(ef)}</span>`;
            }).join("")}</div>`
          : "";
        const activeCls = state.trait === t.id ? " active-filter" : "";
        return `<div class="trait-detail-item tcat-${esc(k)}${activeCls}">
          ${icoHtml}
          <div class="trait-detail-body">
            <div class="trait-detail-top">
              <button type="button" class="trait-detail-name" data-trait-filter="${esc(t.id)}" title="Click to filter cast by this trait">${esc(t.name)}</button>
              ${t.name_vi ? `<span class="trait-detail-vi">${esc(t.name_vi)}</span>` : ""}
              ${tierHtml}
            </div>
            ${meaningHtml}
            ${effectsHtml}
          </div>
        </div>`;
      }).join("");
      traitGroups.push(`<div class="trait-group"><div class="trait-group-lbl">${esc(label)}</div><div class="trait-detail-list">${itemsHtml}</div></div>`);
    }

    const loreParts = [];
    if (c.role) loreParts.push(`<div class="lore-block"><h4>Role</h4><p>${esc(c.role)}</p></div>`);
    if (c.narrative.appearance) loreParts.push(`<div class="lore-block"><h4>Appearance</h4><p>${esc(c.narrative.appearance)}</p></div>`);
    if (c.narrative.wants) loreParts.push(`<div class="lore-block"><h4>Wants</h4><p>${esc(c.narrative.wants)}</p></div>`);
    if (c.narrative.bond) loreParts.push(`<div class="lore-block"><h4>Bond</h4><p>${esc(c.narrative.bond)}</p></div>`);
    if (c.narrative.backstory) loreParts.push(`<div class="lore-block"><h4>Backstory</h4><p>${esc(c.narrative.backstory)}</p></div>`);
    if (c.narrative.secret) {
      loreParts.push(`<div class="lore-block">
        <h4>Secret</h4>
        <button type="button" class="btn btn-xs" id="btnToggleSecret">${state.secretOpen ? "Hide Secret" : "Reveal Secret (Spoilers)"}</button>
        ${state.secretOpen ? `<div class="secret-box">${esc(c.narrative.secret)}</div>` : ""}
      </div>`);
    }

    return `
      <div class="section-card"><h3 class="section-title">Character Traits</h3>${traitGroups.length ? traitGroups.join("") : `<div style="color:var(--text-muted);font-size:12.5px">No traits recorded.</div>`}</div>
      <div class="section-card"><h3 class="section-title">Narrative &amp; Lore</h3>${loreParts.length ? loreParts.join("") : `<div style="color:var(--text-muted);font-size:12.5px">No lore recorded.</div>`}</div>
    `;
  }

  function renderDossierHistory(c) {
    const tiesHtml = c.ties.length
      ? `<ul class="list-clean">${c.ties.map(t =>
          `<li class="item-row">
            <button type="button" class="jump-link" data-jump="${esc(t.other_id)}">${esc(t.other_name)} &rarr;</button>
            <span><span class="badge tier-C">${esc(t.kind)}</span> <span style="font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted)">s=${t.strength}</span></span>
          </li>`
        ).join("")}</ul>`
      : `<div style="color:var(--text-muted);font-size:12.5px">No authored ties.</div>`;

    const langBar = `<div class="segmented" style="margin-bottom:8px">
      <button type="button" data-evlang="en" class="${state.eventLang === "en" ? "active" : ""}">EN</button>
      <button type="button" data-evlang="vi" class="${state.eventLang === "vi" ? "active" : ""}">VI</button>
      <button type="button" data-evlang="both" class="${state.eventLang === "both" ? "active" : ""}">Both</button>
    </div>`;

    const evHtml = c.events.length
      ? c.events.map(ev => {
          let body = "";
          if (state.eventLang === "en") body = `<div class="event-text">${esc(ev.text_en || ev.text_vi)}</div>`;
          else if (state.eventLang === "vi") body = `<div class="event-text">${esc(ev.text_vi || ev.text_en)}</div>`;
          else body = `<div class="event-text">${esc(ev.text_en)}</div>${ev.text_vi ? `<div class="event-text alt">${esc(ev.text_vi)}</div>` : ""}`;
          return `<div class="event-card">
            <div class="event-meta">
              <span class="event-year">Yr ${ev.year}</span>
              <span class="badge ${ev.tier === "landmark" ? "tier-A" : "tier-C"}">${esc(ev.tier || "event")}</span>
              <span>${esc(ev.kind)}</span>
              <span style="margin-left:auto;font-family:var(--font-mono)">${esc(ev.id)}</span>
            </div>
            ${body}
          </div>`;
        }).join("")
      : `<div style="color:var(--text-muted);font-size:12.5px">No chronicle or annals entries.</div>`;

    return `
      <div class="section-card"><h3 class="section-title">Ties (${c.ties.length})</h3>${tiesHtml}</div>
      <div class="section-card"><h3 class="section-title">Chronicle &amp; Annals (${c.events.length})</h3>${c.events.length ? langBar : ""}${evHtml}</div>
    `;
  }

  function copyText(txt, btn, doneLabel) {
    const orig = btn.textContent;
    const finish = () => {
      btn.textContent = doneLabel;
      setTimeout(() => { btn.textContent = orig; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(finish).catch(() => fallbackCopy(txt, finish));
    } else {
      fallbackCopy(txt, finish);
    }
  }

  function fallbackCopy(txt, cb) {
    const ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    document.body.removeChild(ta);
    cb();
  }

  initTheme();
  if (window.CHARACTERS_DATA) {
    boot(window.CHARACTERS_DATA);
  } else {
    fetch("./characters.json")
      .then(r => r.json())
      .then(boot)
      .catch(err => {
        document.getElementById("headerMeta").textContent = "Failed to load characters data.";
        document.getElementById("contentHost").innerHTML = `<div class="empty-state">Could not load characters.data.js or characters.json: ${esc(err.message)}</div>`;
      });
  }
})();
</script>
</body>
</html>
