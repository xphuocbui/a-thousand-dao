    expression: "delta_age_per_season = (1/seasons_per_year) * h * fit_growth; h = (1 + 0.008 * wood_purity) * max(0, 1 + hgp/100); hgp = 10 * ln(1 + sum_pos/10) + sum_neg (Character Stats Formula I); fit_growth = g_max * fit (Travel & Map Formula G)"
