    output_range: 0 to 0.04 x health_max per pulse window
    expression: "heal = base*(1+healing_pct/100)*(1+taken_pct/100), no decay and no cap (#44); heal art base = U*stage*c_heal*(health_units/16), refunding the linh luc paid when it heals"
    notes: "No healing on Down sides or with no_heal (every Tribulation wave). Healing never raises vitality. Formulas E."
