    expression: "B = floor(min(quest_reward_mult*I_r*S_plan, cap_mult*E_r)); stage_pay_i = floor(stage_reward_share*B*s_i/S_plan); final_pay = B - sum(stage_pay_i); cash <= floor(quest_cash_share*B)"
