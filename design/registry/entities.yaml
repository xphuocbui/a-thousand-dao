# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
#             economy-designer, systems-designer (new cross-system entries,
#               after asking)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /design-review (Phase 1 — cross-doc facts, in place of sibling GDDs)
#             /content-audit (Step 2 — planned named-content count)
#             /balance-check (Phase 3 — intended constant/formula values)
#             /propagate-design-change (Step 3 — downstream GDD impact via referenced_by)
#             /asset-spec (named entities to write specs for)
#             economy-designer, systems-designer (before authoring items,
#               loot tables and formulas)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="design/gdd/inventory.md" -B 8
#                            (referenced_by is a block list, so match the
#                            path; referenced_by.*inventory never matches)
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised
#
# LAYOUT: the one shape .claude/scripts/registry.sh reads. Each section is a
#   key at column 0 holding a block list, or [] while it is empty. Each entry
#   starts "- name: <name>" with the dash at column 2 (or 0, the same for every
#   entry of a section); its fields sit two columns past the dash, and a deeper
#   line belongs to the field above it. Quote a value that holds ": ". A line
#   in any other shape is reported as unsupported layout, with its number.

version: 1
last_updated: "2026-11-07"

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: root_birth_roll
    status: active
    source: design/gdd/linh-can.md
    referenced_by:
      - design/gdd/linh-can.md
      - design/gdd/character-stats.md
      - design/gdd/cong-phap.md
    variables:
      - count_weights
      - purity_mean
      - purity_sd
    output_range: [10, 100]
    expression: "count ~ weights; elements uniform; purity = clamp(round(N(50,20)), 10, 100); then innate rolls, then derived rolls, in catalogue order"
    notes: "Five-element root about 1 life in 67; 7.7% of births have an element at 85+."
    added: 2026-11-04
    revised: 2026-11-04
  - name: curve_factor
    # 2026-11-04 (Spiritual Roots redesign): was keyed by base element count.
    status: active
    source: design/gdd/linh-can.md
    referenced_by:
      - design/gdd/linh-can.md
      - design/gdd/canh-gioi.md
    variables:
      - n_eff
      - stage_group
    output_range: [0.3, 9.0]
    expression: "element_count_curve[n_eff][stage group]"
    notes: "Keyed by n_eff (effective_element_count): innate variants count, derived variants do not. Parity: 2-3 at FE mid, 4 at FE late, 5 at CF early."
    added: 2026-11-04
    revised: 2026-11-04
  - name: mutation_chance
    # 2026-11-04 (Spiritual Roots redesign): the 29-mutation orders are gone; replaced by variant_chance.
    status: deprecated
    source: design/gdd/linh-can.md
    referenced_by:
      - design/gdd/linh-can.md
      - design/gdd/kinh-mach-do.md
    variables:
      - order
      - parent_purities
    output_range: [0, 0.5]
    expression: "f_order * prod(purity_p/100); f_1 = 0.5, f_o = 0.25/(o-1); purity = round(0.8 * geomean(current parent purities)), recomputed when a parent changes"
    notes: "Each mutation rolls once, at first eligibility, plus one extra roll per realm breakthrough while Mutation Awakening (Meridian Map #24) is held (at most 2 such rolls per life: capabilities sit behind the Core Formation gate); 13.5% of births have one."
    added: 2026-11-04
    revised: 2026-11-04
  - name: generating_pair_bonus
    status: active
    source: design/gdd/linh-can.md
    referenced_by:
      - design/gdd/linh-can.md
      - design/gdd/character-stats.md
    variables:
      - pair_bonus_pct
      - owned_pairs
    output_range: [0, 15]
    expression: "pair_bonus_pct * number of generating pairs owned (cultivation_speed_pct)"
    notes: "One stat sheet modifier per pair, source "Tương sinh: X → Y"."
    added: 2026-11-04
    revised: ""
  - name: effective_talent
    status: active
    source: design/gdd/character-stats.md
    referenced_by:
      - design/gdd/character-stats.md
      - design/gdd/canh-gioi.md
    variables:
      - base
      - flat_modifiers
    output_range: [1, 150]
    expression: "clamp(base + sum of flat modifiers on the talent key, 1, 150)"
    notes: "Every rule reads the effective value; the grade comes from the base."
    added: 2026-11-04
    revised: ""
  - name: derived_values
    status: active
    source: design/gdd/character-stats.md
    referenced_by:
      - design/gdd/character-stats.md
      - design/gdd/canh-gioi.md
      - design/gdd/combat.md
    variables:
      - talent
      - per_point
      - realm_mult
      - stage_mult
      - pct
    output_range: [0, unbounded]
    expression: "divine_sense = eff(than_hon)*1.0*than_thuc_mult*stage_mult*(1+pct); vitality_max = eff(can_cot)*10*khi_huyet_mult*stage_mult*(1+pct); spiritual_power = linh_luc_base*stage_mult*tech_power*(1+pct) [+0.20*vitality_max with #4]; combat_realm_term = power_base*stage_mult"
    notes: "Realm bases unchanged (Realms OQ7); smallest great-breakthrough jump x2.07. Unbounded above: tech_power (up to 3.355, Cultivation Techniques Formulas C) and pct bonuses scale it."
    # was: tech_power (up to about 2.0); changed by design/gdd/cong-phap.md
    added: 2026-11-04
    revised: 2026-11-04
  - name: qi_deviation_chance
    status: active
    source: design/gdd/character-stats.md
    referenced_by:
      - design/gdd/character-stats.md
      - design/gdd/canh-gioi.md
      - design/gdd/kinh-mach-do.md
    variables:
      - heart_demon
      - dao_tam
      - qi_deviation_pct
    output_range: [0, 100]
    expression: "clamp(max(0, hd - eff(dao_tam)/2) * max(0, 1 + qi_deviation_pct/100), 0, 100) %"
    notes: "Heart demon gain lands before the roll; death needs a deviation and hd >= 90."
    added: 2026-11-04
    revised: ""
  - name: presence_price
    status: active
    source: design/gdd/character-stats.md
    referenced_by:
      - design/gdd/character-stats.md
    variables:
      - mi_luc
      - value
    output_range: [1, inf]
    expression: "charm = (eff(mi_luc)-50)*0.004; buy = ceil(value*1.5*(1-charm)); sell = max(1, floor(value*0.6*(1+charm)))"
    notes: "Market consumer; buy rounds up and sell rounds down so loops never profit."
    added: 2026-11-04
    revised: ""
  - name: level_cost
    status: active
    source: design/gdd/canh-gioi.md
    referenced_by:
      - design/gdd/canh-gioi.md
    variables:
      - T_c
      - g
      - lo
      - hi
    output_range: [39.5, 334605]
    expression: "cost(L) = c0*r^(L-lo); r = g^(1/(M-1)); c0 = T_c*(r-1)/(r^M-1)"
    notes: "Tu vi per level on the 110-level ladder; realm climbing costs sum to climb_total. Bars are their own data, bottleneck_bar."
    added: 2026-11-03
    revised: 2026-11-05
  - name: stage_multiplier
    status: active
    source: design/gdd/canh-gioi.md
    referenced_by:
      - design/gdd/canh-gioi.md
    variables:
      - stage_power_step
      - s
    output_range: [1.0, 1.45]
    expression: "1 + stage_power_step * s, s = small breakthroughs reached in the realm"
    notes: "Multiplies spiritual power, divine sense, vitality and the combat power realm term; resets to 1.0 on the next realm."
    added: 2026-11-03
    revised: ""
  - name: realm_step_success
    status: active
    source: design/gdd/canh-gioi.md
    referenced_by:
      - design/gdd/canh-gioi.md
      - design/quick-specs/progression-and-edges.md
    variables:
      - P_C
      - B
      - p_brew
      - G
      - q_pill
      - S_bare
    output_range: [0, 1]
    expression: "S = P_C * (1 - F) + S_bare; F = sum over x of C(B,x) p_brew^x (1-p_brew)^(B-x) prod_{j<G+x}(1 - q_j); q_j = min(q_max, q + f*min(j*iota_pp, iota_cap) + f*tau*[j = 0 and the step's talisman is used]); B = brews whose herbs fit the plots and whose attempt can start before the lifespan cap (Realms Formulas D); W = lifespan cap at entry - age at entry; n_plots = clamp(3 + floor(0.04*purity_earth) + field_plots, 1, 12); h = (1 + 0.008*purity_wood) * max(0, 1 + herb_growth_pct/100); p_brew = clamp(p_brew0 + 0.0025*purity_fire + alchemy_success/100, 0.05, 0.95)"
    notes: "Before gate_factor. Live targets: player edge 0.70/0.70/0.30/0.20; baseline 0.30 at the first two gates. Targets 0.30 baseline and 0.70 with the player edge are means over the birth mix (45/32/15/6.5/1.5 % elements), user decision 2026-11-04. Since cross-GDD reviews 04f/04g: discrete brews, W from an entry-age model, plots at best play with no extra field_plots, attempts in order with rising q from failure insight (+2 pp per failed pill attempt in the step, cap 4), q extras under a 10 pp ceiling, one talisman per realm step at 5 pp on a held pill. Means 0.299 / 0.302 / 0.298 / 0.301 from a fixed-seed scratch model, not a bot run. Fine lever pill_chance; coarse lever the recipe."
    added: 2026-11-03
    revised: 2026-11-05
    # was: h = (1 + 0.008*purity_wood) * (1 + herb_age_root_pct/100) * max(0, 1 + herb_growth_pct/100), herb_age_root_pct 25 for a Time mutation holder else 0 (root term, not capped); before 2026-11-05. Time moved to the Way (Spiritual Roots redesign); Realms Formulas D dropped the factor.
  - name: dao_node_value
    status: active
    source: design/gdd/dao.md
    referenced_by:
      - design/gdd/dao.md
    variables:
      - dao_node_cost
      - dao_premium
      - w_target
      - grade_small
      - grade_notable
    # 2026-11-10: lint rewritten for graph Ways (110-170 nodes, cost 1; per stat-node band; slot table; capstone depth). Was: 19-22 nodes, branch and keystone-route means.
    output_range: [1.92, 19.2]
    expression: "W_small = dao_premium * dao_node_cost * grade_small (2.4 W), W_notable = dao_premium * dao_node_cost * grade_notable (16 W); lint: 110-170 nodes, connected, no crossings, capstones >= dao_capstone_depth points; each small/road node and stat notable within dao_node_tol (20 %) of its budget; W per point >= 0.9 * premium * w_target; slot table per facet (<=1 major, <=2 minor Effects on notables); 2-6 capstones; cultivation_speed_pct <= dao_rate_cap_pct per Dao (the key-headroom check was dropped 2026-11-10, review D-01)"
    notes: "Every node costs a flat 1 point (the start is free); w_target is the Meridian Map's 2.07 W per point. Stat nodes carry the x2 premium node by node; Effects and capstones are unpriced (the Sword pilot measures 3.38 W per point over all points, 1.63x the map). output_range spans the small and notable bands at the defaults (cost 1, premium 2)."
    added: 2026-11-05
    revised: 2026-11-06
  - name: dao_offer
    status: active
    source: design/gdd/dao.md
    referenced_by:
      - design/gdd/dao.md
    variables:
      - E
      - dao_offer_size
    output_range: [1, 3]
    expression: "offer = first min(dao_offer_size, |E|) of a uniform Fisher-Yates shuffle of E; E = qualified, not yet glimpsed Daos"
    notes: "One draw per entry offered; reproducible from the seed. Output range is [1, dao_offer_size] (1-3 at the default)."
    added: 2026-11-05
    revised: 2026-11-06
  - name: npc_dao
    status: active
    source: design/gdd/dao.md
    referenced_by:
      - design/gdd/dao.md
    variables:
      - points_total
      - npc_dao_share
      - dao_premium
      - dao_full_points
    output_range: [1.0, 1.667]
    expression: "P_npc = min(dao_full_points, floor(npc_dao_share * points_total(level))); map_points = points_total - P_npc; power_mult = (map_points + dao_premium * P_npc) / map_points"
    notes: "An NPC's simplified Dao effect on combat power; rolls once per realm from Core Formation until the first success (one Dao per NPC). P_npc is deducted from the Meridian Map allocation, and those points earn the player's dao_premium (user decision 2026-11-06), about 11-25 % over a Dao-less NPC of the level; assumes map power near linear in points, a bot run must confirm."
    added: 2026-11-05
    revised: 2026-11-06
    # was: power_mult = points_total / map_points, output_range [1.0, 1.334] (before user decision 2026-11-06)
    # earlier: power_mult = 1 + npc_dao_power_max * P_npc / C_dao, output_range [1.0, 1.12]; no point deduction (design-review 2026-11-05)
  - name: guard_success
    status: active
    source: design/gdd/canh-gioi.md
    referenced_by:
      - design/gdd/canh-gioi.md
      - design/gdd/kinh-mach-do.md
    variables:
      - q_i
      - s_max
    output_range: [0, 0.95]
    expression: "S_guard = min(1 - prod(1 - q_i) over pill attempts made plus held pills with the condition met, s_max)"
    notes: "Lower bound on realm-step success; used as S by the Meridian Map breakthrough guard (E2)."
    added: 2026-11-03
    revised: ""
  - name: points_total
    status: active
    source: design/gdd/kinh-mach-do.md
    referenced_by:
      - design/gdd/kinh-mach-do.md
      - design/gdd/canh-gioi.md
      - design/gdd/dao.md
    variables:
      - L
      - pts_birth
      - realm_level_bands
      - great_breakthrough_bonus
      - small_breakthrough_bonus
      - pts_event
    output_range: [2, 566]
    expression: "pts_birth + (L - 1) + sum of realm bonuses reached + pts_event"
    notes: "Kinh Mạch points earned by highest level L; Cảnh Giới owns the ladder (provisional). Whole numbers from data, no rounding. 51/120/216/357/566 at each đại viên mãn; these totals are what acupoint values are built on."
    added: 2026-11-03
    revised: 2026-11-05
  - name: breakthrough_guard
    status: active
    source: design/gdd/kinh-mach-do.md
    referenced_by:
      - design/gdd/kinh-mach-do.md
      - design/quick-specs/progression-and-edges.md
      - design/gdd/canh-gioi.md
    variables:
      - S
      - q
      - q_max
      - delta_desp
      - delta_max
      - tau_a
      - burn_cost
    output_range: [0, 0.10]
    expression: "tau_a = the breakthrough talisman on this attempt (0 or f*tau, tau 0.05, f the gate_factor, Realms rule 8); q = the attempt chance without tau_a; q_desp = min(2q, q + delta_desp, q_max - tau_a, q + delta_max*(1 - q - tau_a)/(1 - S)); #22 attempt chance = q_desp + tau_a; S22 = 1 - (1 - S)*(1 - q_desp - tau_a)/(1 - q - tau_a); q_retry = min(q, (delta_max - iota_23)/(1 - S)), iota_23 = the failure insight the extra roll would add if it failed (f*0.02, or 0 at the cap); q includes insight and excludes tau_a (#23 never carries a talisman); S23 = S + q_retry*(1 - S) + iota_23*(1 - q_retry)*F_0; lift = max(S22, S23) - S <= delta_max"
    notes: "Caps the realm success lift from capabilities 22 and 23; at most one acts per realm step. Must agree with the progression targets (0.30 baseline, 0.70 with the player edge)."
    added: 2026-11-03
    revised: 2026-11-05
  - name: npc_unseal_chance
    # 2026-11-10 (Meridian Map major revision): hidden clusters scrapped (rules 6-15 retired).
    status: deprecated
    source: design/gdd/kinh-mach-do.md
    referenced_by:
      - design/gdd/kinh-mach-do.md
      - design/quick-specs/progression-and-edges.md
    variables:
      - a_max
      - base_step
      - max_step
      - edge
      - M_r
    output_range: [0, 0.02]
    expression: "a = a_max[r] * (base_step + min(e,1)*(max_step-base_step)) / max_step; p = 1 - (1-a)^(1/M_r)"
    notes: "Per eligible sealed cluster, rolled at NPC generation. Shares the NPC edge curve (0.30/0.70) with Progression Edges."
    added: 2026-11-03
    revised: 2026-11-10
  - name: cluster_fill_budget
    # 2026-11-10 (Meridian Map major revision): the LLM fill and the fill budget are retired with the hidden clusters.
    status: deprecated
    source: design/gdd/kinh-mach-do.md
    referenced_by:
      - design/gdd/kinh-mach-do.md
    variables:
      - P
      - n
      - k
      - c
      - S0
      - N0
      - f_tier
      - stat_power_weights
    output_range: [10.9, 49.0]
    expression: "B = P * ((n-k)*S0 + (k-c)*N0 + c*f_tier*N0)"
    notes: "Budget in W for an LLM-filled or authored cluster; the LLM Game Master fill validator enforces it. Unshrunk. A cluster shrunk by region capacity uses P_shrunk = P(d, n)*n_rolled/n."
    added: 2026-11-03
    revised: 2026-11-10
  - name: technique_speed_factor
    status: active
    source: design/gdd/cong-phap.md
    referenced_by:
      - design/gdd/cong-phap.md
      - design/gdd/canh-gioi.md
      - design/gdd/linh-can.md
    variables:
      - tech_norm
      - count_gain
      - speed_mult
      - par_tier
      - match
      - layer_speed_penalty
      - layer_speed_floor
      - beyond_realm_mult
      - second_main_mult
      - no_cong_phap_mult
    output_range: [0.03, 4.35]
    # 2026-11-04 (cross-GDD review N6, N10): was "tech_one = tech_norm * ...; tech = tech_one(main) + 0.5*tech_one(second, #6 only)" with no count_gain and no crude floor.
    expression: "tech_one = (tech_norm / count_gain[n_base, QR 5-element 1.27]) * (S[tier]/S[par(r)] if r <= max_realm else 1) * avg_purity(names)/100 * max(floor, 1 - penalty*max(0, min(3r, layers) - k)) * (0.25 if r > max_realm else 1); tech = max(tech_one(main), crude) + 0.5*tech_one(second, #6 only); crude = 0.3 * strongest_purity/100 (also the whole value with no usable main method)"
    notes: "The tech term of Realms Formulas I. A par-tier technique naming the root's strongest element, at average match for its element count and every allowed layer mastered, gives 1.0 in every realm; count_gain divides out the strongest-element gain (user decision 2026-11-04)."
    added: 2026-11-04
    revised: 2026-11-04
  - name: talent_gain
    status: active
    source: design/gdd/character-stats.md
    referenced_by:
      - design/gdd/character-stats.md
    variables:
      - value
      - pill_potency
    output_range: [1, 100]
    expression: "max(1, round(value * pill_potency)); base clamped to 100"
    notes: "Matches purity pills, so a weak pill still gives +1."
    added: 2026-11-05
    revised: ""
  - name: tech_power
    status: active
    source: design/gdd/cong-phap.md
    referenced_by:
      - design/gdd/cong-phap.md
      - design/gdd/character-stats.md
      - design/gdd/combat.md
    variables:
      - power_mult
      - power_layer_floor
      - k
      - layers
      - no_tech_power
      - comp_strength
    output_range: [0.5, 3.355]
    expression: "max(no_tech_power, power_mult[tier] * (0.6 + 0.4*(k-1)/(layers-1)) * comp_strength) for the main method; no_tech_power 0.5 with no usable main method"
    # was: output_range [0.5, 2.2], no comp_strength; changed by user decision 2026-11-06
    notes: "Multiplies Character Stats spiritual power. Reaches Combat only through spiritual power, which sizes the qi pool (design/gdd/combat.md Formulas A); no_tech_power applies to spiritual power only. power_mult 1.0/1.3/1.7/2.2 is separate from speed_mult."
