    value: {herb_growth_pct: 10, alchemy_success: 3, lifespan_frac: 0.15}
    unit: pct / percentage points / share of the realm's base lifespan
    notes: "Character-wide ceilings over every Character Stats rule 12 source (techniques, tree, items and consumables, pills, destiny perks, root variants and generating pairs, formations, craft mastery). Penalties apply after the cap: total = min(sum of positive modifiers, ceiling) + sum of negative modifiers. The lifespan bonus is lifespan pill years plus every lifespan_years modifier (an equipped treasure's counted once), capped the same way; a negative bonus is allowed and can lower the cap below the base. Root terms, field_plots and lifespan_pct are not capped. Lowered 2026-11-04 (cross-GDD review 04f; were 40 / 8); safe range at most the current values until AC-CG-60 confirms headroom. The computed ceiling run belongs to Realms bonus_ceiling_target and AC-CG-60. Holder raises were removed with the Spiritual Roots redesign (2026-11-04)."
