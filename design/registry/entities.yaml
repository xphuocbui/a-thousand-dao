# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: root_count_weights
    status: active
    source: design/gdd/linh-can.md
    referenced_by:
      - design/gdd/linh-can.md
      - design/gdd/kinh-mach-do.md
    value: [45, 32, 15, 6.5, 1.5]
    unit: percent
    notes: "For 1-5 base elements (user decision; was 45/30/15/7/3)."
    added: 2026-11-04
    revised: ""
  - name: root_purity_distribution
    status: active
    source: design/gdd/linh-can.md
    referenced_by:
      - design/gdd/linh-can.md
      - design/gdd/character-stats.md
      - design/gdd/kinh-mach-do.md
    value: "N(50, 20) clamped 10-100, rounded"
    unit: purity
