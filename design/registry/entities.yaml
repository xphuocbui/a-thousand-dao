# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

  - name: defence_resistance
    status: active
    source: design/gdd/combat-defence.md
    referenced_by:
      - design/gdd/combat-defence.md
      - design/gdd/combat-damage-types.md
    variables:
      - R_all
      - R_type
      - pen_part
      - resist_floor
      - cap_part
      - resist_cap
      - resist_cap_max
      - cap_raise
      - ws
    output_range: [-0.5, 0.9]
    expression: "R_j = R_all + R_type(j) - pen_j (points, no cap or floor); a_j = D_j*100/(100+R_j) if R_j >= 0, else D_j*(1 - R_j/100); R_x = R_x,other + sum_w R_w,x*(1 + ws/100) (2026-11-10)"
    notes: "All resistance plus the part's final damage type (combat-damage-types.md). Elements never enter resistance. Was general + kind + element (2026-11-07, same day); variables list updated 2026-11-08."
    added: 2026-11-07
    revised: 2026-11-08
  - name: defence_shield
    status: active
    source: design/gdd/combat-defence.md
    referenced_by:
      - design/gdd/combat-defence.md
      - design/gdd/combat-damage-types.md
    variables:
      - sigma
      - qi_max
      - ws
      - we
      - shield_recharge
      - recharge_delay
      - health_max
      - sigma_b
    output_range: "uncapped: each ward shield <= 0.50 x qi_max x (1 + ws/100); body shield = health_max x sum sigma_b"
    expression: "ward: S_w = sigma*qi_max*(1+ws/100), recharge after recharge_delay; body: S_body = health_max*sum sigma_b, never self-refills; sigma_b_gear = body_gear_shield*a_b; optional caps off by default (shield_total_cap, body_shield_cap), clipping maximum sizes at compile, later slots first"
    notes: "Ward shields and body shields are one shield concept; body armour is a shield. What passes a shield is data (ward: Soul + ticks; body: Soul + Chaos). Restoring a body shield counts as healing. Shields uncapped by user decision 2026-11-08; AC-CD-59 checks for stalls."
    added: 2026-11-07
    revised: 2026-11-08
  - name: ward_payment
    status: active
    source: design/gdd/combat-defence.md
    referenced_by:
      - design/gdd/combat-defence.md
    variables:
      - we
      - rho
      - res_eff
      - u
      - upkeep_growth
      - phi
      - drain_base
      - ws
      - R_pos
      - kappa
      - qi_max
    output_range: >= 0; reserved <= 0.9 x qi_max
    expression: "reserved = rho*(1 - min(res_eff,50)/100)/(1 + we/200); fee = phi*qi_max/(1+we/100); drain rate_w = drain_base/((1+ws/100)(1+we/100)); cast = kappa*qi_max/(1+we/100) (upkeep wards removed, #44)"
    notes: "Five payment models. Total payment never rises with ws (flat drain bill). Formulas C. Drain billing completed by user decision 2026-11-08."
    added: 2026-11-07
    revised: 2026-11-08
  - name: ward_slots
    status: active
    source: design/gdd/combat-defence.md
    referenced_by:
      - design/gdd/combat-defence.md
    variables:
      - ward_slots_by_realm
      - divine_sense
      - ward_slot_sense_step
      - ds_ref
      - bonus_ward_slots
    output_range: 1 to 5 plus bonuses
    expression: "ward_slots = ward_slots_by_realm[r] + min(2, floor(divine_sense/(ward_slot_sense_step*ds_ref[r]))) + sum bonus_ward_slots"
    notes: "Free slots for wards only. Formulas D."
    added: 2026-11-07
    revised: ""
  - name: combat_healing
    status: active
    source: design/gdd/combat-defence.md
    referenced_by:
      - design/gdd/combat-defence.md
    variables:
      - healing_pct
      - taken_pct
      - heal_decay_floor
      - heal_decay_end
      - c_heal
      - heal_pulse_cap
      - heal_lint_ratio
      - hregen_cap
    output_range: 0 to 0.04 x health_max per pulse window
    expression: "heal = base*(1+healing_pct/100)*(1+taken_pct/100), no decay and no cap (#44); heal art base = U*stage*c_heal*(health_units/16), refunding the linh luc paid when it heals"
    notes: "No healing on Down sides or with no_heal (every Tribulation wave). Healing never raises vitality. Formulas E."
    added: 2026-11-07
    revised: ""
  - name: ward_price_check
    status: active
    source: design/gdd/combat-defence.md
    referenced_by:
      - design/gdd/combat-defence.md
    variables:
      - V_w
      - C_w
      - epsilon_0
      - beta_w
      - alpha_m
      - reserve_weight
      - I
      - T_ref
    output_range: pass/fail
    expression: "V_w <= epsilon_0*beta_w*alpha_m*C_w at ws = we = 0 over the standard stream (one hit of I per second) for T_ref 45 s; resistance value s*I*T with s = R/(100+R) (#44, 2026-11-10)"
    notes: "The ward counterpart of the art lint. Formulas F."
    added: 2026-11-07
    revised: 2026-11-08
  - name: defence_ehp
    status: active
    source: design/gdd/combat-defence.md
    referenced_by:
      - design/gdd/combat-defence.md
      - design/gdd/combat-damage-types.md
    variables:
      - Q_use
      - b
      - r_all
      - r_fix
      - f
      - H
      - S_std
    output_range: "P/1.5 (resistance at the floor, no block) to 50 x P"
    expression: "x = Q_use/b (wards never fall when b = 0, then ehp = P/lambda_all); lambda_s = max(lambda_min, 1 - r_s - B_s/D_ref); P = H + S_std + S_body (minus shields the type passes); ehp = P/lambda_all if x*lambda_all >= P else x + (P - x*lambda_all)/lambda_fix"
    notes: "Replaces Combat Formulas A ehp once the Combat revision (#43) lands. Typical QR 297.8 (was 298.1 with body guard); thể tu 570.4 Physical / 368.5 Force / 221.3 Chaos. Range and b = 0 case fixed 2026-11-08 (re-review CD 7, CD 13)."
    added: 2026-11-07
    revised: 2026-11-07
  - name: defence_block
    status: active
    source: design/gdd/combat-defence.md
    referenced_by:
      - design/gdd/combat-defence.md
      - design/gdd/combat-damage-types.md
    variables:
      - block_unit
      - stage
      - flesh_block
      - n_body
      - gear_block
      - a_w
      - a_b
      - b_src
      - b_w
      - ws
    output_range: 0 to the hit's after-resistance total
    expression: "B_hit = block_unit[r]*stage*(flesh_block*n_body + gear_block*(min(a_w,1) + a_b) + sum b_src + sum_w b_w*(1+ws/100)); k_j = a_j*min(1, B_hit/sum a_i)"
    notes: "Flat block, once per hit, split by after-resistance size, never on ticks or Soul. A hit loses exactly min(B_hit, sum a_j)."
    added: 2026-11-07
    revised: ""
  - name: damage_parts
    status: active
    source: design/gdd/combat-damage-types.md
    referenced_by:
      - design/gdd/combat-damage-types.md
      - design/gdd/combat-defence.md
      - design/gdd/modifiers.md
      - design/gdd/effects.md
    variables:
      - s_j
      - type_j
      - c_k
      - hist_j
      - M
    output_range: shares sum to 1; at most 3 x authored parts
    expression: "a step is one source tier (art, Effects, modifiers); every c_k from one type in one step reads s_j at the step's start, scaled down if over 1; conversion X->Y share c_k spawns s_j*c_k of type Y with hist + {X}; at the step's end s_j <- s_j*(1 - sum c_k over that step's conversions that apply to j); a part at share 0 is removed; part_j = base*s_j*M(tags + hist_j + type_j)*crit; resistance and block read type_j only"
    notes: "At most 2 conversions per hit (one that moves nothing is not counted), fixed order (art, then Effects, then modifiers); never to or from Soul; never back to a type in hist; never changes a status tick's type. A hit is all Soul or has no Soul part (user decision 2026-11-08). Inside a step: compile order (slotted hosts, then unslotted, record id, listing order), the limit of 2 before scaling. Never to its own type. Modifier tier = convert_pct, one conversion per from -> to key, keys in type order (user decisions 2026-11-08 and 2026-11-08b DT-01, DT-02). A conversion that moves nothing is judged at the step's start and skipped. Conversions kept in earlier steps count toward the 2 (user decision 2026-11-08b, DT-03)."
    added: 2026-11-07
    revised: 2026-11-08
  - name: modifier_value
    status: active
    source: design/gdd/modifiers.md
    referenced_by:
      - design/gdd/modifiers.md
      - design/gdd/combat-defence.md
    variables:
      - B
      - breadth_mult
      - price
      - u
      - d
    output_range: "0 to about 215 units in the tree (25.8 W on a 0.3 W stat at x2.5); up to 500 at the 60 W top of B"
    expression: "value = d*floor(B*breadth_mult/(price*u) + 1e-6)*u"
    notes: "Turns a source's W budget into a plain modifier. Zero units means the stat cannot be carried; never raised to one unit. Effect payloads are exempt (Modifier System rule 12). Formulas C."
    added: 2026-11-07
    revised: 2026-11-08
  - name: breadth_mult
    status: active
    source: design/gdd/modifiers.md
    referenced_by:
      - design/gdd/modifiers.md
      - design/gdd/combat-defence.md
    variables:
      - S
      - I
      - tier
      - m
    output_range: [1.0, 2.5]
    expression: "m[tier(S + I)]; tier(empty) = universal; two tags: min(pinpoint, tier(narrower) + [tier(other) >= family])"
    notes: "Five tiers: universal, broad (physical, force, hit, art), family (other damage types, elements, forms), narrow, pinpoint. Formulas B."
    added: 2026-11-07
    revised: ""
  - name: more_price
    status: active
    source: design/gdd/modifiers.md
    referenced_by:
      - design/gdd/modifiers.md
      - design/gdd/combat-defence.md
    variables:
      - i
      - r
      - L1_typ
      - sigma
      - L_i_typ
    output_range: 0.90 to 5.78 W per point
    expression: "more_price(i, r) = L1_typ(r)/(sigma(r)*L_i_typ(r)); sigma = 1 below the L1 knee, 0.5 past it; no trade at or above cap_i"
    notes: "Exchange rate for more points (L2, L4) when W must buy them (LLM GM, quests, NPC builds). Sources otherwise budget more in points. Answers Combat Open Question 5. Formulas D."
    added: 2026-11-07
    revised: ""
  - name: counted_chance
    status: active
    source: design/gdd/effects.md
    referenced_by:
      - design/gdd/effects.md
    variables:
      - p
      - meter
      - counted_start
    output_range: floor(counted_start/1000 + sum p) events over n opportunities
    expression: "meter += p at each would-be roll; if meter >= 1: event, meter -= 1; held as per-mille integers"
    notes: "Keystone-only (Effects rule 12). No seeded draw; fortune does not shift it. p rounds to the nearest thousandth, half up. Formulas A. Range fixed 2026-11-08 (re-review EF 17)."
    added: 2026-11-08
    revised: 2026-11-08
  - name: standing_status
    status: active
    source: design/gdd/effects.md
    referenced_by:
      - design/gdd/effects.md
    variables:
      - standing_cost
      - qi_max_caster
    output_range: lasts while the caster pays
    expression: "upkeep = standing_cost*qi_max_caster per pulse, paid before the status ticks; unpaid or caster Down: ends without ticking"
    notes: "A status with no duration needs a standing cost and a cleanse (Effects rule 9; overnight decision 11). Formulas B."
    added: 2026-11-08
    revised: ""
  - name: down_step
    status: active
    source: design/gdd/effects.md
    referenced_by:
      - design/gdd/effects.md
      - design/gdd/combat.md
      - design/gdd/combat-defence.md
    variables:
      - refusal
      - last_act
      - follow_up_check
    output_range: always ends
    expression: "(1) first unspent refusal in slot order sets health 1, Spent; (2) else last acts once; (3) follow-up check, no second refusal for the side that acted; (4) wounds reported"
    notes: "Each refusal once per fight, at most one per Down (Effects rule 11; overnight decision 5). Formulas C."
    added: 2026-11-08
    revised: ""
  - name: land_match
    status: active
    source: design/gdd/travel-map.md
    referenced_by:
      - design/gdd/travel-map.md
      - design/gdd/canh-gioi.md
      - design/gdd/linh-can.md
    variables:
      - p_e
      - u_e
      - s_e
      - mu_e
      - match_gain
    output_range: [0.8, 1.3]
    expression: "M4 = clamp(1 + k * sum_e q_e * (s_e/100 - mu_e), 0.8, 1.3); q_e = u_e * p_e / 100; u_e 1 owned, 0.5 rare-source only; mu_e = world mean share over places"
    notes: "Element match of a root to the land (Travel & Map Formulas A); averages x1.0 over the world for every root; multiplies the cultivation rate."
    added: 2026-11-10
    revised: ""
  - name: stacked_density
    status: active
    source: design/gdd/travel-map.md
    referenced_by:
      - design/gdd/travel-map.md
      - design/gdd/canh-gioi.md
    variables:
      - D4
      - layer_density_adds
      - density_bonus
    output_range: [0.3, 3.0]
    expression: "D = min(density_cap, D4 + min(c3, dD3) + min(c2p, dD2p) + min(c2u, dD2u) + min(c1p, dD1p) + min(c1u, dD1u) + density_bonus); caps 1.0 / 0.1 / 0.5 / 0.1 / 0.75 (+0.30 with capability 15); settled homes capped at 1.8"
    notes: "Travel & Map Formulas B. What the cultivation rate and the Core Formation check read."
    added: 2026-11-10
    revised: ""
  - name: stacked_match
    status: active
    source: design/gdd/travel-map.md
    referenced_by:
      - design/gdd/travel-map.md
      - design/gdd/canh-gioi.md
    variables:
      - M4
      - layer_share_pushes
    output_range: [0.8, 1.6]
    expression: "M = clamp(M4 + sum_{i in 3,2,1} min(m_i, k * sum_t q_t * min(cs_i, ds_i_t) / 100), 0.8, 1.6); m_i 0.3 / 0.15 / 0.15; settled homes capped at 1.3"
    notes: "Travel & Map Formulas B."
    added: 2026-11-10
    revised: ""
  - name: trip_time
    status: active
    source: design/gdd/travel-map.md
    referenced_by:
      - design/gdd/travel-map.md
      - design/gdd/quests.md
    variables:
      - c_t
      - v_mode
      - travel_speed_pct
    output_range: [0, unbounded]
    expression: "T = sum_tiles c_t / (v_mode * max(0.25, 1 + tsp/100)); a mixed tile's wilderness c_t = share-weighted mean of its land parts' costs; speeds road 54, wilderness 18, river 80/45, sea 90, flight FE 135 CF 200 NS 290 DT 400 tiles (25 km) a season"
    notes: "Travel & Map Formulas D; in seasons; the leftover share of the last season cultivates at the destination. Rescaled 2026-11-13 from 111 km to 25 km tiles (speeds x 4.5)."
    added: 2026-11-10
    revised: 2026-11-13
  - name: herb_fit
    status: active
