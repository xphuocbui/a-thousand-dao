# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: level_cap
    status: active
    source: design/gdd/kinh-mach-do.md
    referenced_by:
      - design/gdd/kinh-mach-do.md
    value: 300
    unit: level
    notes: "Highest cultivation level; 1 Kinh Mạch point per level gained."
    added: 2026-11-03
    revised: ""
  - name: realm_level_bands
    status: active
    source: design/gdd/kinh-mach-do.md
    referenced_by:
      - design/gdd/kinh-mach-do.md
    value: "Luyện Khí 1-39, Trúc Cơ 40-79, Kết Đan 80-129, Nguyên Anh 130-199, Hóa Thần 200-300"
    unit: levels
    notes: "Provisional; Cảnh Giới & Bình Cảnh owns them. The bình cảnh holds the level at each band top until the breakthrough."
    added: 2026-11-03
    revised: ""
  - name: great_breakthrough_bonus
    status: active
    source: design/gdd/kinh-mach-do.md
