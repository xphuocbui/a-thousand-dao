    output_range: ["2,000 (Holdings L1)", "no maximum"]
    expression: "cost = c0_T * g^(L-1); C = c0_T * (g^L - 1)/(g - 1); upkeep = u * C; L_eff = log_g(1 + (g-1)(C_own + w_v * sum C_vassal)/c0_T)"
    notes: "Sects F1. Guesses: c0 Holdings 2,000 / Institutions 2,500 / Military 2,000 / Trade 1,500; g 1.4; u 0.01. Layer-2 works keep Travel & Map Formula J prices, gated by work_max = ceil(H/2)."
