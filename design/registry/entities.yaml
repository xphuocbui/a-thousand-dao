    notes: "Realms rule 14 owns it; Character Stats supplies the curved bonus (its rule 14, Formulas I). A slot, equipment or main-method change that would put the cap at or below the age needs confirmation. Every lifespan_years modifier counts through the curve (W10, 2026-11-04; curve 2026-11-10)."
