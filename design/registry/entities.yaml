    variables:
      - V_w
      - C_w
      - epsilon_0
      - beta_w
      - alpha_m
      - reserve_weight
      - I
      - T_ref
    output_range: pass/fail
    expression: "V_w <= epsilon_0*beta_w*alpha_m*C_w at ws = we = 0 over the standard stream (one hit of I per second) for T_ref 45 s; resistance value s*I*T with s = R/(100+R) (#44, 2026-11-10)"
    notes: "The ward counterpart of the art lint. Formulas F."
    added: 2026-11-07
    revised: 2026-11-08
  - name: defence_ehp
    status: active
    source: design/gdd/combat-defence.md
    referenced_by:
      - design/gdd/combat-defence.md
      - design/gdd/combat-damage-types.md
    variables:
      - Q_use
      - b
      - r_all
      - r_fix
      - f
      - H
      - S_std
    output_range: "P/1.5 (resistance at the floor, no block) to 50 x P"
    expression: "x = Q_use/b (wards never fall when b = 0, then ehp = P/lambda_all); lambda_s = max(lambda_min, 1 - r_s - B_s/D_ref); P = H + S_std + S_body (minus shields the type passes); ehp = P/lambda_all if x*lambda_all >= P else x + (P - x*lambda_all)/lambda_fix"
    notes: "Replaces Combat Formulas A ehp once the Combat revision (#43) lands. Typical QR 297.8 (was 298.1 with body guard); thể tu 570.4 Physical / 368.5 Force / 221.3 Chaos. Range and b = 0 case fixed 2026-11-08 (re-review CD 7, CD 13)."
    added: 2026-11-07
    revised: 2026-11-07
  - name: defence_block
    status: active
    source: design/gdd/combat-defence.md
    referenced_by:
      - design/gdd/combat-defence.md
      - design/gdd/combat-damage-types.md
    variables:
      - block_unit
      - stage
      - flesh_block
      - n_body
      - gear_block
      - a_w
      - a_b
      - b_src
      - b_w
      - ws
    output_range: 0 to the hit's after-resistance total
    expression: "B_hit = block_unit[r]*stage*(flesh_block*n_body + gear_block*(min(a_w,1) + a_b) + sum b_src + sum_w b_w*(1+ws/100)); k_j = a_j*min(1, B_hit/sum a_i)"
    notes: "Flat block, once per hit, split by after-resistance size, never on ticks or Soul. A hit loses exactly min(B_hit, sum a_j)."
    added: 2026-11-07
    revised: ""
  - name: damage_parts
    status: active
    source: design/gdd/combat-damage-types.md
    referenced_by:
      - design/gdd/combat-damage-types.md
      - design/gdd/combat-defence.md
      - design/gdd/modifiers.md
      - design/gdd/effects.md
    variables:
      - s_j
      - type_j
      - c_k
      - hist_j
      - M
    output_range: shares sum to 1; at most 3 x authored parts
    expression: "a step is one source tier (art, Effects, modifiers); every c_k from one type in one step reads s_j at the step's start, scaled down if over 1; conversion X->Y share c_k spawns s_j*c_k of type Y with hist + {X}; at the step's end s_j <- s_j*(1 - sum c_k over that step's conversions that apply to j); a part at share 0 is removed; part_j = base*s_j*M(tags + hist_j + type_j)*crit; resistance and block read type_j only"
    notes: "At most 2 conversions per hit (one that moves nothing is not counted), fixed order (art, then Effects, then modifiers); never to or from Soul; never back to a type in hist; never changes a status tick's type. A hit is all Soul or has no Soul part (user decision 2026-11-08). Inside a step: compile order (slotted hosts, then unslotted, record id, listing order), the limit of 2 before scaling. Never to its own type. Modifier tier = convert_pct, one conversion per from -> to key, keys in type order (user decisions 2026-11-08 and 2026-11-08b DT-01, DT-02). A conversion that moves nothing is judged at the step's start and skipped. Conversions kept in earlier steps count toward the 2 (user decision 2026-11-08b, DT-03)."
    added: 2026-11-07
    revised: 2026-11-08
  - name: modifier_value
    status: active
    source: design/gdd/modifiers.md
    referenced_by:
      - design/gdd/modifiers.md
      - design/gdd/combat-defence.md
    variables:
      - B
      - breadth_mult
      - price
      - u
      - d
    output_range: "0 to about 215 units in the tree (25.8 W on a 0.3 W stat at x2.5); up to 500 at the 60 W top of B"
    expression: "value = d*floor(B*breadth_mult/(price*u) + 1e-6)*u"
    notes: "Turns a source's W budget into a plain modifier. Zero units means the stat cannot be carried; never raised to one unit. Effect payloads are exempt (Modifier System rule 12). Formulas C."
    added: 2026-11-07
    revised: 2026-11-08
