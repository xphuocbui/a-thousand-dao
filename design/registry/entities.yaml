    expression: "ward_slots = ward_slots_by_realm[r] + min(2, floor(divine_sense/(ward_slot_sense_step*ds_ref[r]))) + sum bonus_ward_slots"
    notes: "Free slots for wards only. Formulas D."
    added: 2026-11-07
    revised: ""
  - name: combat_healing
    status: active
    source: design/gdd/combat-defence.md
    referenced_by:
