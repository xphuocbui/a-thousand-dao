  - name: market_demand
    status: active
    source: design/gdd/regional-economy-trade.md
    referenced_by:
      - design/gdd/regional-economy-trade.md
      - design/gdd/sects.md
      - design/gdd/trade-goods.md
    variables:
      - pop_cultivators
      - basket
      - fill
      - W_set
      - d_scale
      - spend_T
      - works_due
      - P_eff
    output_range: [0, "no maximum"]
    # was: sum n*head_w before 2026-11-14; bmix added 2026-11-14 (design-review)
    # was: fill without a floor; calibration to S = D (design-review 7, 2026-11-14)
    # was: no craft_in term (before Trade Goods #45, 2026-11-14)
    expression: "D = d_scale*bmix*(sum n*basket*max(fill, sub_floor) + 50*W_set)*(1+shockD) + 0.5*(sum spend_T*mix + works_due*wmix) + craft_in + P_eff"
    # was: bmix herb 0.5 ore 0.2 beast 0.2 special 0.1 (before Trade Goods #45, 2026-11-14)
    notes: "RET Formula C. basket pegged to stipends 3/20/50/325/2,500 (L2); bmix herb 0.40 ore 0.2 beast 0.2 special 0.1 pill 0.10 (Trade Goods #45); d_scale calibrated in 0.5-3 (AC-RE-51) so world S/D = 1 + dk*(c_ref-1) (steady state at P = 1; AC-RE-57); fill from NPC wealth; sub_floor herb 0.5 beast 0.5 ore 0 special 0 (guess; user decision 2026-11-14, design-review 7), the part above fill moves goods and price, no money; goods_frac 0.5 (guess). Raw classes by rarity band (amended 2026-11-15, Trade Goods OQ14): D[(kind,b)] = bs[kind,b]*D_kind + craft_in + P_eff, bs = season-0 world supply share of the band."
    added: 2026-11-14
    revised: 2026-11-14
  - name: stock_update
    status: active
    source: design/gdd/regional-economy-trade.md
    referenced_by:
      - design/gdd/regional-economy-trade.md
      - design/gdd/trade-goods.md
    variables:
      - stock
      - S
      - D
      - dk
      - s_cap
    output_range: [0, "s_cap*max(D, D_min)"]
    # was: cap s_cap*D (design-review 7, 2026-11-14)
    expression: "stock' = min((1-dk)*max(0, stock+S-D), s_cap*max(D, D_min)); D_min = max(1, 0.05*calibrated D)"
    # was: start stock (c_ref-1)*D (design-review 6, 2026-11-14)
    notes: "RET Formula D. dk herb 0.20 beast 0.10 special 0.03 ore 0.01; s_cap 2/2/4/6 seasons (guesses). Start stock max(0, c_ref*D - S) per market and class. Amended 2026-11-15 (Trade Goods OQ14): the class total of Trade Goods Formula B; craft draw and player buys first, then the shared draw (exports first, then dk, the rest of demand max(0, D - craft_in), s_cap overflow) from shelved goods only, capped at shelved value; stock' = sum X', stock_sh' = sum of X' >= V_g. Raw classes per rarity band."
    added: 2026-11-14
    revised: 2026-11-14
  - name: market_price
    status: active
    source: design/gdd/regional-economy-trade.md
    referenced_by:
      - design/gdd/regional-economy-trade.md
      - design/gdd/travel-map.md
      - design/gdd/trade-goods.md
    variables:
      - cover
      - c_ref
      - epsilon
      - P_min
      - P_max
      - alpha
      - delta
    output_range: [0.5, 4.0]
    # was: P' = P*(P*/P)^0.5 and price_index = P' (design-review 4, 2026-11-14): GDD Formula E has P' = P*(P*/P)^alpha and price_index = p_loc
    expression: "P* = P_maxeff if c = 0 else clamp((c/c_ref)^-eps, P_min, P_maxeff); P' = clamp(P*(P*/P)^alpha, P/delta, P*delta); price_index[r,k] = p_loc[r,k] (= P' at access 1)"
    notes: "RET Formula E. Raw classes read shelved cover c = (stock_sh + S_sh)/max(D, D_min), D_min per rarity band (amended 2026-11-15, Trade Goods OQ14). Feeds Travel & Map price_index (D_f). Bands per class; Strained ceiling herb 3.0 ore 2.2 beast 2.5 special 4.0 (guesses). Cover divides by max(D, D_min), D_min = max(1, 0.05*calibrated D) (design-review 7, 2026-11-14); link_flow uses the same floor."
    added: 2026-11-14
    revised: 2026-11-14
  - name: link_flow
    status: active
    source: design/gdd/regional-economy-trade.md
    referenced_by:
      - design/gdd/regional-economy-trade.md
      - design/gdd/sects.md
      - design/gdd/trade-goods.md
    variables:
      - P_A
      - P_B
      - D_A
      - D_B
      - tariff
      - tau
      - trade_mult
      - safe_AB
      - cover
    output_range: [0, "Cap_AB"]
    # was: Q_close without cover, avail from S (before 2026-11-14 design-review)
    # was: avail_A = max(0, stock_A+S_pre_A-D_A) (before Trade Goods OQ14, 2026-11-15)
    expression: "gap = P_B*(1-tar) - P_A*(1+tau); Q = min(0.5*gap/(eps*(P_A/(max(c_A,0.5)*D_A)+P_B/(max(c_B,0.5)*D_B))), avail_A); avail_A = max(0, sum over shelved g of X_pre_A,g - max(0, D_A - craft_in_A)); Cap = 6000*min(trade_mult)*safe_AB"
    notes: "RET Formula F. Tariff paid by the importer's commons pool to its sect. Links resolved in ascending (id_A, id_B) order, classes herb/ore/beast/special (bands low to high, then crafted classes by id), avail depleted per flow (AC-RE-50). Exports first in the shared draw; every sum over markets in market-id order (Trade Goods OQ14, 2026-11-15)."
    added: 2026-11-14
    revised: 2026-11-14
  - name: shop_price
    status: active
    source: design/gdd/regional-economy-trade.md
    referenced_by:
      - design/gdd/regional-economy-trade.md
      - design/gdd/sects.md
      - design/gdd/item-database.md
      - design/gdd/trade-goods.md
    variables:
      - V
      - P
      - bm
      - sr
      - mi_luc
      - sect_standing
      - margin
      - tar_in
    output_range: [1, "no maximum"]
    # was: priced from P, no finished-goods band (design-review 4, 2026-11-14)
    # was: sell without slip (design-review 6, 2026-11-14)
    # was: no sf factor (before Trade Goods #45, 2026-11-14)
    expression: "buy = max(1, ceil(V*p_loc*sf*bm*(1-ch)*stp*mg_buy - 1e-6)); sell = max(1, floor(V*p_loc*sf*sr*(1+ch)*sts*mg_sell*(1-tar_in)*slip + 1e-6)); slip = (1 + (q_sold+V)/Dp)^(-eps); Dp = max(1, D_r*w_p/sum w); ch clamp +-0.20; finished goods use p_loc clamped to P*(1 +- loc_band_fin)"
    notes: "RET Formula G. Raw goods 1.10/0.90 with no charm or standing; finished 1.5/0.6 (built). player_cap 0.10. loc_band_fin 0.25 (guess; user decision 2026-11-14, design-review 3); raw goods keep loc_band 0.5. Sell slippage per place per season, q_sold resets each tick (user decision 2026-11-14, design-review 6). sf = Trade Goods scarcity_factor (1 for crafted classes and manuals); finished goods price from their own crafted class (RET rule 4, amended 2026-11-14)."
    added: 2026-11-14
    revised: 2026-11-14
  - name: sect_income
    status: active
    source: design/gdd/regional-economy-trade.md
    referenced_by:
      - design/gdd/regional-economy-trade.md
      - design/gdd/sects.md
      - design/gdd/trade-goods.md
    variables:
      - collect
      - value_lt
      - own_use
      - kind_stipend
      - P
      - tariff
    output_range: [0, "no maximum"]
    expression: "Inc = (0.5+0.5*collect)*mines + sum(max(0, collect*goods*acc - own_use - kind)*P*0.90) + tariffs; Buy_short = sum max(0, own_use + kind - collect*goods*acc)*P (cash out to the commons pool)"
    notes: "RET Formula I. Replaces Sects F3 collect*V_own and world_production_guess (Sects revision pending). own_use and kind_stipend are in kind, not cash (design-review 5, 2026-11-14): the goods_frac share of sect spending pays no cash to the commons. A shortfall beyond what the sect collected is bought in cash at P (design-review 6). Treasury surplus: Sects F3 invest is the only spender; inv_miss (0.5) of invest posted as missions (no fee on own board), the rest to a track as spend_T (cash half burned); F3 Tr' subtracts only the cash share c_inv; excess over R settles at N*(1-c_inv*inv_frac)/(c_inv*inv_frac) (RET Formula H; user decision 2026-11-14, design-review 7, replaces the design-review 6 band rule tb_seasons/tb_spend). Every F3 line has one payer (RET Formula H)."
    # was: treasury band tb_seasons 4, tb_spend 0.5, half burned half missions (design-review 6; replaced design-review 7, 2026-11-14)
    added: 2026-11-14
    revised: 2026-11-14
  - name: stone_cultivation
    status: active
    source: design/gdd/regional-economy-trade.md
    referenced_by:
      - design/gdd/regional-economy-trade.md
      - design/gdd/canh-gioi.md
    variables:
      - stones
      - spt
      - absorb_cap
      - rate
      - purse
      - reserve
    output_range: [0, "0.5*rate"]
    # was: NPC stones = 0.3*max(0, purse - reserve) before 2026-11-14; basket term moved inside the max 2026-11-14 (design-review 3)
    expression: "tv_stone = min(stones/spt[realm], 0.5*rate); NPC stones = 0.3*max(0, purse - reserve - basket_spend)"
    notes: "RET Formula J. spt 1/4/20/150/1,000 stones per tu vi (guesses). The main money sink; the provision basket (L2) is bought first. Realms Formulas I stone term pending."
    added: 2026-11-14
    revised: 2026-11-14
  - name: local_price
    status: active
    source: design/gdd/regional-economy-trade.md
    referenced_by:
      - design/gdd/regional-economy-trade.md
      - design/gdd/travel-map.md
      - design/gdd/trade-goods.md
    variables:
      - P
      - value_lt
      - D_r
      - acc_r
      - epsilon
      - loc_band
    output_range: ["P*(1-0.5)", "P*(1+0.5)"]
    # rho normalisation and D_r definition added 2026-11-14 (design-review 2)
    # was: bal = ((value_lt+1)/(D_r+1))/rho, no player term (design-review 6, 2026-11-14)
    expression: "p_loc = clamp(P * bal^(-eps*(1-acc)), P*(1-loc_band), P*(1+loc_band)); bal = ((value_lt+sell_pl+1)/(D_r+buy_pl+1))/rho; rho = sum value_lt / sum D_r over the market (1 if either sum is 0; no player term); D_r = d_scale*bmix*(sum n*basket*max(fill, sub_floor) + 50*W_set[r]) + goods_frac*works_due[r]*wmix; price_index[r] = p_loc"
    # was: D_r used fill without the sub_floor (design-review 7, 2026-11-14)
    notes: "RET Formula L1. loc_band 0.5 (guess). Shops price from p_loc; Travel & Map D_f reads it. rho keeps d_scale from biasing local prices. buy_pl/sell_pl: the player's trades in the region this season, uncapped (user decision 2026-11-14, design-review 6)."
    added: 2026-11-14
    revised: 2026-11-14
  - name: provision_basket
    status: active
    source: design/gdd/regional-economy-trade.md
    referenced_by:
      - design/gdd/regional-economy-trade.md
      - design/gdd/canh-gioi.md
      - design/gdd/trade-goods.md
    variables:
      - basket
      - bmix
      - p_loc
      - prov_max
      - purse
      - reserve
    output_range: [0, 0.15]
    expression: "basket_cost = sum basket*bmix*p_loc; fill = min(1, spent/basket_cost); prov = 0.15*fill; NPC basket_spend = min(basket_cost, max(0, purse-reserve))"
