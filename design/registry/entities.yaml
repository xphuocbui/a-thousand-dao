      - N
      - p_t_ref
    output_range: "p_t 0 to 1; roll_target 0.20 to 1"
    expression: "p_t = sum over draws of Pr(D)*prod_k P(win_k | state_k); measured p_t_hat = survived/N; roll_target = 0.20/max(p_t_ref, 0.20)"
    notes: "Measured by the Balance Harness. Answers canh-gioi.md Open Question 2 once measured."
    added: 2026-11-06
    revised: ""
  - name: tribulation_wave_loss
    status: active
