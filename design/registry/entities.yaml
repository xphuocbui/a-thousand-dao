  - name: market_supply
    status: active
    source: design/gdd/regional-economy-trade.md
    referenced_by:
      - design/gdd/regional-economy-trade.md
      - design/gdd/travel-map.md
      - design/gdd/sects.md
    variables:
      - value_lt
      - acc_r
      - collect
      - s_max
      - shockS
      - Imp
      - Exp
    output_range: [0, "no maximum"]
    expression: "S = h_f * sum(value_lt*acc*(1-shockS)) + Imp - Exp; h_f = 0.6 + 0.4*collect/s_max"
    notes: "RET Formula B. Base-value units (Travel & Map L)."
