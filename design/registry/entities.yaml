    output_range: [0, 8]
    expression: "gain_w = sum(amount_key*W_key) + tree_points*tree_point_w; gain_w <= min(quest_boon_w, quest_gain_cap_w - quest_gain_total_w)"
    notes: "Applied at the offer and again at payment. W prices from stat_power_weights; tree_point_w is the Đạo Đồ target 2.58."
