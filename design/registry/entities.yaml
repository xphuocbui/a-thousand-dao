    notes: "Formations F2, rule 9. fuel_frac 0.002/0.003/0.0045/0.007/0.01, fuel_growth 1.6 (guesses). A sink in Regional Economy Formula H. Example: Core Formation N=5 grade 2 L3 = 288."
