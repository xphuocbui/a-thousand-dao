# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

  - name: defence_resistance
    status: active
    source: design/gdd/combat-defence.md
    referenced_by:
      - design/gdd/combat-defence.md
      - design/gdd/combat-damage-types.md
    variables:
      - R_all
      - R_type
      - pen_part
      - resist_floor
      - cap_part
      - resist_cap
      - resist_cap_max
      - cap_raise
      - ws
    output_range: [-0.5, 0.9]
    expression: "R_j = R_all + R_type(j) - pen_j (points, no cap or floor); a_j = D_j*100/(100+R_j) if R_j >= 0, else D_j*(1 - R_j/100); R_x = R_x,other + sum_w R_w,x*(1 + ws/100) (2026-11-10)"
    notes: "All resistance plus the part's final damage type (combat-damage-types.md). Elements never enter resistance. Was general + kind + element (2026-11-07, same day); variables list updated 2026-11-08."
    added: 2026-11-07
    revised: 2026-11-08
  - name: defence_shield
    status: active
    source: design/gdd/combat-defence.md
    referenced_by:
      - design/gdd/combat-defence.md
      - design/gdd/combat-damage-types.md
    variables:
      - sigma
      - qi_max
      - ws
      - we
      - shield_recharge
      - recharge_delay
      - health_max
      - sigma_b
    output_range: "uncapped: each ward shield <= 0.50 x qi_max x (1 + ws/100); body shield = health_max x sum sigma_b"
    expression: "ward: S_w = sigma*qi_max*(1+ws/100), recharge after recharge_delay; body: S_body = health_max*sum sigma_b, never self-refills; sigma_b_gear = body_gear_shield*a_b; optional caps off by default (shield_total_cap, body_shield_cap), clipping maximum sizes at compile, later slots first"
    notes: "Ward shields and body shields are one shield concept; body armour is a shield. What passes a shield is data (ward: Soul + ticks; body: Soul + Chaos). Restoring a body shield counts as healing. Shields uncapped by user decision 2026-11-08; AC-CD-59 checks for stalls."
    added: 2026-11-07
    revised: 2026-11-08
  - name: ward_payment
    status: active
    source: design/gdd/combat-defence.md
    referenced_by:
      - design/gdd/combat-defence.md
    variables:
      - we
      - rho
      - res_eff
      - u
      - upkeep_growth
      - phi
      - drain_base
      - ws
      - R_pos
      - kappa
      - qi_max
    output_range: >= 0; reserved <= 0.9 x qi_max
    expression: "reserved = rho*(1 - min(res_eff,50)/100)/(1 + we/200); fee = phi*qi_max/(1+we/100); drain rate_w = drain_base/((1+ws/100)(1+we/100)); cast = kappa*qi_max/(1+we/100) (upkeep wards removed, #44)"
    notes: "Five payment models. Total payment never rises with ws (flat drain bill). Formulas C. Drain billing completed by user decision 2026-11-08."
    added: 2026-11-07
    revised: 2026-11-08
  - name: ward_slots
    status: active
    source: design/gdd/combat-defence.md
