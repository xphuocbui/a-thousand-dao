    notes: "Formations F1. grade_mult 1.0/1.15/1.3/1.5/1.75, level_growth 1.25 (guesses); share = carried_ground_share. L <= min(max_level, Tran Phap skill + 1); with the keystone Formation Within a Formation the maximum level is that cap + 2 (headroom, Formations F3)."
