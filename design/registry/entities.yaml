    output_range: "0.02 to 0.20 / 0.35 / 0.60 / 0.80 by tier"
    expression: "r = F_opp/F_player"
    notes: "F from Combat Formulas K. About the share of effective health the fight costs (Heavenly Tribulation Formulas C); not a win chance."
